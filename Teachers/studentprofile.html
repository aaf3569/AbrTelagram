<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1"/>
  <meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self' 'unsafe-inline' https://www.gstatic.com https://cdnjs.cloudflare.com https://cdn.jsdelivr.net; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com https://cdnjs.cloudflare.com; img-src 'self' data: blob: https:; font-src 'self' data: https://fonts.gstatic.com https://cdnjs.cloudflare.com; connect-src 'self' https://*.googleapis.com https://*.firebaseio.com wss://*.firebaseio.com https://*.gstatic.com; object-src 'none'; base-uri 'self'; form-action 'self'; frame-src 'none'; manifest-src 'self'; upgrade-insecure-requests; block-all-mixed-content">
<meta name="referrer" content="strict-origin-when-cross-origin">

  <title>ملف الطالب</title>

  <!-- Arabic font -->
  <link href="https://fonts.googleapis.com/css2?family=Noto+Kufi+Arabic:wght@300;400;500;600;700;800;900&display=swap" rel="stylesheet"/>

  <link rel="stylesheet" href="/shared/base.css" />
  <style>
    :root{
      --primary:#0a4b64;
      --primary-light:#0f6b86;
      --primary-soft:#e6f2f7;
      --page:#edf4f8;
      --page-deep:#dce9f0;
      --text:#102235;
      --muted:#61758a;
      --border:#d2e0e9;
      --card:#ffffff;
      --radius:20px;
      --shadow-1:0 8px 20px rgba(7,42,60,.10);
      --shadow-2:0 16px 40px rgba(7,42,60,.14);
      --shadow-3:0 24px 60px rgba(7,42,60,.20);
      --g:#0f8a4b;
      --g-bg:rgba(15,138,75,.12);
      --g-bg-hover:rgba(15,138,75,.18);
      --r:#b42318;
      --r-bg:rgba(180,35,24,.12);
      --r-bg-hover:rgba(180,35,24,.18);
      --y:#a06d00;
      --y-bg:rgba(160,109,0,.14);
      --y-bg-hover:rgba(160,109,0,.22);
    }

    *{box-sizing:border-box;margin:0;padding:0}
    html,body{
      height:100%;
      width:100%;
      max-width:100%;
      overflow-x:hidden;
      overscroll-behavior-x:none;
    }
    body{
      position:relative;
      overflow-x:clip;
      overscroll-behavior-y:none;
      color:var(--text);
      background:
        radial-gradient(1000px 520px at 110% -10%, rgba(15,107,134,.20), transparent 62%),
        radial-gradient(900px 600px at -18% 120%, rgba(10,75,100,.18), transparent 62%),
        linear-gradient(180deg, var(--page) 0%, var(--page-deep) 100%);
      font-family:"Noto Kufi Arabic", system-ui, -apple-system, Segoe UI, Roboto, Arial, sans-serif;
      line-height:1.6;
      font-weight:650;
      -webkit-tap-highlight-color:transparent;
    }
    body::before,
    body::after{
      content:"";
      position:fixed;
      pointer-events:none;
      z-index:0;
      filter:blur(2px);
    }
    body::before{
      width:280px;height:280px;
      top:14%;left:-90px;
      background:radial-gradient(circle at 50% 50%, rgba(15,107,134,.20), transparent 72%);
    }
    body::after{
      width:320px;height:320px;
      bottom:-90px;right:-70px;
      background:radial-gradient(circle at 50% 50%, rgba(10,75,100,.16), transparent 70%);
    }
    body.modal-open{overflow:hidden}
    button,input,textarea,select,summary{
      font-family:"Noto Kufi Arabic", system-ui, -apple-system, Segoe UI, Roboto, Arial, sans-serif;
    }

    .wrap{
      position:relative;
      z-index:1;
      width:100%;
      max-width:1040px;
      margin:0 auto;
      padding-inline:14px;
    }

    .site-header{
      position:sticky;
      top:0;
      z-index:20;
      background:rgba(255,255,255,.78);
      backdrop-filter:blur(12px);
      border-bottom:1px solid rgba(10,75,100,.15);
      box-shadow:0 8px 24px rgba(7,42,60,.08);
    }
    .head-row{
      min-height:72px;
      display:grid;
      grid-template-columns:1fr auto 1fr;
      align-items:center;
      gap:12px;
      padding-block:10px;
    }
    .page-title{
      grid-column:2;
      justify-self:center;
      color:var(--primary);
      font-weight:900;
      letter-spacing:.2px;
      font-size:clamp(1rem,2.9vw,1.2rem);
      text-align:center;
    }
    .back-btn{
      grid-column:1;
      justify-self:start;
      min-height:46px;
      padding:0 16px;
      border-radius:14px;
      border:1px solid rgba(10,75,100,.22);
      background:#fff;
      color:var(--primary);
      font-weight:900;
      cursor:pointer;
      display:inline-flex;
      align-items:center;
      gap:8px;
      box-shadow:0 6px 14px rgba(7,42,60,.10);
      transition:transform .2s ease, box-shadow .2s ease, border-color .2s ease;
    }
    .back-btn:hover{
      border-color:rgba(10,75,100,.40);
      box-shadow:0 10px 20px rgba(7,42,60,.14);
      transform:translateY(-1px);
    }

    main.wrap{
      padding-block:20px 42px;
      display:grid;
      gap:16px;
    }
    main.wrap > *{
      animation:riseIn .45s both;
    }
    main.wrap > *:nth-child(2){animation-delay:.05s}
    main.wrap > *:nth-child(3){animation-delay:.10s}
    main.wrap > *:nth-child(4){animation-delay:.15s}
    @keyframes riseIn{
      from{opacity:0;transform:translateY(14px)}
      to{opacity:1;transform:translateY(0)}
    }

    .profile-hero{
      background:
        radial-gradient(430px 180px at 18% 0%, rgba(255,255,255,.30), transparent 72%),
        linear-gradient(135deg, #0d5a75 0%, #0e6f88 48%, #0f526f 100%);
      border:1px solid rgba(255,255,255,.35);
      border-radius:24px;
      padding:18px;
      box-shadow:var(--shadow-2);
      color:#f5fbff;
      display:grid;
      justify-items:center;
      text-align:center;
      gap:6px;
    }
    .stu{
      display:grid;
      gap:4px;
      align-items:center;
      justify-items:center;
      text-align:center;
    }
    .stu-name{
      font-weight:900;
      color:#ffffff;
      font-size:clamp(1.2rem,4.1vw,1.8rem);
      line-height:1.3;
      text-wrap:balance;
    }
    .stu-class{
      color:rgba(238,248,255,.92);
      font-weight:850;
      font-size:1rem;
    }

    .specialcase-banner{
      display:none;
      gap:10px;
      background:linear-gradient(160deg, rgba(160,109,0,.14), rgba(255,255,255,.85));
      border:1px solid rgba(160,109,0,.26);
      border-radius:18px;
      box-shadow:var(--shadow-1);
      padding:14px 15px;
      position:relative;
      overflow:hidden;
    }
    .specialcase-banner.show{display:grid}
    .specialcase-banner::before{
      content:"";
      position:absolute;
      inset:0;
      pointer-events:none;
      background:radial-gradient(520px 190px at 15% 0%, rgba(160,109,0,.14), transparent 66%);
    }
    .specialcase-top,
    .specialcase-reason{
      position:relative;
      z-index:1;
    }
    .specialcase-top{
      display:flex;
      align-items:center;
      justify-content:space-between;
      gap:8px;
      flex-wrap:wrap;
    }
    .specialcase-badge{
      display:inline-flex;
      align-items:center;
      gap:8px;
      width:fit-content;
      padding:6px 11px;
      border-radius:999px;
      border:1px solid rgba(160,109,0,.30);
      color:var(--y);
      background:rgba(255,255,255,.66);
      font-size:.84rem;
      font-weight:900;
    }
    .specialcase-title{
      color:var(--primary);
      font-size:.92rem;
      font-weight:900;
    }
    .specialcase-reason{
      color:#0f2743;
      font-size:.96rem;
      line-height:1.7;
      word-break:break-word;
      font-weight:850;
    }
    .specialcase-reason .k{
      color:var(--muted);
      font-weight:900;
      margin-inline-end:8px;
    }
    .specialcase-reason .v{font-weight:900}

    .actions-card,
    .filters-wrap,
    .notes-wrap{
      background:rgba(255,255,255,.90);
      border:1px solid var(--border);
      border-radius:var(--radius);
      box-shadow:var(--shadow-1);
      padding:14px;
    }
    .actions-head{
      display:grid;
      gap:2px;
      margin-bottom:12px;
    }
    .section-title{
      color:var(--primary);
      font-size:1.02rem;
      font-weight:900;
      line-height:1.3;
    }
    .section-subtitle{
      color:var(--muted);
      font-size:.88rem;
      font-weight:800;
    }
    .actions{
      display:grid;
      grid-template-columns:repeat(3, minmax(0,1fr));
      gap:10px;
    }
    .btn{
      border:1px solid var(--border);
      border-radius:15px;
      min-height:52px;
      padding:11px 14px;
      cursor:pointer;
      font-size:.94rem;
      font-weight:900;
      letter-spacing:.1px;
      background:#fff;
      color:var(--text);
      box-shadow:0 6px 14px rgba(7,42,60,.10);
      transition:transform .2s ease, box-shadow .2s ease, background-color .2s ease, border-color .2s ease;
      user-select:none;
    }
    .btn:hover{
      transform:translateY(-1px);
      box-shadow:0 10px 20px rgba(7,42,60,.14);
    }
    .btn:focus-visible{
      outline:none;
      box-shadow:0 0 0 3px rgba(10,75,100,.16);
    }
    .btn.pos{
      background:var(--g-bg);
      color:var(--g);
      border-color:rgba(15,138,75,.28);
    }
    .btn.pos:hover{background:var(--g-bg-hover)}
    .btn.neg{
      background:var(--r-bg);
      color:var(--r);
      border-color:rgba(180,35,24,.30);
    }
    .btn.neg:hover{background:var(--r-bg-hover)}
    .btn.gen{
      background:var(--y-bg);
      color:var(--y);
      border-color:rgba(160,109,0,.32);
    }
    .btn.gen:hover{background:var(--y-bg-hover)}

    .filters-wrap{padding:10px}
    .filters{
      display:flex;
      gap:8px;
      overflow:auto;
      scrollbar-width:none;
    }
    .filters::-webkit-scrollbar{display:none}
    .chip{
      flex:0 0 auto;
      border:1px solid var(--border);
      border-radius:999px;
      background:#fff;
      min-height:40px;
      padding:8px 12px;
      cursor:pointer;
      display:inline-flex;
      align-items:center;
      gap:8px;
      font-size:.88rem;
      font-weight:900;
      color:var(--text);
      transition:all .2s ease;
      white-space:nowrap;
    }
    .chip span{
      display:inline-flex;
      align-items:center;
      justify-content:center;
      min-width:24px;
      height:24px;
      padding-inline:6px;
      border-radius:999px;
      border:1px solid rgba(10,75,100,.16);
      background:var(--primary-soft);
      color:var(--primary);
      font-size:.8rem;
      font-weight:900;
    }
    .chip:hover{
      border-color:rgba(10,75,100,.32);
      box-shadow:0 6px 14px rgba(7,42,60,.12);
    }
    .chip.active{
      background:linear-gradient(145deg, var(--primary), var(--primary-light));
      border-color:transparent;
      color:#fff;
      box-shadow:0 12px 26px rgba(10,75,100,.24);
    }
    .chip.active span{
      background:rgba(255,255,255,.16);
      border-color:rgba(255,255,255,.35);
      color:#fff;
    }

    .notes-wrap{
      padding:12px;
      display:grid;
      gap:12px;
    }
    .list{
      display:grid;
      gap:12px;
    }
    details.note{
      background:var(--card);
      border:1px solid var(--border);
      border-radius:18px;
      overflow:hidden;
      box-shadow:0 6px 14px rgba(7,42,60,.09);
      transition:box-shadow .2s ease, transform .2s ease, border-color .2s ease;
    }
    details.note:hover{
      transform:translateY(-1px);
      box-shadow:0 14px 28px rgba(7,42,60,.12);
    }
    details.note[open]{
      box-shadow:0 18px 34px rgba(7,42,60,.14);
    }
    details.note.positive{border-inline-start:4px solid var(--g)}
    details.note.negative{border-inline-start:4px solid var(--r)}
    details.note.general{border-inline-start:4px solid var(--y)}
    summary{
      list-style:none;
      cursor:pointer;
      display:grid;
      grid-template-columns:1fr auto;
      gap:10px;
      align-items:center;
      padding:14px 16px;
    }
    summary::-webkit-details-marker{display:none}
    summary::after{
      content:"+";
      width:28px;
      height:28px;
      border-radius:999px;
      border:1px solid rgba(10,75,100,.22);
      display:grid;
      place-items:center;
      color:var(--primary);
      font-weight:900;
      font-size:1rem;
      transition:transform .2s ease, background-color .2s ease;
      grid-column:2;
      grid-row:1 / span 2;
    }
    details.note[open] summary::after{
      transform:rotate(45deg);
      background:var(--primary-soft);
    }
    summary .title{
      display:inline-flex;
      align-items:center;
      gap:8px;
      min-width:0;
      font-size:.98rem;
      font-weight:900;
      color:var(--text);
    }
    summary .meta{
      color:var(--muted);
      font-size:.84rem;
      font-weight:850;
      display:inline-flex;
      align-items:center;
      gap:6px;
      grid-column:1;
    }
    .type-dot{
      width:10px;
      height:10px;
      border-radius:50%;
      display:inline-block;
      flex-shrink:0;
    }
    .dot-pos{background:var(--g)}
    .dot-neg{background:var(--r)}
    .dot-gen{background:var(--y)}
    .note-body{
      border-top:1px dashed var(--border);
      padding:12px 16px 14px;
      display:grid;
      gap:10px;
      background:linear-gradient(180deg, rgba(244,249,252,.70), rgba(255,255,255,.96));
    }
    .kv{
      background:#fff;
      border:1px solid rgba(10,75,100,.10);
      border-radius:12px;
      padding:10px 11px;
      line-height:1.75;
    }
    .kv .k{
      color:var(--muted);
      font-weight:850;
    }
    .kv .v{
      color:var(--text);
      font-weight:850;
    }
    .note-actions{
      margin-top:2px;
      display:flex;
      gap:10px;
      flex-wrap:wrap;
    }
    .btn.del{
      min-height:42px;
      padding:9px 13px;
      border-radius:12px;
      background:#fff;
      color:var(--r);
      border-color:rgba(180,35,24,.34);
      box-shadow:none;
    }
    .btn.del:hover{background:var(--r-bg)}
    .empty{
      text-align:center;
      color:var(--muted);
      background:rgba(255,255,255,.90);
      border:1px dashed var(--border);
      border-radius:16px;
      padding:18px 14px;
      font-size:.95rem;
      font-weight:850;
    }

    .modal{
      position:fixed;
      inset:0;
      display:none;
      place-items:center;
      background:rgba(10,26,41,.45);
      backdrop-filter:blur(5px);
      z-index:1000;
      padding:14px;
    }
    .modal.open{display:grid}
    .modal-sheet{
      width:min(620px,96vw);
      max-height:92vh;
      background:var(--card);
      border:1px solid var(--border);
      border-radius:20px;
      overflow:hidden;
      box-shadow:var(--shadow-3);
      animation:modalIn .22s ease both;
      display:grid;
      grid-template-rows:auto 1fr auto;
    }
    @keyframes modalIn{
      from{opacity:0;transform:translateY(14px) scale(.985)}
      to{opacity:1;transform:translateY(0) scale(1)}
    }
    .modal-head{
      padding:14px 16px;
      display:flex;
      align-items:center;
      justify-content:space-between;
      gap:10px;
      border-bottom:1px solid var(--border);
      background:linear-gradient(180deg, #ffffff 0%, #f7fbfe 100%);
      color:var(--primary);
      font-weight:900;
      font-size:1.02rem;
    }
    .close-x{
      border:1px solid rgba(10,75,100,.22);
      background:#fff;
      color:var(--muted);
      width:34px;
      height:34px;
      border-radius:11px;
      font-size:1rem;
      font-weight:900;
      cursor:pointer;
      transition:all .2s ease;
    }
    .close-x:hover{
      color:var(--primary);
      border-color:rgba(10,75,100,.40);
      background:var(--primary-soft);
    }
    .modal-body{
      padding:14px 16px;
      background:#fff;
      display:grid;
      gap:11px;
      overflow:auto;
    }
    .row{display:grid;gap:6px}
    label{
      color:var(--muted);
      font-size:.90rem;
      font-weight:900;
    }
    input[type="text"],
    textarea,
    input[type="date"]{
      width:100%;
      border:1px solid var(--border);
      border-radius:12px;
      min-height:46px;
      padding:10px 11px;
      background:#fff;
      color:var(--text);
      font-size:.96rem;
      font-weight:700;
      transition:border-color .2s ease, box-shadow .2s ease;
    }
    textarea{
      min-height:104px;
      resize:vertical;
    }
    input:focus-visible,
    textarea:focus-visible{
      outline:none;
      border-color:rgba(10,75,100,.42);
      box-shadow:0 0 0 3px rgba(10,75,100,.12);
    }
    .modal-actions{
      padding:12px 16px 16px;
      display:flex;
      gap:10px;
      flex-wrap:wrap;
      border-top:1px solid var(--border);
      background:linear-gradient(180deg, #ffffff 0%, #f7fbfe 100%);
    }
    .btn.primary{
      border:none;
      color:#fff;
      background:linear-gradient(145deg, var(--primary), var(--primary-light));
    }
    .btn.ghost{
      background:#fff;
      color:var(--primary);
      border-color:rgba(10,75,100,.28);
    }

    @media (max-width:920px){
      .actions{grid-template-columns:1fr 1fr}
      .actions .btn:last-child{grid-column:1 / -1}
    }
    @media (max-width:640px){
      body::before,
      body::after{
        display:none;
      }
      .wrap{padding-inline:12px}
      .head-row{min-height:66px}
      .page-title{font-size:.95rem}
      .back-btn{min-height:42px;padding-inline:13px}
      main.wrap{padding-block:15px 28px;gap:12px}
      .profile-hero{padding:14px 13px;border-radius:20px}
      .stu-name{font-size:1.15rem}
      .stu-class{font-size:.92rem}
      .actions-card,.filters-wrap,.notes-wrap{padding:11px}
      .actions-head{text-align:center}
      .actions{grid-template-columns:1fr}
      .btn{min-height:48px;font-size:.91rem}
      .filters{
        overflow:visible;
        flex-wrap:wrap;
        justify-content:center;
      }
      .chip{min-height:37px;padding:7px 11px;font-size:.84rem}
      .chip span{min-width:22px;height:22px;font-size:.76rem}
      details.note{border-radius:14px}
      summary{padding:12px 12px}
      summary .title{font-size:.92rem}
      summary .meta{font-size:.8rem}
      summary::after{width:24px;height:24px;font-size:.94rem}
      .note-body{padding:10px 12px 12px}
      .kv{padding:9px 10px}
      .modal{
        align-items:center;
        padding:12px;
      }
      .modal-sheet{
        width:min(96vw, 560px);
        max-height:92vh;
        border-radius:18px;
        border:1px solid var(--border);
        animation:modalIn .22s ease both;
      }
      .modal-head{padding:13px 12px}
      .modal-body{padding:12px}
      .modal-actions{padding:10px 12px 14px}
      .modal-actions .btn{flex:1 1 0}
    }
  </style>

<body>
  <header class="site-header">
    <div class="wrap">
      <div class="head-row">
        <button id="backBtn" class="back-btn" type="button" aria-label="رجوع">
          <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
            <path d="M19 12H5M12 19l-7-7 7-7"/>
          </svg>
          رجوع
        </button>
        <div class="page-title">ملف الطالب</div>
      </div>
    </div>
  </header>

  <main class="wrap">
    <section class="profile-hero" aria-label="معلومات الطالب">
      <div class="stu">
        <h1 class="stu-name" id="stuName">—</h1>
        <p class="stu-class" id="stuClass">—</p>
      </div>
    </section>

    <div id="specialCaseBanner" class="specialcase-banner" aria-live="polite">
      <div class="specialcase-top">
        <span class="specialcase-badge">حالة خاصة</span>
        <span class="specialcase-title">معلومة للمعلم فقط</span>
      </div>
      <div class="specialcase-reason">
        <span class="k">السبب:</span>
        <span id="specialCaseReasonText" class="v">—</span>
      </div>
    </div>

    <section class="actions-card" aria-label="إجراءات الملاحظات">
      <div class="actions-head">
        <h2 class="section-title">إضافة جديدة</h2>
        <p class="section-subtitle">اختر نوع الملاحظة قبل إدخال التفاصيل</p>
      </div>
      <div class="actions">
        <button class="btn pos" id="addPositive" type="button">تسجيل إيجابية</button>
        <button class="btn neg" id="addNegative" type="button">تسجيل سلبية</button>
        <button class="btn gen" id="addGeneral" type="button">تسجيل ملاحظة</button>
      </div>
    </section>

    <section class="filters-wrap" aria-label="تصفية الملاحظات">
      <div class="filters" id="filters">
        <button class="chip active" data-filter="all" type="button">الكل <span id="c-all">0</span></button>
        <button class="chip" data-filter="positive" type="button">إيجابية <span id="c-pos">0</span></button>
        <button class="chip" data-filter="negative" type="button">سلبية <span id="c-neg">0</span></button>
        <button class="chip" data-filter="general" type="button">ملاحظة <span id="c-gen">0</span></button>
      </div>
    </section>

    <section class="notes-wrap" aria-label="قائمة الملاحظات">
      <div class="list" id="notesList">
        <div class="empty">لا توجد ملاحظات بعد.</div>
      </div>
    </section>
  </main>

  <!-- centered custom modal -->
  <div class="modal" id="noteModal" aria-hidden="true">
    <div class="modal-sheet" role="dialog" aria-modal="true" aria-labelledby="dlgTitle">
      <div class="modal-head">
        <div id="dlgTitle">إضافة ملاحظة</div>
        <button class="close-x" id="closeX" aria-label="إغلاق">✕</button>
      </div>

      <div class="modal-body">
        <div class="row">
          <label for="title">العنوان</label>
          <input id="title" type="text" required />
        </div>
        <div class="row">
          <label for="desc">الوصف</label>
          <textarea id="desc" required></textarea>
        </div>
        <div class="row">
          <label for="act">الإجراء المتخذ</label>
          <input id="act" type="text" required />
        </div>
        <div class="row">
          <label for="date">التاريخ</label>
          <input id="date" type="date" required />
        </div>
      </div>

      <div class="modal-actions">
        <button class="btn primary" id="saveNote" type="button">حفظ</button>
        <button class="btn ghost" id="cancelNote" type="button">إلغاء</button>
      </div>
    </div>
  </div>

  <script type="module">
    import { firebaseConfig } from "/shared/firebase.js";
    /* ========= Firebase ========= */
    import { initializeApp, getApp, getApps } from "/shared/firebase.js";
    import { getAuth, onAuthStateChanged } from "/shared/firebase.js";
    import {
      initializeFirestore, persistentSingleTabManager, doc, getDoc, collection, addDoc, serverTimestamp,
      getDocs, deleteDoc, query, orderBy
    } from "/shared/firebase.js";



    const app = getApps().length ? getApp() : initializeApp(firebaseConfig);
    let db;
    try {
      db = initializeFirestore(app, { localCache: persistentSingleTabManager(), experimentalAutoDetectLongPolling: true, useFetchStreams: false });
    } catch (e) {
      db = initializeFirestore(app, { experimentalAutoDetectLongPolling: true, useFetchStreams: false });
    }
    const auth = getAuth(app);

    /* ========= URL params ========= */
    const qp = new URLSearchParams(location.search);
    const studentId    = qp.get('id')    || '';
    const studentName  = qp.get('name')  || '—';
    const studentClass = qp.get('class') || '—';
    document.getElementById('stuName').textContent  = studentName;
    document.getElementById('stuClass').textContent = studentClass;

    /* ========= Back button ========= */
    document.getElementById('backBtn').addEventListener('click', ()=>{
      if (history.length > 1) history.back();
      else location.href = '/index.html';
    });

    /* ========= State ========= */
    const notesListEl = document.getElementById('notesList');
    const counters = { all:0, positive:0, negative:0, general:0 };
    let filter = 'all';
    let teacherId = null;

    const paths = {
      positive: 'positiveNotes',
      negative: 'negativeNotes',
      general:  'generalNotes',
    };

    /* ========= Special case banner (read-only) ========= */
    const specialCaseBanner = document.getElementById('specialCaseBanner');
    const specialCaseReasonText = document.getElementById('specialCaseReasonText');

    async function loadSpecialCaseReason(){
      try{
        if(!studentId) { specialCaseBanner.classList.remove('show'); return; }

        const stRef = doc(db, 'students', studentId);
        const snap = await getDoc(stRef);

        if(!snap.exists()){
          specialCaseBanner.classList.remove('show');
          return;
        }

        const d = snap.data() || {};

        // Expect: { specialCase: true, specialCaseReason: "..." }
        const isSpecial = d.specialCase === true;

        // Allow a few fallback field names, just in case your DB uses a different key
        const reason =
          (typeof d.specialCaseReason === 'string' && d.specialCaseReason.trim()) ? d.specialCaseReason.trim() :
          (typeof d.specialCase_reason === 'string' && d.specialCase_reason.trim()) ? d.specialCase_reason.trim() :
          (typeof d.specialCaseNote === 'string' && d.specialCaseNote.trim()) ? d.specialCaseNote.trim() :
          (typeof d.reason === 'string' && d.reason.trim()) ? d.reason.trim() :
          '';

        if(isSpecial && reason){
          specialCaseReasonText.textContent = reason;
          specialCaseBanner.classList.add('show');
        }else{
          specialCaseBanner.classList.remove('show');
        }
      }catch(e){
        console.error('loadSpecialCaseReason failed', e);
        specialCaseBanner.classList.remove('show');
      }
    }

    /* ========= Modal helpers ========= */
    const modal   = document.getElementById('noteModal');
    const dlgTitle= document.getElementById('dlgTitle');
    const fldTitle= document.getElementById('title');
    const fldDesc = document.getElementById('desc');
    const fldAct  = document.getElementById('act');
    const fldDate = document.getElementById('date');
    const cancelBtn = document.getElementById('cancelNote');
    const closeX  = document.getElementById('closeX');
    let pendingType = 'general';

    function openModal(type){
      pendingType = type;
      dlgTitle.textContent = type==='positive' ? 'إضافة إيجابية' :
                             type==='negative' ? 'إضافة سلبية'   : 'إضافة ملاحظة';

      // default date: today (Asia/Kuwait)
      const nowKW = new Date(new Date().toLocaleString('en-US', { timeZone: 'Asia/Kuwait' }));
      fldTitle.value=''; fldDesc.value=''; fldAct.value='';
      fldDate.value = `${nowKW.getFullYear()}-${String(nowKW.getMonth()+1).padStart(2,'0')}-${String(nowKW.getDate()).padStart(2,'0')}`;

      modal.classList.add('open');
      modal.setAttribute('aria-hidden','false');
      document.body.classList.add('modal-open');
      setTimeout(()=> fldTitle.focus(), 10);
    }
    function closeModal(){
      modal.classList.remove('open');
      modal.setAttribute('aria-hidden','true');
      document.body.classList.remove('modal-open');
    }

    document.getElementById('addPositive').onclick = ()=> openModal('positive');
    document.getElementById('addNegative').onclick = ()=> openModal('negative');
    document.getElementById('addGeneral').onclick  = ()=> openModal('general');

    // Cancel / X / backdrop / Esc
    cancelBtn.addEventListener('click', closeModal);
    closeX.addEventListener('click', closeModal);
    modal.addEventListener('click', (e)=>{ if(e.target === modal) closeModal(); });
    document.addEventListener('keydown', (e)=>{ if(e.key === 'Escape' && modal.classList.contains('open')) closeModal(); });

    /* ========= Auth gate + initial load ========= */
    onAuthStateChanged(auth, async (user)=>{
      if(!user){ alert('يرجى تسجيل الدخول'); location.href='/index.html'; return; }
      teacherId = user.uid;

      // Read-only banner for teachers
      await loadSpecialCaseReason();

      // Load notes
      await loadAll();
    });

    /* ========= Loading notes ========= */
    async function loadAll(){
      const lists = await Promise.all([
        loadType('positive'),
        loadType('negative'),
        loadType('general'),
      ]);
      const all = lists.flat().sort((a,b)=> b.dateMs - a.dateMs);
      counters.positive = lists[0].length;
      counters.negative = lists[1].length;
      counters.general  = lists[2].length;
      counters.all = all.length;
      updateCounters();
      renderList(all);
    }

    async function loadType(type){
      const col = collection(db, 'students', studentId, 'notes_by_teacher', teacherId, paths[type]);
      const qy  = query(col, orderBy('date', 'desc'));
      const snap= await getDocs(qy);
      const arr = [];
      snap.forEach(d=>{
        const data = d.data() || {};
        const dt   = data.date?.toDate ? data.date.toDate() : (data.date instanceof Date ? data.date : null);
        arr.push({
          id: d.id,
          type,
          title: data.title || '',
          description: data.description || '',
          actionTaken: data.actionTaken || '',
          date: dt,
          dateMs: dt ? dt.getTime() : 0,
          refPath: d.ref.path
        });
      });
      return arr;
    }

    function updateCounters(){
      document.getElementById('c-all').textContent = counters.all;
      document.getElementById('c-pos').textContent = counters.positive;
      document.getElementById('c-neg').textContent = counters.negative;
      document.getElementById('c-gen').textContent = counters.general;
    }

    /* ========= Render ========= */
    function renderList(all){
      notesListEl.innerHTML = '';
      const filtered = all.filter(n => filter==='all' ? true : n.type===filter);
      if(filtered.length===0){
        const empty = document.createElement('div');
        empty.className='empty';
        empty.textContent='لا توجد ملاحظات.';
        notesListEl.appendChild(empty);
        return;
      }

      filtered.forEach(n=>{
        const det = document.createElement('details');
        det.className = `note ${n.type}`;
        const dotClass = n.type==='positive' ? 'dot-pos' : n.type==='negative' ? 'dot-neg' : 'dot-gen';
        const typeText = n.type==='positive' ? 'إيجابية' : n.type==='negative' ? 'سلبية' : 'ملاحظة';
        const dateStr = n.date ? new Intl.DateTimeFormat('ar-KW',{dateStyle:'medium'}).format(n.date) : '—';

        det.innerHTML = `
          <summary>
            <span class="title">
              <span class="type-dot ${dotClass}"></span>
              ${escapeHtml(n.title || '—')}
            </span>
            <span class="meta">${typeText} • ${dateStr}</span>
          </summary>
          <div class="note-body">
            <div class="kv"><span class="k">الوصف:</span> <span class="v">${nl2br(escapeHtml(n.description||'—'))}</span></div>
            <div class="kv"><span class="k">الإجراء المتخذ:</span> <span class="v">${nl2br(escapeHtml(n.actionTaken||'—'))}</span></div>
            <div class="note-actions">
              <button class="btn del" data-del="${n.refPath}" type="button">حذف الملاحظة</button>
            </div>
          </div>
        `;
        notesListEl.appendChild(det);
      });

      // wire delete buttons
      notesListEl.querySelectorAll('button[data-del]').forEach(btn=>{
        btn.addEventListener('click', async ()=>{
          const path = btn.getAttribute('data-del');
          const ok = confirm('تأكيد حذف الملاحظة؟ لا يمكن التراجع.');
          if(!ok) return;
          try{
            await deleteDoc(doc(db, path));
            await loadAll();
          }catch(e){
            console.error(e);
            alert('تعذّر الحذف.');
          }
        });
      });
    }

    function escapeHtml(s){ return String(s).replace(/[&<>"]/g, m=>({ '&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;' }[m])); }
    function nl2br(s){ return s.replace(/\n/g,'<br>'); }

    /* ========= Filters ========= */
    document.getElementById('filters').addEventListener('click', (e)=>{
      const btn = e.target.closest('.chip'); if(!btn) return;
      document.querySelectorAll('.chip').forEach(c=>c.classList.remove('active'));
      btn.classList.add('active');
      filter = btn.dataset.filter;
      loadAll();
    });

    /* ========= Save ========= */
    document.getElementById('saveNote').addEventListener('click', async ()=>{
      if(!fldTitle.value.trim() || !fldDesc.value.trim() || !fldAct.value.trim() || !fldDate.value){
        alert('يرجى تعبئة جميع الحقول.');
        return;
      }
      try{
        const user = auth.currentUser;
        if(!user){ alert('يرجى تسجيل الدخول'); return; }

        // subcollection path
        const colRef  = collection(db, 'students', studentId, 'notes_by_teacher', user.uid, paths[pendingType]);

        // Convert YYYY-MM-DD to UTC midnight Date
        const [y,m,d] = fldDate.value.split('-').map(Number);
        const date = new Date(Date.UTC(y, m-1, d, 0, 0, 0));

        await addDoc(colRef, {
          title: fldTitle.value.trim(),
          description: fldDesc.value.trim(),
          actionTaken: fldAct.value.trim(),
          date,
          studentName: studentName || null,
          studentClass: studentClass || null,
          createdAt: serverTimestamp(),
          updatedAt: serverTimestamp(),
          createdBy: user.uid,
          updatedBy: user.uid
        });

        closeModal();
        await loadAll();
      }catch(e){
        console.error(e);
        alert('تعذّر الحفظ.');
      }
    });
  </script>
  <script src="/shared/hub-title-link.js" defer></script>
<script src="/name-glow.js" defer></script>
</body>
</html>
