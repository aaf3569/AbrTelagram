<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1"/>
  <meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self' 'unsafe-inline' https://www.gstatic.com https://cdnjs.cloudflare.com https://cdn.jsdelivr.net; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com https://cdnjs.cloudflare.com; img-src 'self' data: blob: https:; font-src 'self' data: https://fonts.gstatic.com https://cdnjs.cloudflare.com; connect-src 'self' https://*.googleapis.com https://*.firebaseio.com wss://*.firebaseio.com https://*.gstatic.com https://cdn.jsdelivr.net https://cdnjs.cloudflare.com; object-src 'none'; base-uri 'self'; form-action 'self'; frame-src 'none'; manifest-src 'self'; upgrade-insecure-requests; block-all-mixed-content">
<meta name="referrer" content="strict-origin-when-cross-origin">
<meta http-equiv="Permissions-Policy" content="camera=(), microphone=(), geolocation=()">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="preconnect" href="https://www.gstatic.com" crossorigin>
  <title>جدول المعلّم - ثانوية أحمد البشر الرومي</title>
  <link href="https://fonts.googleapis.com/css2?family=Noto+Kufi+Arabic:wght@300;400;500;600;700;800;900&display=swap" rel="stylesheet"/>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">

  <link rel="stylesheet" href="/shared/base.css" />
  <style>
    :root {
      --primary: #022b42;
      --primary-2: #044563;
      --primary-light: rgba(2, 43, 66, 0.08);
      --page: #f8fafc;
      --card-bg: #ffffff;
      --text: #0f172a;
      --text-light: #475569;
      --muted: #64748b;
      --border: #e2e8f0;
      --border-light: #f1f5f9;
      --radius: 16px;
      --radius-sm: 12px;
      --shadow-1: 0 4px 12px rgba(2, 43, 66, 0.08);
      --shadow-2: 0 10px 25px rgba(2, 43, 66, 0.12);
      --headerText: #ffffff;
      --focus: #79b3c8;
      --success: #10b981;
      --danger: #ef4444;
      --warning: #f59e0b;
      --transition: transform .12s ease, box-shadow .12s ease, background-color .12s ease, border-color .12s ease, color .12s ease, opacity .12s ease;
    }

    * { box-sizing: border-box; margin: 0; padding: 0; }
    html, body { height: 100%; }
    body {
      background: var(--page);
      color: var(--text);
      font-family: "Noto Kufi Arabic", system-ui, -apple-system, Segoe UI, Roboto, Arial, sans-serif;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      line-height: 1.6;
      -webkit-tap-highlight-color: transparent;
    }

    body.modal-open { overflow: hidden; }

    /* Header */
    .site-header {
      position: sticky; top: 0; z-index: 20;
      background: rgba(255, 255, 255, 0.85);
      backdrop-filter: blur(12px); -webkit-backdrop-filter: blur(12px);
      border-bottom: 1px solid rgba(2, 43, 66, 0.08);
      box-shadow: 0 2px 10px rgba(2, 43, 66, 0.06);
      padding: 16px 20px;
    }
    .header-container {
      max-width: 1200px; margin: 0 auto;
      display: flex; justify-content: space-between; align-items: center; gap: 16px;
    }
    .site-title {
      font-weight: 900;
      font-size: clamp(1.2rem, 2.5vw, 1.5rem);
      color: var(--primary);
      display: flex; align-items: center; gap: 10px;
    }
    .site-title i { font-size: 1.3em; }
    .top-info { display: flex; gap: 12px; align-items: center; flex-wrap: wrap; }

    .badge {
      padding: 6px 14px; border-radius: 999px; background: var(--primary-light);
      border: 1px solid var(--border); color: var(--primary);
      font-weight: 800; font-size: 12px; display: flex; align-items: center; gap: 6px;
    }
    .badge i { font-size: 0.9em; }

    /* Buttons */
    .filter-btn {
      height: 44px; padding: 0 18px; border-radius: var(--radius-sm);
      border: 1px solid rgba(2, 43, 66, 0.2); background: var(--card-bg); color: var(--primary);
      font-weight: 800; cursor: pointer; box-shadow: var(--shadow-1); transition: var(--transition);
      display: inline-flex; align-items: center; gap: 8px; font-size: 0.9rem; position: relative;
      font-family: "Noto Kufi Arabic", system-ui, -apple-system, Segoe UI, Roboto, Arial, sans-serif;
    }
    .filter-btn:hover { transform: translateY(-2px); box-shadow: var(--shadow-2); border-color: rgba(2, 43, 66, 0.4); }
    .filter-btn:active { transform: translateY(0); }
    .filter-btn.active { background: linear-gradient(135deg, var(--primary-2), var(--primary)); color: var(--headerText); border-color: var(--primary); }
    .filter-btn[disabled], .view-toggle-btn[disabled] { opacity: 0.6; cursor: not-allowed; }

    .btn-solid {
      background: linear-gradient(135deg, var(--primary-2), var(--primary));
      border-color: var(--primary);
      color: var(--headerText);
    }
    .btn-danger {
      background: #fff;
      border-color: rgba(239, 68, 68, 0.35);
      color: #b91c1c;
    }
    .btn-danger:hover { border-color: rgba(239, 68, 68, 0.6); }
    .btn-ghost {
      background: rgba(2, 43, 66, 0.04);
      border-color: rgba(2, 43, 66, 0.14);
      color: var(--primary);
    }

    /* Day/Week segmented toggle */
    .view-toggle {
      display: inline-flex;
      padding: 4px;
      gap: 2px;
      background: rgba(2, 43, 66, 0.06);
      border: 1px solid var(--border);
      border-radius: var(--radius-sm);
    }
    .view-toggle-btn {
      height: 38px; padding: 0 16px; border: 0; border-radius: 9px;
      background: transparent; color: var(--text-light);
      font-weight: 800; font-size: 0.88rem; cursor: pointer; transition: var(--transition);
      display: inline-flex; align-items: center; gap: 8px;
      font-family: "Noto Kufi Arabic", system-ui, -apple-system, Segoe UI, Roboto, Arial, sans-serif;
    }
    .view-toggle-btn:hover { color: var(--primary); }
    .view-toggle-btn.active {
      background: var(--card-bg); color: var(--primary);
      box-shadow: var(--shadow-1);
    }

    /* Floating back button */
    .fab-back {
      position: fixed;
      bottom: 18px;
      right: 18px;
      z-index: 30;
      height: 48px; padding: 0 18px 0 20px;
      border-radius: 999px;
      border: 1px solid rgba(2, 43, 66, 0.16);
      background: rgba(255, 255, 255, 0.9);
      backdrop-filter: blur(10px); -webkit-backdrop-filter: blur(10px);
      color: var(--primary);
      font-weight: 900; font-size: 0.92rem; cursor: pointer;
      box-shadow: var(--shadow-2);
      transition: var(--transition);
      display: inline-flex; align-items: center; gap: 10px;
      font-family: "Noto Kufi Arabic", system-ui, -apple-system, Segoe UI, Roboto, Arial, sans-serif;
    }
    .fab-back:hover { transform: translateX(-3px); box-shadow: 0 14px 32px rgba(2, 43, 66, 0.2); border-color: rgba(2, 43, 66, 0.3); }
    .fab-back:active { transform: scale(0.97); }
    .fab-back i { font-size: 0.95em; }

    /* Loading dot */
    .filter-btn.loading, .view-toggle-btn.loading { position: relative; }
    .filter-btn.loading::after, .view-toggle-btn.loading::after {
      content: ""; width: 10px; height: 10px; border-radius: 50%;
      border: 2px solid currentColor; border-top-color: transparent;
      position: absolute; left: 10px; animation: spin 0.8s linear infinite;
    }
    @keyframes spin { to { transform: rotate(360deg); } }

    /* Main & cards */
    main { flex: 1; padding: 20px; }
    .board { max-width: 1200px; margin: 0 auto; display: flex; flex-direction: column; gap: 20px; }
    .card {
      background: var(--card-bg);
      border: 1px solid var(--border);
      border-radius: var(--radius);
      box-shadow: var(--shadow-1);
      padding: 20px;
      transition: var(--transition);
    }
    .card:hover { box-shadow: var(--shadow-2); }
    .muted { color: var(--muted); font-size: 0.9rem; }

    /* Table */
    .table { display: grid; grid-template-columns: repeat(2, minmax(160px, 1fr)); column-gap: 12px; row-gap: 8px; align-items: stretch; }
    .header-full {
      grid-column: 1 / -1; background: linear-gradient(135deg, var(--primary-2), var(--primary));
      color: var(--headerText); border-radius: var(--radius-sm); padding: 16px; text-align: center;
      font-weight: 900; box-shadow: var(--shadow-1);
      display: flex; align-items: center; justify-content: center; gap: 10px;
    }
    .th {
      background: linear-gradient(135deg, var(--primary-2), var(--primary));
      color: var(--headerText); border-radius: var(--radius-sm);
      padding: 14px 10px; text-align: center; font-weight: 900; box-shadow: var(--shadow-1);
      display: flex; align-items: center; justify-content: center; gap: 8px;
    }
    .cell {
      background: var(--card-bg); border: 1px solid var(--border-light); border-radius: var(--radius-sm);
      padding: 16px 12px; text-align: center; min-height: 60px; display: flex; flex-direction: column; align-items: center; justify-content: center;
      font-weight: 800; transition: var(--transition);
      position: relative;
      line-height: 1.25;
    }
    .cell:hover { border-color: var(--border); transform: translateY(-2px); box-shadow: var(--shadow-1); }
    .small { font-size: 0.8rem; color: var(--muted); margin-top: 4px; font-weight: 700; }
    .lesson-meta {
      width: 100%;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 3px;
      margin-inline: auto;
      text-align: center;
    }
    .lesson-title-row {
      font-weight: 900;
      line-height: 1.2;
      text-align: center;
      direction: rtl;
      width: 100%;
      display: block;
    }
    .lesson-time-row {
      font-size: 0.8rem;
      color: var(--muted);
      font-weight: 700;
      line-height: 1.2;
      direction: ltr;
      text-align: center;
      width: 100%;
      display: block;
    }
    .opportunity-divider {
      grid-column: 1 / -1;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      min-height: 30px;
      padding: 5px 10px;
      border-radius: 999px;
      border: 1px solid rgba(2, 43, 66, 0.18);
      background: rgba(2, 43, 66, 0.06);
      color: var(--primary);
      font-size: 12px;
      font-weight: 900;
      line-height: 1.2;
      text-align: center;
    }
    .opportunity-divider-label {
      display: block;
      width: 100%;
      text-align: center;
      white-space: nowrap;
    }

    .cell.clickable { cursor: pointer; }
    .cell.clickable::after {
      content: "";
      position: absolute; inset: 0;
      border-radius: var(--radius-sm);
      box-shadow: 0 0 0 0 rgba(2, 43, 66, 0.0);
      transition: box-shadow 0.25s ease;
      pointer-events: none;
    }
    .cell.clickable:hover::after { box-shadow: 0 0 0 3px rgba(2, 43, 66, 0.10); }

    /* Grid */
    .grid-wrap { overflow: visible; }
    .grid { direction: rtl; display: grid; grid-template-columns: 140px repeat(7, minmax(130px, 1fr)); gap: 12px; align-items: stretch; }
    .gth {
      background: linear-gradient(135deg, var(--primary-2), var(--primary)); color: var(--headerText);
      border-radius: var(--radius-sm); padding: 14px 10px; text-align: center; font-weight: 900; box-shadow: var(--shadow-1);
      display: grid;
      place-items: center;
      align-content: center;
      animation: gridCellIn 0.32s cubic-bezier(0.16, 1, 0.3, 1) both;
    }
    .gcell {
      background: var(--card-bg); border: 1px solid var(--border-light); border-radius: var(--radius-sm);
      padding: 14px 10px; display: grid; align-items: center; justify-items: center; text-align: center;
      min-height: 60px; position: relative; font-weight: 800; transition: var(--transition);
      animation: gridCellIn 0.32s cubic-bezier(0.16, 1, 0.3, 1) both;
    }
    .gcell:hover { border-color: var(--border); transform: translateY(-2px); box-shadow: var(--shadow-1); }
    .gcell.empty { color: rgba(100, 116, 139, 0.45); font-weight: 600; }
    .gcell.clickable { cursor: pointer; }
    .day-col { background: var(--primary-light); }
    @keyframes gridCellIn {
      from { opacity: 0; transform: translateY(5px); }
      to { opacity: 1; transform: translateY(0); }
    }
    @media (prefers-reduced-motion: reduce) {
      .gth, .gcell { animation: none; }
    }

    /* Skeleton loader — shown in containerMain the instant a view starts
       loading (today/week), in place of the real .table/.compact-table/.grid
       markup it renders into, so the layout doesn't jump once real data
       arrives a moment later. */
    .skel {
      background: linear-gradient(100deg, rgba(2,43,66,.08) 30%, rgba(2,43,66,.15) 45%, rgba(2,43,66,.08) 60%);
      background-size: 250% 100%;
      animation: skelShimmer 1.4s ease-in-out infinite;
      border-radius: 6px;
    }
    @keyframes skelShimmer {
      0% { background-position: 200% 0; }
      100% { background-position: -200% 0; }
    }
    @media (prefers-reduced-motion: reduce) {
      .skel { animation: none; }
    }
    .skel-line { height: 14px; width: 70%; margin: 0 auto; }
    .skel-line.wide { width: 90%; }
    .skel-line.short { width: 45%; height: 11px; }
    .skel-header { grid-column: 1 / -1; height: 44px; border-radius: var(--radius-sm); }
    .skel-th { height: 40px; border-radius: var(--radius-sm); }
    .skel-cell { display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 6px; }

    /* Status */
    .status-message {
      padding: 12px 16px; border-radius: var(--radius-sm); background: var(--primary-light);
      color: var(--primary); font-weight: 700; margin-top: 12px; display: none; align-items: center; gap: 10px;
    }

    /* Highlight (has lesson) */
    .lesson-highlight {
      background-color: #fff9c4 !important;
      border: 2px solid #ffd54f !important;
      color: #5d4037;
      font-weight: 900;
    }

    /* Current lesson highlight (time-based, day view only) */
    .current-lesson {
      background-color: rgba(4, 69, 99, 0.10) !important;
      border: 2px solid var(--primary-2) !important;
      box-shadow: 0 0 0 3px rgba(2, 43, 66, 0.28);
      color: var(--primary-2) !important;
      position: relative;
      font-weight: 900;
    }

    /* Override badges */
    .pill {
      display: inline-flex;
      align-items: center;
      gap: 6px;
      padding: 5px 10px;
      border-radius: 999px;
      font-size: 12px;
      font-weight: 900;
      border: 1px solid var(--border);
      background: rgba(2, 43, 66, 0.06);
      color: var(--primary);
      margin-top: 8px;
      justify-content: center;
      width: fit-content;
    }
    .pill.success {
      background: rgba(16, 185, 129, 0.12);
      border-color: rgba(16, 185, 129, 0.25);
      color: #065f46;
    }
    .pill.warn {
      background: rgba(245, 158, 11, 0.14);
      border-color: rgba(245, 158, 11, 0.30);
      color: #7c2d12;
    }

    /* Compact on mobile */
    .compact-table { display: grid; grid-template-columns: 1fr 1fr; column-gap: 8px; row-gap: 6px; width: 100%; }
    .compact-header {
      grid-column: 1 / -1; background: linear-gradient(135deg, var(--primary-2), var(--primary));
      color: var(--headerText); border-radius: var(--radius-sm); padding: 12px; text-align: center;
      font-weight: 900; display: flex; align-items: center; justify-content: center; gap: 10px; margin-bottom: 8px;
    }
    .compact-th {
      background: var(--primary-light); border: 1px solid var(--border);
      border-radius: var(--radius-sm); padding: 10px 8px; text-align: center;
      font-weight: 900; font-size: 0.9rem;
      display: flex; align-items: center; justify-content: center; gap: 8px;
    }
    .compact-cell {
      background: transparent; border: none;
      border-radius: var(--radius-sm); padding: 10px 8px; text-align: center;
      min-height: 50px; display: flex; flex-direction: column; align-items: center; justify-content: center;
      font-weight: 800; font-size: 0.9rem;
      position: relative;
      line-height: 1.25;
    }
    .compact-cell.lesson-cell {
      align-items: stretch;
      justify-content: center;
    }
    .compact-cell.lesson-cell .lesson-meta {
      min-height: 100%;
      justify-content: center;
    }
    .compact-cell.clickable { cursor: pointer; }
    .compact-cell.clickable:hover { background: var(--primary-light); }
    /* الحصة + الصف for one lesson slot — spans both grid columns so it keeps
       the same footprint as a normal row. Individual cells have no border/
       background of their own (avoids a boxed-container look per lesson,
       which felt crowded with 7+ rows on screen) — rows are separated by a
       plain hairline instead. When it's the current lesson, the wrapper
       becomes the single blue container and the two cells sit inside it as
       smaller sub-boxes. */
    .compact-row {
      grid-column: 1 / -1;
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 8px;
      border-bottom: 1px solid var(--border-light);
      padding-bottom: 6px;
    }
    .compact-row:last-child { border-bottom: none; padding-bottom: 0; }
    .compact-row.current-lesson {
      background-color: rgba(4, 69, 99, 0.10);
      border: 2px solid var(--primary-2);
      box-shadow: 0 0 0 2px rgba(2, 43, 66, 0.22);
      border-radius: var(--radius-sm);
      padding: 4px;
    }
    /* Cells lose their own border/background inside the mother box (avoids a
       double-boxed look) and shrink their padding by roughly what the mother's
       own border+padding just added, so the highlighted row's overall height
       still matches a normal row instead of growing taller than its neighbors. */
    .compact-row.current-lesson .compact-cell {
      color: var(--primary-2);
      font-weight: 900;
      background: transparent;
      border-color: transparent;
      padding: 8px 6px;
      min-height: 42px;
    }

    /* Sheet */
    .sheet {
      position: fixed; inset: 0; z-index: 50; background: var(--page);
      display: flex; flex-direction: column;
      transform: translateX(100%);
      transition: transform 0.3s cubic-bezier(0.22, 0.7, 0.25, 1);
    }
    .sheet.open { transform: translateX(0); }
    .sheet-header {
      background: var(--card-bg); border-bottom: 1px solid var(--border);
      padding: 18px 20px;
      position: sticky; top: 0; z-index: 10;
      display: flex; align-items: center; justify-content: center;
      box-shadow: 0 2px 8px rgba(2, 43, 66, 0.06);
    }
    .back-btn {
      position: absolute;
      right: 20px;
      top: 50%;
      transform: translateY(-50%);
      height: 44px; padding: 0 18px; border-radius: var(--radius-sm);
      border: 1px solid rgba(2, 43, 66, 0.25); background: var(--card-bg);
      color: var(--primary); font-weight: 900; cursor: pointer;
      box-shadow: var(--shadow-1); transition: var(--transition);
      display: flex; align-items: center; gap: 8px;
      font-family: "Noto Kufi Arabic", system-ui, -apple-system, Segoe UI, Roboto, Arial, sans-serif;
    }
    .back-btn:hover { transform: translateY(calc(-50% - 2px)); box-shadow: var(--shadow-2); }
    .back-btn:active { transform: translateY(-50%) scale(0.97); }
    /* Back button is absolutely positioned to one side, so the title is
       centered against the header's full width rather than the leftover
       space next to it — padding keeps it clear of the button at any
       text length. */
    .sheet-title { margin: 0; font-size: 1.15rem; font-weight: 900; color: var(--primary); text-align: center; padding: 0 112px; }
    .sheet-body {
      flex: 1 1 auto; overflow: auto; padding: 24px;
      max-width: 1200px; margin: 0 auto;
      display: flex; flex-direction: column; gap: 20px; width: 100%;
    }

    .field-label {
      display: flex; align-items: center; gap: 8px;
      font-size: 12.5px; font-weight: 900; color: var(--muted);
      margin-bottom: 8px;
    }
    .field-label i { color: var(--primary-2); font-size: 0.95em; }
    .input-wrap {
      display: flex; align-items: center; gap: 12px; min-height: 54px; padding: 0 16px;
      background: var(--card-bg);
      border: 1.5px solid var(--border);
      border-radius: var(--radius-sm);
      box-shadow: var(--shadow-1);
      transition: var(--transition);
    }
    .input-wrap:hover { border-color: rgba(2, 43, 66, 0.3); }
    .input-wrap:focus-within { border-color: var(--primary-2); box-shadow: 0 0 0 4px rgba(4, 69, 99, 0.12); }
    .input-icon { color: var(--primary-2); font-size: 0.95rem; flex-shrink: 0; }
    .select, .input {
      flex: 1; height: 50px; border: none; outline: none; background: transparent;
      font-size: 1rem; font-weight: 800; color: var(--text);
      font-family: "Noto Kufi Arabic", system-ui, -apple-system, Segoe UI, Roboto, Arial, sans-serif;
      cursor: pointer;
    }
    .input { cursor: text; font-weight: 700; }
    .input::placeholder { color: rgba(71, 85, 105, 0.65); font-weight: 700; }
    .more-actions {
      margin-top: 12px;
      display: flex;
      gap: 10px;
      flex-wrap: wrap;
    }
    .more-actions .filter-btn {
      flex: 1 1 220px;
      justify-content: center;
      white-space: nowrap;
    }
    @media (max-width: 480px) {
      .more-actions { flex-direction: column; }
      .more-actions .filter-btn { width: 100%; flex: initial; }
    }

    /* طلبات القسم (department heads only) — ported from depHead/schedual.html.
       #btnRequests starts hidden and is only ever revealed via JS for role
       'head'. .filter-btn's own display:inline-flex is an author-origin rule,
       which beats the browser's [hidden]{display:none} UA rule regardless of
       specificity — so without this, the button would show for everyone. */
    #btnRequests[hidden]{ display:none; }
    .request-card {
      border: 1px solid var(--border);
      border-radius: var(--radius-sm);
      padding: 16px;
      background: var(--card-bg);
      box-shadow: var(--shadow-1);
      display: flex;
      flex-direction: column;
      gap: 12px;
    }
    .request-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
    }
    .request-type {
      padding: 4px 12px;
      border-radius: 999px;
      font-size: 0.85rem;
      font-weight: 900;
    }
    .type-cover { background: rgba(59, 130, 246, 0.12); color: #1d4ed8; }
    .type-swap { background: rgba(168, 85, 247, 0.12); color: #7c3aed; }
    .request-body { display: grid; gap: 8px; }
    .request-row {
      display: flex;
      align-items: center;

  <script type="module">
    import { firebaseConfig } from "/shared/firebase.js";
    /* ========= Firebase ========= */
    import { initializeApp, getApp, getApps } from "/shared/firebase.js";
    import {
      getAuth, onAuthStateChanged, setPersistence, browserLocalPersistence
    } from "/shared/firebase.js";
    import {
      initializeFirestore, persistentSingleTabManager,
      collection, getDocs, query, where, doc, getDoc,
      addDoc, serverTimestamp, updateDoc, runTransaction,
      limit, orderBy, onSnapshot
    } from "/shared/firebase.js";
    import {
      getOverriddenClassKeys, mergeCustomIntoLessonMap, classKeyFromRow, normalizeClassKey
    } from "/shared/schedule-priority.js";
    import { fetchClassList, sortClassList } from "/shared/class-registry.js";



    const app = getApps().length ? getApp() : initializeApp(firebaseConfig);
    let db;
    try {
      db = initializeFirestore(app, {
        localCache: persistentSingleTabManager()
      });
    } catch (e) {
      db = initializeFirestore(app, {});
    }
    const auth = getAuth(app);

    /* ========= Constants ========= */
    const DAYS_AR = ["الأحد","الاثنين","الثلاثاء","الأربعاء","الخميس"]; // Sun→Thu
    const DEFAULT_LESSONS_AR = [
      "الحصة الأولى","الحصة الثانية","الحصة الثالثة",
      "الحصة الرابعة","الحصة الخامسة","الحصة السادسة","الحصة السابعة"
    ];
    let LESSONS_AR = [...DEFAULT_LESSONS_AR];
    let FIXED_LESSON_COUNT = 7;

    // Fetched from settings/classes inside onAuthStateChanged below, before
    // initClassPicker() (the "download all classes" picker/PDF feature —
    // the only consumer) is first called.
    let CLASS_OPTIONS = [];

    const FIXED_DEPARTMENTS = [
      "اللغة العربية",
      "اللغة الإنجليزية",
      "الرياضيات",
      "التربية الإسلامية",
      "التاريخ",
      "الجغرافيا",
      "الاقتصاد",
      "الفلسفة",
      "علم النفس",
      "الفيزياء",
      "الكيمياء",
      "الأحياء",
      "الجيولوجيا",
      "الحاسوب",
      "التربية البدنية",
      "التربية الفنية"
    ];

    const MERGED_DEPARTMENT_GROUPS = [
      { department: "الفيزياء والكيمياء", subjects: ["الفيزياء","الكيمياء"] },
      { department: "الجيولوجيا والأحياء", subjects: ["الجيولوجيا","الأحياء"] },
      { department: "علم النفس والفلسفة", subjects: ["علم النفس","الفلسفة"] },
      { department: "التاريخ والجغرافيا", subjects: ["التاريخ","الجغرافيا","جغرافيا"] }
    ];
    function resolveDepartmentName(rawValue){
      const value = (rawValue || "").toString().trim();
      if(!value) return "";
      for(const group of MERGED_DEPARTMENT_GROUPS){
        if(value === group.department || group.subjects.includes(value)) return group.department;
      }
      return value;
    }

    /* ========= Live Lesson Times ========= */
    const DEFAULT_LESSON_TIMES = [
      { start: "07:55", end: "08:40" },

      const firstAfter = normalizeBreakAfterLesson(firstRaw);

    function refreshRenderedLessonMeta(root = document){
      if(!root?.querySelectorAll) return;

        if(!lessonNumber) return;

        if(!timeEl) return;
        // A custom/extra-day schedule's own lesson time (stamped as
        // data-lesson-time-* when this cell was rendered) must survive the
        // site-wide settings/lessonTimes listener refreshing every rendered
        // cell — otherwise it gets stomped back to the generic bell time.
        const overrideStart = metaEl.dataset.lessonTimeStart;
        const overrideEnd = metaEl.dataset.lessonTimeEnd;
        const override = (overrideStart && overrideEnd) ? { start: overrideStart, end: overrideEnd } : null;
        timeEl.textContent = lessonTimeLabel(lessonNumber, override);

    function setupLessonTimesListener() {
      if (lessonTimesUnsubscribe) {
        lessonTimesUnsubscribe();
      }

      let firstSnapshotHandled = false;
      const lessonTimesDocRef = doc(db, 'settings', 'lessonTimes');
      return new Promise((resolve) => {
        lessonTimesUnsubscribe = onSnapshot(lessonTimesDocRef, (snap) => {
          if (snap.exists()) {
            const data = snap.data() || {};
            const breakSource = data.opportunityBreaks || data;
            SCHOOL_BREAKS = normalizeSchoolBreaks(breakSource);

            if (data.times && Array.isArray(data.times) && data.times.length >= 1 && data.times.length <= 12) {
              let valid = true;
              for (let i = 0; i < data.times.length; i++) {
                const t = data.times[i];
                if (!t.start || !t.end || typeof t.start !== 'string' || typeof t.end !== 'string') {
                  valid = false;
                  break;
                }
              }
              if (valid) {
                const newCount = data.times.length;
                // Grid structure (columns/cells) is built only at render time from FIXED_LESSON_COUNT,
                // so a live count change can't be reconciled in place; reload is the pragmatic fix.
                if (firstSnapshotHandled && newCount !== FIXED_LESSON_COUNT) {
                  location.reload();
                  return;
                }
                LESSON_TIMES = data.times;
                FIXED_LESSON_COUNT = newCount;
                LESSONS_AR = LESSON_TIMES.map((_, i) => DEFAULT_LESSONS_AR[i] || `الحصة ${i + 1}`);
                console.log('Lesson times updated from Firestore:', LESSON_TIMES);
              } else {
                console.warn('Invalid lesson times structure in Firestore, using defaults');
              }
            } else {
              console.warn('No valid times array in Firestore, using defaults');
            }
          } else {
            console.log('No lesson times document in Firestore, using defaults');
            SCHOOL_BREAKS = { firstAfter: null, secondAfter: null };
          }

          updateLessonTimeLabels();
          updateCurrentLessonHighlight();
          updateCompactViewTimeLabels();
          updateClassWeekGridTimeLabels();

          if (!firstSnapshotHandled) {
            firstSnapshotHandled = true;
            resolve();
          }
        }, (error) => {
          console.error("Error listening to lesson times:", error);
          if (!firstSnapshotHandled) {
            firstSnapshotHandled = true;
            resolve();
          }
        });
      });
    }

      const year2 = Number(m[1]).toString().slice(-2);
      const month = String(Number(m[2]));
      const day = String(Number(m[3]));
      return toArabicDigits(`${day} / ${month} / ${year2}`);

    /* ========= NEW: time → current lesson index ========= */
    function getCurrentKuwaitMinutes() {
      const now = new Date();
      const fmt = new Intl.DateTimeFormat('en-GB', {
        timeZone: 'Asia/Kuwait',
        hour: '2-digit',
        minute: '2-digit',
        hour12: false
      });
      const parts = fmt.formatToParts(now);
      const h = parseInt(parts.find(p => p.type === 'hour').value, 10);
      const m = parseInt(parts.find(p => p.type === 'minute').value, 10);
      return h * 60 + m;
    }

    function parseTimeToMinutes(t) {
      const [h, m] = t.split(':').map(Number);
      return h * 60 + m;
    }

    // returns 1..7 or null if outside all lessons
    function getActiveLessonIndex() {
      const minutes = getCurrentKuwaitMinutes();
      for (let i = 0; i < LESSON_TIMES.length; i++) {
        const start = parseTimeToMinutes(LESSON_TIMES[i].start);
        const end   = parseTimeToMinutes(LESSON_TIMES[i].end);
        if (minutes >= start && minutes < end) {
          return i + 1;
        }
      }
      return null;
    }

    // A custom/extra-day lesson runs on its own bell time, not the site-wide
    // one `activeLesson` (from getActiveLessonIndex) was computed against —
    // check it independently instead of comparing against activeLesson.
    function isLessonCurrentNow(dayISO, todayISO, lessonNumber, activeLesson, customTimes){
      if (dayISO !== todayISO) return false;
      if (customTimes) {
        const minutes = getCurrentKuwaitMinutes();
        const start = parseTimeToMinutes(customTimes.start);
        const end = parseTimeToMinutes(customTimes.end);
        return minutes >= start && minutes < end;
      }
      return activeLesson === lessonNumber;
    }

    async function loadOverridesForTeacherInDates(uid, dates){
      if(!uid) return;

      const targetDates = Array.isArray(dates) ? dates : [dates];
      const mapByDate = cache.overridesByTeacher.get(uid) || new Map();

      let allCached = true;
      for(const iso of targetDates){
        if(!mapByDate.has(iso)) { allCached = false; break; }
      }
      if(allCached){
        cache.overridesByTeacher.set(uid, mapByDate);
        return mapByDate;
      }

      for(const iso of targetDates){
        if(!mapByDate.has(iso)) mapByDate.set(iso, new Map());
      }

      try{
        const qNew = query(
          collection(db,'scheduleOverrides'),
          where('newTeacherUid','==', uid),
          where('active','==', true),
          where('date','in', targetDates)
        );
        const qOld = query(
          collection(db,'scheduleOverrides'),
          where('originalTeacherUid','==', uid),
          where('active','==', true),
          where('date','in', targetDates)
        );
        const [sNew, sOld] = await Promise.all([getDocs(qNew), getDocs(qOld)]);
        sNew.forEach(d=>{
          const x = d.data();
          if(!x || !x.date) return;
          const iso = x.date;
          if(!mapByDate.has(iso)) mapByDate.set(iso, new Map());
          mapByDate.get(iso).set(Number(x.lesson), { ...x, _id: d.id, _kind: 'new' });
        });

        sOld.forEach(d=>{
          const x = d.data();
          if(!x || !x.date) return;
          const iso = x.date;
          if(!mapByDate.has(iso)) mapByDate.set(iso, new Map());

          const existing = mapByDate.get(iso).get(Number(x.lesson));
          if(!existing){

    function resolveDisplayLessonTimes(hit, dayCustomTimes, lessonNumber){

    // Schedule entries recur weekly (identified by weekday, not calendar date),
    // so lookups match by dayIndex (0=Sun..4=Thu) rather than an exact date.
    function dayIndexForISO(iso){
      const m = /^(\d{4})-(\d{2})-(\d{2})$/.exec((iso || '').toString());
      if(!m) return -1;
      const d = new Date(Number(m[1]), Number(m[2]) - 1, Number(m[3]));
      return d.getDay();
    }

    const CUSTOM_DAY_DOCS_CACHE_MS = 20000;

    async function fetchCustomScheduleDocsForDayIndex(dayIndex){
      const cacheKey = `day:${dayIndex}`;
      const cached = cache.customDayDocs.get(cacheKey);
      // Short TTL, not indefinite — without it, a custom schedule enabled or
      // edited in adminschedule.html while this page is already open would
      // never show up here until a hard reload.
      if(cached && (Date.now() - cached.at) < CUSTOM_DAY_DOCS_CACHE_MS) return cached.rows;
      let rows = [];
      try{
        const snap = await getDocs(query(collection(db,'customDaySchedules'), where('dayIndex','==', dayIndex)));
        rows = snap.docs.map(d => d.data() || {}).filter(x => !x.deletedAt && x.enabled === true);
      }catch(e){
        console.error('[fetchCustomScheduleDocsForDayIndex]', e);
      }
      cache.customDayDocs.set(cacheKey, { at: Date.now(), rows });
      return rows;
    }

    // The day's own bell schedule when an enabled custom schedule covers it
    // — independent of which lessons *this* teacher happens to have. Every
    // class's copy of the same custom schedule shares identical times (see
    // propagateSharedScheduleFields in adminschedule.html), so any enabled
    // row for the day represents the whole day's period times.
    async function getCustomDayTimes(dayIndex){
      const rows = await fetchCustomScheduleDocsForDayIndex(dayIndex);
      const row = rows.find(r => Array.isArray(r.times) && r.times.length);
      return row ? row.times : null;
    }

    async function buildTodayMapWithOverrides(uid, dateISO){
      const byLesson = new Map();
      const dayIndex = dayIndexForISO(dateISO);

      const q1 = query(
        collection(db,'schedules'),
        where('teacherUid','==', uid),
        where('dayIndex','==', dayIndex)
      );
      const [snap, , customRows] = await Promise.all([
        getDocs(q1),
        loadOverridesForTeacherInDates(uid, [dateISO]),
        fetchCustomScheduleDocsForDayIndex(dayIndex)
      ]);

      // A class with an enabled custom schedule for this weekday doesn't run
      // its main schedule (or any swap/cover override on it) at all today —
      // the custom schedule fully replaces it below.
      const overriddenClassKeys = getOverriddenClassKeys(customRows);

      snap.forEach(d=>{
        const x=d.data();
        if(isClassOverriddenForToday(x, overriddenClassKeys)) return;
        byLesson.set(String(x.lesson), x);
      });

      const mapByDate = cache.overridesByTeacher.get(uid) || new Map();
      const dayMap = mapByDate.get(dateISO) || new Map();

      for(let i=1;i<=FIXED_LESSON_COUNT;i++){
        const o = dayMap.get(i);
        if(!o) continue;
        if(isClassOverriddenForToday(o, overriddenClassKeys)) continue;

        if(o._kind === 'new'){
          byLesson.set(String(i), {
            classKey: o.classKey || '—',
            _isOverride: true,
            _overrideInfo: o
          });
        } else if(o._kind === 'original'){
          byLesson.set(String(i), {
            _coveredAway: true,
            _isOverride: true,
            _overrideInfo: o
          });
        }
      }

      mergeCustomIntoLessonMap(byLesson, uid, customRows, { fixedLessonCount: FIXED_LESSON_COUNT });

      return byLesson;
    }

    function isClassOverriddenForToday(row, overriddenClassKeys){
      const ck = classKeyFromRow(row);
      return !!ck && overriddenClassKeys.has(normalizeClassKey(ck));
    }

    function buildClassKeyFromScheduleData(data){
      const d = data || {};
      if (d.classKey) return String(d.classKey);
      const grade = safeText(d.grade).trim();
      const section = safeText(d.section).trim();
      const track = safeText(d.track).trim();
      if (!grade && !section) return '';
      return `${grade} / ${section}${track ? ` ${track}` : ''}`.trim();
    }

    function isSchoolDayISO(iso){
      if (!iso) return false;
      const day = isoToUTCDate(iso).getUTCDay();
      return day >= 0 && day <= 4;
    }

    function isPastISO(iso){
      if (!iso) return false;
      return iso < kuwaitTodayISO();
    }

    function normalizeLessonNumber(value){
      const lesson = Number(value);
      if (!Number.isFinite(lesson)) return null;
      if (lesson < 1 || lesson > FIXED_LESSON_COUNT) return null;
      return Math.floor(lesson);
    }

    async function getTeacherSlotsForDate(uid, dateISO){
      if (!uid || !dateISO) return [];
      const map = await buildTodayMapWithOverrides(uid, dateISO);
      const slots = [];
      for (let i = 1; i <= FIXED_LESSON_COUNT; i++) {
        const hit = map.get(String(i));
        if (!hit || hit._coveredAway) continue;
        slots.push({
          date: dateISO,
          lesson: i,
          classKey: hit.classKey || buildClassKeyFromScheduleData(hit) || '—',
          subject: hit.subject || '',
          teacherUid: uid
        });
      }
      return slots;
    }

    async function getTeacherSlotForDateLesson(uid, dateISO, lesson){
      const lessonNum = normalizeLessonNumber(lesson);
      if (!uid || !dateISO || !lessonNum) return null;
      const slots = await getTeacherSlotsForDate(uid, dateISO);
      return slots.find(x => x.lesson === lessonNum) || null;
    }

    async function getWeekMapForTeacher(uid){
      const cacheKey = `${uid}_${cache.weekKey}`;
      if (cache.teacherWeek.has(cacheKey)) {
        return cache.teacherWeek.get(cacheKey);
      }

      const map = new Map();
      for (const iso of weekDates) {
        map.set(iso, new Map());
      }

      const [snap, , customRowsByDay] = await Promise.all([
        fetchWeekDocsForTeacher(uid),
        loadOverridesForTeacherInDates(uid, weekDates),
        Promise.all(weekDates.map((iso, dayIdx) => fetchCustomScheduleDocsForDayIndex(dayIdx)))
      ]);

      // A class with an enabled custom schedule for a given weekday doesn't
      // run its main schedule (or any swap/cover override on it) that day —
      // computed per weekday since each day can have different overrides.
      const overriddenClassKeysByDay = weekDates.map((iso, dayIdx) => getOverriddenClassKeys(customRowsByDay[dayIdx]));

      snap.forEach(d => {
        const x = d.data();
        // Standing schedule entries recur by weekday — resolve to *this* week's
        // actual date for the matching weekday, not the (possibly stale) date
        // the entry happens to have last been saved with.
        const dayIdx = Number(x.dayIndex);
        const iso = weekDates[dayIdx];
        if (iso === undefined) return;
        if (isClassOverriddenForToday(x, overriddenClassKeysByDay[dayIdx] || new Set())) return;
        if (!map.has(iso)) map.set(iso, new Map());
        const classText = x.classKey || `${x.grade} / ${x.section}${x.track ? ' '+x.track : ''}`;
        map.get(iso).set(Number(x.lesson), classText);
      });

      const mapByDate = cache.overridesByTeacher.get(uid) || new Map();
      weekDates.forEach((iso, dayIdx) => {
        const dayOv = mapByDate.get(iso);
        if (!dayOv) return;
        const overriddenClassKeys = overriddenClassKeysByDay[dayIdx];
        for (let i = 1; i <= FIXED_LESSON_COUNT; i++) {
          const o = dayOv.get(i);
          if (!o) continue;
          if (isClassOverriddenForToday(o, overriddenClassKeys)) continue;
          if (o._kind === 'new') {
            map.get(iso).set(i, (o.classKey || 'بديل'));
          } else if (o._kind === 'original') {
            map.get(iso).set(i, '—');
          }
        }
      });

      weekDates.forEach((iso, dayIdx) => {
        const dayMap = map.get(iso);
        const customRows = customRowsByDay[dayIdx];
        customRows.forEach(row=>{
          const lessonsArr = Array.isArray(row.lessons) ? row.lessons : [];
          const max = Math.min(FIXED_LESSON_COUNT, Number(row.lessonCount) || lessonsArr.length || FIXED_LESSON_COUNT);
          for(let i=0;i<max;i++){
            const lessonRow = lessonsArr[i] || {};
            if((lessonRow.teacherUid || '').toString() !== uid) continue;
            const classKey = classKeyFromRow(row) || classKeyFromRow(lessonRow);
            if(!classKey) continue;
            // Custom always wins for this slot — overwrite, don't gap-fill.
            dayMap.set(i + 1, classKey);
          }
        });
      });

      cache.teacherWeek.set(cacheKey, map);
      return map;
    }

    async function waitForImageReady(imgEl){
      if (!imgEl) return;
      if (imgEl.complete && imgEl.naturalWidth > 0) return;
      await new Promise((resolve, reject) => {
        const onLoad = () => {
          cleanup();
          resolve();
        };
        const onError = () => {
          cleanup();
          reject(new Error('image_load_failed'));
        };
        const cleanup = () => {
          imgEl.removeEventListener('load', onLoad);
          imgEl.removeEventListener('error', onError);
        };
        imgEl.addEventListener('load', onLoad, { once: true });
        imgEl.addEventListener('error', onError, { once: true });
      });
    }

    async function getWeekMapForClass(classKey){
      if (cache.classWeek.has(classKey)) {
        return cache.classWeek.get(classKey);
      }

      const map = new Map();
      const { grade, section, track } = parseClassKey(classKey);
      for (const iso of weekDates) {
        map.set(iso, new Map());
      }

      const snap = await fetchWeekDocsForClass(grade, section, track);
      snap.forEach(d => {
        const x = d.data();
        const teacher = x.teacherName || x.teacherUid || '';
        const subj = x.subject || '—';
        // Standing schedule entries recur by weekday — resolve to *this* week's
        // actual date for the matching weekday, not the (possibly stale) date
        // the entry happens to have last been saved with.
        const iso = weekDates[Number(x.dayIndex)];
        if (iso === undefined) return;
        if (!map.has(iso)) map.set(iso, new Map());
        map.get(iso).set(Number(x.lesson), {
          subject: subj,
          teacherUid: x.teacherUid,
          teacherName: teacher,
          classKey: x.classKey || `${x.grade} / ${x.section}${x.track ? ' '+x.track : ''}`,
          date: iso,
          lesson: x.lesson
        });
      });

      try{
        const qOv = query(
          collection(db,'scheduleOverrides'),
          where('classKey','==', classKey),
          where('active','==', true),
          where('date','in', weekDates)
        );
        const ovSnap = await getDocs(qOv);
        const nameCache = new Map();
        for (const d of ovSnap.docs) {
          const x = d.data();
          const iso = x.date;
          if (!iso || !map.has(iso)) continue;

          let tName = nameCache.get(x.newTeacherUid);
          if (!tName) {
            tName = await getTeacherName(x.newTeacherUid);
            nameCache.set(x.newTeacherUid, tName);
          }

          map.get(iso).set(Number(x.lesson), {
            subject: 'بديل',
            teacherUid: x.newTeacherUid,
            teacherName: tName,
            classKey: x.classKey,
            date: iso,
            lesson: x.lesson,
            isOverride: true
          });
        }
      }catch(e){
        console.warn('Overrides for class view not loaded (index may be needed).', e);
      }

      cache.classWeek.set(classKey, map);
      return map;
    }

    function addCanvasToA4Page(docPdf, canvas, margin = 16){
      const pageW = docPdf.internal.pageSize.getWidth();
      const pageH = docPdf.internal.pageSize.getHeight();
      const ratio = Math.min(
        (pageW - margin * 2) / canvas.width,
        (pageH - margin * 2) / canvas.height
      );
      const drawW = canvas.width * ratio;
      const drawH = canvas.height * ratio;
      const x = (pageW - drawW) / 2;
      const y = margin;
      docPdf.addImage(canvas.toDataURL('image/jpeg', 0.9), 'JPEG', x, y, drawW, drawH, undefined, 'FAST');
    }

        dayCell.innerHTML = `<div style="font-weight:900">${DAYS_AR[r]}</div><div class="small">${iso}</div>`;
        classWeekGrid.appendChild(dayCell);

        for(let i=1;i<=FIXED_LESSON_COUNT;i++){
          const c = document.createElement('div');
          c.className='gcell';
          const row = map.get(iso);
          const cellData = row ? (row.get(i) || null) : null;
          
          if (cellData) {
            c.textContent = cellData.subject || '—';
            c.classList.add('lesson-highlight');
            c.classList.add('clickable');
            c.dataset.date = iso;
            c.dataset.lesson = i;
          } else {
            c.textContent = '—';
            c.classList.add('empty');
          }
          classWeekGrid.appendChild(c);
        }
      }

      classWeekGrid.querySelectorAll('.gcell.clickable').forEach(cell => {
        cell.addEventListener('click', async () => {
          const date = cell.dataset.date;
          const lesson = cell.dataset.lesson;
          const row = map.get(date);
          if (!row) return;
          const cellData = row.get(Number(lesson));
          if (!cellData) return;

          const [teacherName, teacherPhone] = await Promise.all([
            cellData.teacherName ? Promise.resolve(cellData.teacherName) : getTeacherName(cellData.teacherUid),
            getTeacherPhone(cellData.teacherUid)
          ]);
          const dayName = dayNameByISO(date);
          const timeLabel = lessonTimeLabel(Number(lesson));

          const body = `
            <div class="info-grid">
              <div class="info-box">
                <div class="info-k"><i class="fas fa-book"></i> المادة</div>
                <div class="info-v">${escapeHtml(cellData.subject)}</div>
              </div>
              <div class="info-box">
                <div class="info-k"><i class="fas fa-user"></i> اسم المعلم</div>
                <div class="info-v">${escapeHtml(teacherName)}</div>
              </div>
            </div>

            ${teacherCallCardHtml(teacherPhone)}

            <div class="info-grid">
              <div class="info-box">
                <div class="info-k"><i class="fas fa-users"></i> الصف</div>
                <div class="info-v">${escapeHtml(cellData.classKey)}</div>
              </div>
              <div class="info-box">
                <div class="info-k"><i class="far fa-calendar"></i> اليوم + التاريخ</div>
                <div class="info-v">${escapeHtml(dayName)} | ${escapeHtml(date)}</div>
              </div>
              <div class="info-box" style="grid-column: 1 / -1;">
                <div class="info-k"><i class="far fa-clock"></i> الحصة + وقتها</div>
                <div class="info-v">${escapeHtml(LESSONS_AR[lesson-1] || `الحصة #${lesson}`)} • ${escapeHtml(timeLabel)}</div>
              </div>
            </div>
          `;

          openModal({
            title: 'تفاصيل الحصة',
            bodyHtml: body,
            footerHtml: `<button class="filter-btn btn-ghost" onclick="closeModal()"><i class="fas fa-times"></i> إغلاق</button>`
          });
        });
      });
    }

    /* ========= Swap/Cover UX ========= */

    function lessonInfoBox(meta){
      const dayName = (meta.date === kuwaitTodayISO()) ? 'اليوم' : (dayNameByISO(meta.date) || meta.date);
      return `
        <div class="info-grid">
          <div class="info-box">
            <div class="info-k"><i class="far fa-calendar"></i> التاريخ</div>
            <div class="info-v">${escapeHtml(dayName)} | ${escapeHtml(meta.date)}</div>
          </div>
          <div class="info-box">
            <div class="info-k"><i class="far fa-clock"></i> الوقت</div>
            <div class="info-v">${escapeHtml(lessonTimeLabel(meta.lesson))}</div>
          </div>
          <div class="info-box">
            <div class="info-k"><i class="fas fa-hashtag"></i> الحصة</div>
            <div class="info-v">${escapeHtml(LESSONS_AR[meta.lesson-1] || `الحصة #${meta.lesson}`)} (#${meta.lesson})</div>
          </div>
          <div class="info-box">
            <div class="info-k"><i class="fas fa-users"></i> الصف</div>
            <div class="info-v">${escapeHtml(meta.classKey || '—')}</div>
          </div>
        </div>
      `;
    }

    function slotSummaryLine(slot){
      if(!slot) return '—';
      const lesson = normalizeLessonNumber(slot.lesson) || 1;
      const dayName = dayNameByISO(slot.date) || slot.date || '—';
      const classKey = slot.classKey || '—';
      return `${dayName} | ${slot.date} | ${LESSONS_AR[lesson-1] || `الحصة #${lesson}`} (#${lesson}) | ${classKey}`;
    }

    function openLessonActionsModal(slotOrLesson){
      let meta = null;
      if (typeof slotOrLesson === 'number') {
        meta = activeTodayMeta.get(String(slotOrLesson)) || null;
      } else if (slotOrLesson && typeof slotOrLesson === 'object') {
        const lesson = normalizeLessonNumber(slotOrLesson.lesson);
        meta = {
          date: safeText(slotOrLesson.date).trim(),
          lesson,
          classKey: safeText(slotOrLesson.classKey).trim() || '—',
          teacherUid: slotOrLesson.teacherUid || currentUser?.uid || '',
          teacherName: slotOrLesson.teacherName || '',
          subject: slotOrLesson.subject || ''
        };
      }

      if(!meta || !meta.date || !meta.lesson || meta._coveredAway){
        toast({ title: 'لا يمكن إنشاء طلب', text: 'هذه الحصة ليست متاحة للطلب.', icon: 'fa-circle-exclamation' });
        return;
      }

      const body = `
        ${lessonInfoBox(meta)}
      `;

      const footer = `
        <button id="actCover" class="filter-btn" type="button">
          <i class="fas fa-user-check"></i> طلب تغطية
        </button>
        <button id="actSwap" class="filter-btn btn-solid" type="button">
          <i class="fas fa-right-left"></i> طلب تبديل
        </button>
        <button id="actClose" class="filter-btn btn-ghost" type="button">
          <i class="fas fa-xmark"></i> إغلاق
        </button>
      `;

      openModal({ title: 'إدارة الحصة', bodyHtml: body, footerHtml: footer });

      document.getElementById('actClose').addEventListener('click', closeModal);
      document.getElementById('actCover').addEventListener('click', ()=> openRequestModal('cover', meta));
      document.getElementById('actSwap').addEventListener('click', ()=> openRequestModal('swap', meta));
    }

    function teacherSelectOptions(list, excludeUid){
      const filtered = (list || []).filter(t => t.uid !== excludeUid);
      const options = filtered.map(t => {
        const dep = resolveDepartmentName(t.normalizedDepartment || t.department || t.subject || '');
        const depSuffix = dep ? ` - ${escapeHtml(dep)}` : '';
        return `<option value="${escapeHtml(t.uid)}">${escapeHtml(t.name)}${depSuffix}</option>`;
      }).join('');
      return `<option value="">اختر المعلّم...</option>${options}`;
    }

    async function openRequestModal(type, meta){
      const isSwap = type === 'swap';
      const todayISO = kuwaitTodayISO();
      const myName = currentTeacherProfile?.name || currentTeacherProfile?.teacherName || currentTeacherProfile?.fullName || currentTeacherProfile?.displayName || '';
      const teachers = await loadTeachersList();

      const fromDepartment = resolveDepartmentName(
        currentTeacherProfile?.department || currentTeacherProfile?.subject || ''
      );
      let fromHead = null;
      if (fromDepartment) {
        fromHead = await findHeadOfDepartment(fromDepartment);
      }

      if (!fromHead) {
        toast({
          title: 'خطأ',
          text: 'لا يمكن العثور على رئيس القسم الخاص بك. تأكد من أن قسمك له رئيس معيّن.',
          icon: 'fa-triangle-exclamation',
          ms: 5000
        });
        return;
      }

      const defaultFromDate = safeText(meta?.date || todayISO).trim() || todayISO;
      const defaultFromLesson = normalizeLessonNumber(meta?.lesson);
      const defaultFromClassKey = safeText(meta?.classKey).trim() || '—';

      const departmentSet = new Set(FIXED_DEPARTMENTS.map(resolveDepartmentName).filter(Boolean));
      teachers.forEach(t => {
        const dep = resolveDepartmentName(t.normalizedDepartment || t.department || t.subject || '');
        if (dep) departmentSet.add(dep);
      });
      const departmentOptions = Array.from(departmentSet)
        .sort((a, b) => a.localeCompare(b, 'ar'))
        .map(dep => `<option value="${escapeHtml(dep)}">${escapeHtml(dep)}</option>`)
        .join('');

      let body = `
        ${lessonInfoBox({ ...meta, date: defaultFromDate, lesson: defaultFromLesson || 1, classKey: defaultFromClassKey })}
        <div class="split">
          <div class="info-box">
            <div class="info-k"><i class="fas fa-calendar-day"></i> 1) اختر تاريخ حصتك</div>
            <div class="input-wrap" style="margin-top:10px">
              <input id="reqFromDate" class="input" type="date" min="${todayISO}" value="${escapeHtml(defaultFromDate)}" />
            </div>
            <div class="muted" style="margin-top:8px">يمكنك اختيار اليوم الحالي أو أي يوم مستقبلي.</div>
          </div>
          <div class="info-box">
            <div class="info-k"><i class="far fa-clock"></i> 2) اختر حصتك</div>
            <div class="input-wrap" style="margin-top:10px">
              <select id="reqFromLesson" class="select">
                <option value="">اختر الحصة...</option>
              </select>
            </div>
            <div class="muted" style="margin-top:8px" id="reqFromPreview">—</div>
          </div>
        </div>
      `;

      if (isSwap) {
        body += `
          <div class="split">
            <div class="info-box">
              <div class="info-k"><i class="fas fa-building"></i> 3) اختر القسم</div>
              <div class="input-wrap" style="margin-top:10px">
                <select id="reqDepartment" class="select">
                  <option value="">اختر القسم...</option>
                  ${departmentOptions}
                </select>
              </div>
            </div>
            <div class="info-box">
              <div class="info-k"><i class="fas fa-user"></i> 4) اختر المعلّم</div>
              <div class="input-wrap" style="margin-top:10px">
                <select id="reqTeacherUid" class="select" disabled>
                  <option value="">اختر المعلّم...</option>
                </select>
              </div>
              <div class="muted" style="margin-top:8px" id="teacherSelectMessage">اختر القسم أولاً.</div>
            </div>
          </div>
          <div class="split">
            <div class="info-box">
              <div class="info-k"><i class="fas fa-calendar-week"></i> 5) تاريخ حصة المعلّم الآخر</div>
              <div class="input-wrap" style="margin-top:10px">
                <input id="reqToDate" class="input" type="date" min="${todayISO}" value="${escapeHtml(defaultFromDate)}" />
              </div>
            </div>
            <div class="info-box">
              <div class="info-k"><i class="far fa-clock"></i> 6) حصة المعلّم الآخر</div>
              <div class="input-wrap" style="margin-top:10px">
                <select id="reqToLesson" class="select" disabled>
                  <option value="">اختر الحصة...</option>
                </select>
              </div>
              <div class="muted" style="margin-top:8px" id="reqToPreview">اختر المعلّم أولاً.</div>
            </div>
          </div>
        `;
      } else {
        body += `
          <div class="info-box">
            <div class="info-k"><i class="fas fa-user"></i> 3) اختر المعلّم للتغطية</div>
            <div class="input-wrap" style="margin-top:10px">
              <select id="reqTeacherUid" class="select">
                ${teacherSelectOptions(teachers, currentUser.uid)}
              </select>
            </div>
            <div class="muted" style="margin-top:8px">يمكنك اختيار أي معلّم حتى لو لم يكن لديه حصة في هذا الوقت.</div>
          </div>
        `;
      }

      body += `
        <div class="info-box">
          <div class="info-k"><i class="fas fa-message"></i> ملاحظة (اختياري)</div>
          <div class="input-wrap" style="margin-top:10px">
            <input id="reqMessage" class="input" maxlength="160" placeholder="مثال: عندي ظرف، هل يناسبك التبديل؟" />
          </div>
        </div>
        <div id="reqStateHint" class="hint">
          <i class="fas fa-circle-info" style="margin-top:2px"></i>
          <div>حدد تفاصيل الحصص لإكمال الطلب.</div>
        </div>
      `;

      const actionTitle = isSwap ? 'طلب تبديل' : 'طلب تغطية';
      const footer = `
        <button id="sendReq" class="filter-btn btn-solid" type="button" disabled>
          <i class="fas fa-paper-plane"></i> إرسال الطلب
        </button>
        <button id="backToActions" class="filter-btn btn-ghost" type="button">
          <i class="fas fa-arrow-right"></i> رجوع
        </button>
      `;

      openModal({ title: actionTitle, bodyHtml: body, footerHtml: footer });
      document.getElementById('backToActions').addEventListener('click', ()=> openLessonActionsModal(meta));

      const sendBtn = document.getElementById('sendReq');
      const hintEl = document.getElementById('reqStateHint');
      const fromDateInput = document.getElementById('reqFromDate');
      const fromLessonSelect = document.getElementById('reqFromLesson');
      const fromPreview = document.getElementById('reqFromPreview');
      const teacherSelect = document.getElementById('reqTeacherUid');
      const reqMessage = document.getElementById('reqMessage');

      const departmentSelect = isSwap ? document.getElementById('reqDepartment') : null;
      const teacherMessage = isSwap ? document.getElementById('teacherSelectMessage') : null;
      const toDateInput = isSwap ? document.getElementById('reqToDate') : null;
      const toLessonSelect = isSwap ? document.getElementById('reqToLesson') : null;
      const toPreview = isSwap ? document.getElementById('reqToPreview') : null;

      const state = {
        fromSlots: [],
        toSlots: [],
        fromSlot: null,
        toSlot: null,
        toUid: '',
        toDepartment: ''
      };
      let fromLoadToken = 0;
      let toLoadToken = 0;

      function setHint(text, isError = false){
        if (!hintEl) return;
        hintEl.style.background = isError ? 'rgba(239, 68, 68, 0.12)' : 'rgba(2, 43, 66, 0.06)';
        hintEl.style.borderColor = isError ? 'rgba(239, 68, 68, 0.25)' : 'rgba(2, 43, 66, 0.10)';
        hintEl.style.color = isError ? '#991b1b' : 'var(--primary)';
        hintEl.innerHTML = `
          <i class="fas ${isError ? 'fa-triangle-exclamation' : 'fa-circle-info'}" style="margin-top:2px"></i>
          <div>${escapeHtml(text)}</div>
        `;
      }

      function fillSlotSelect(selectEl, slots, placeholder){
        if (!selectEl) return;
        const options = (slots || []).map(slot => `
          <option value="${slot.lesson}">
            ${escapeHtml(LESSONS_AR[slot.lesson-1] || `الحصة #${slot.lesson}`)} (#${slot.lesson}) • ${escapeHtml(lessonTimeLabel(slot.lesson))} • ${escapeHtml(slot.classKey || '—')}
          </option>
        `).join('');
        selectEl.innerHTML = `<option value="">${escapeHtml(placeholder)}</option>${options}`;
      }

      function updateSlotPreview(el, slot, fallbackText){
        if (!el) return;
        if (!slot) {
          el.textContent = fallbackText;
          return;
        }
        el.textContent = slotSummaryLine(slot);
      }

      function validateDateInput(dateISO){
        if (!dateISO) return 'اختر التاريخ.';
        if (isPastISO(dateISO)) return 'لا يمكن اختيار تاريخ ماضٍ.';
        if (!isSchoolDayISO(dateISO)) return 'اختر يومًا دراسيًا من الأحد إلى الخميس.';
        return '';
      }

      function syncSendState(){
        const srcDateErr = validateDateInput(fromDateInput.value);
        if (srcDateErr) {
          sendBtn.disabled = true;
          setHint(`الحصة الأساسية: ${srcDateErr}`, true);
          return;
        }
        if (!state.fromSlot) {
          sendBtn.disabled = true;
          setHint('اختر حصتك الأساسية أولاً.', true);
          return;
        }
        if (!state.toUid) {
          sendBtn.disabled = true;
          setHint('اختر المعلّم المطلوب.', true);
          return;
        }
        if (state.toUid === currentUser.uid) {
          sendBtn.disabled = true;
          setHint('لا يمكنك إرسال طلب لنفسك.', true);
          return;
        }

        if (isSwap) {
          const toDateErr = validateDateInput(toDateInput.value);
          if (toDateErr) {
            sendBtn.disabled = true;
            setHint(`حصة المعلّم الآخر: ${toDateErr}`, true);
            return;
          }
          if (!state.toSlot) {
            sendBtn.disabled = true;
            setHint('اختر حصة المعلّم الآخر لإتمام التبديل.', true);
            return;
          }
          sendBtn.disabled = false;
          setHint(`سيتم التبديل بين: ${slotSummaryLine(state.fromSlot)} ⇄ ${slotSummaryLine(state.toSlot)}`, false);
          return;
        }

        sendBtn.disabled = false;
        setHint(`سيتم إرسال طلب تغطية للحصة: ${slotSummaryLine(state.fromSlot)}`, false);
      }

      async function refreshFromSlots(preferredLesson = null){
        const token = ++fromLoadToken;
        const dateISO = safeText(fromDateInput.value).trim();
        state.fromSlots = [];
        state.fromSlot = null;
        fillSlotSelect(fromLessonSelect, [], 'اختر الحصة...');
        updateSlotPreview(fromPreview, null, 'اختر التاريخ ثم الحصة.');

        const dateErr = validateDateInput(dateISO);
        if (dateErr) {
          syncSendState();
          return;
        }

        const slots = await getTeacherSlotsForDate(currentUser.uid, dateISO);
        if (token !== fromLoadToken) return;
        state.fromSlots = slots;
        fillSlotSelect(fromLessonSelect, slots, slots.length ? 'اختر الحصة...' : 'لا توجد حصص في هذا التاريخ');

        const selected = normalizeLessonNumber(preferredLesson || fromLessonSelect.value);
        if (selected && slots.some(s => s.lesson === selected)) {
          fromLessonSelect.value = String(selected);
        } else if (defaultFromLesson && slots.some(s => s.lesson === defaultFromLesson)) {
          fromLessonSelect.value = String(defaultFromLesson);
        } else if (slots.length === 1) {
          fromLessonSelect.value = String(slots[0].lesson);
        }

        const chosenLesson = normalizeLessonNumber(fromLessonSelect.value);
        state.fromSlot = chosenLesson ? (slots.find(s => s.lesson === chosenLesson) || null) : null;
        updateSlotPreview(fromPreview, state.fromSlot, slots.length ? 'اختر الحصة.' : 'لا توجد حصص لك في هذا التاريخ.');
        syncSendState();
      }

      async function refreshTargetSlots(preferredLesson = null){
        if (!isSwap) return;
        const token = ++toLoadToken;
        state.toSlots = [];
        state.toSlot = null;
        fillSlotSelect(toLessonSelect, [], 'اختر الحصة...');
        updateSlotPreview(toPreview, null, 'اختر المعلّم والتاريخ.');
        toLessonSelect.disabled = true;

        const toUid = safeText(teacherSelect.value).trim();
        state.toUid = toUid;
        const dateISO = safeText(toDateInput.value).trim();

        const dateErr = validateDateInput(dateISO);
        if (!toUid || dateErr) {
          syncSendState();
          return;
        }

        const slots = await getTeacherSlotsForDate(toUid, dateISO);
        if (token !== toLoadToken) return;
        state.toSlots = slots;
        fillSlotSelect(toLessonSelect, slots, slots.length ? 'اختر الحصة...' : 'لا توجد حصص للمعلم في هذا التاريخ');
        toLessonSelect.disabled = !slots.length;

        const selected = normalizeLessonNumber(preferredLesson || toLessonSelect.value);
        if (selected && slots.some(s => s.lesson === selected)) {
          toLessonSelect.value = String(selected);
        } else if (slots.length === 1) {
          toLessonSelect.value = String(slots[0].lesson);
        }

        const chosenLesson = normalizeLessonNumber(toLessonSelect.value);
        state.toSlot = chosenLesson ? (slots.find(s => s.lesson === chosenLesson) || null) : null;
        updateSlotPreview(toPreview, state.toSlot, slots.length ? 'اختر حصة المعلم.' : 'لا توجد حصص في هذا التاريخ.');
        syncSendState();
      }

      if (isSwap) {
        departmentSelect.addEventListener('change', async () => {
          const selectedDepartment = resolveDepartmentName(departmentSelect.value);
          state.toDepartment = selectedDepartment;
          teacherSelect.innerHTML = '<option value="">اختر المعلّم...</option>';
          teacherSelect.disabled = true;
          teacherMessage.textContent = selectedDepartment ? 'جاري تحميل المعلمين...' : 'اختر القسم أولاً.';
          state.toUid = '';
          await refreshTargetSlots();

          if (!selectedDepartment) {
            syncSendState();
            return;
          }

          const departmentTeachers = await getTeachersByDepartment(selectedDepartment);
          if (!departmentTeachers.length) {
            teacherMessage.textContent = 'لا يوجد معلمون في هذا القسم.';
            syncSendState();
            return;
          }

          teacherSelect.disabled = false;
          teacherMessage.textContent = 'اختر المعلّم.';
          departmentTeachers.forEach(teacher => {
            const opt = document.createElement('option');
            opt.value = teacher.uid;
            opt.textContent = teacher.name;
            teacherSelect.appendChild(opt);
          });
          syncSendState();
        });

        teacherSelect.addEventListener('change', async () => {
          const selectedTeacher = teachers.find(t => t.uid === teacherSelect.value);
          if (selectedTeacher && !state.toDepartment) {
            state.toDepartment = resolveDepartmentName(
              selectedTeacher.normalizedDepartment || selectedTeacher.department || selectedTeacher.subject || ''
            );
          }
          await refreshTargetSlots();
        });
        toDateInput.addEventListener('change', async () => {
          await refreshTargetSlots();
        });
        toLessonSelect.addEventListener('change', () => {
          const chosenLesson = normalizeLessonNumber(toLessonSelect.value);
          state.toSlot = chosenLesson ? (state.toSlots.find(s => s.lesson === chosenLesson) || null) : null;
          updateSlotPreview(toPreview, state.toSlot, state.toSlots.length ? 'اختر حصة المعلم.' : 'لا توجد حصص في هذا التاريخ.');
          syncSendState();
        });
      } else {
        teacherSelect.addEventListener('change', () => {
          state.toUid = safeText(teacherSelect.value).trim();
          syncSendState();
        });
      }

      fromDateInput.addEventListener('change', async () => {
        await refreshFromSlots();
      });
      fromLessonSelect.addEventListener('change', () => {
        const chosenLesson = normalizeLessonNumber(fromLessonSelect.value);
        state.fromSlot = chosenLesson ? (state.fromSlots.find(s => s.lesson === chosenLesson) || null) : null;
        updateSlotPreview(fromPreview, state.fromSlot, state.fromSlots.length ? 'اختر الحصة.' : 'لا توجد حصص لك في هذا التاريخ.');
        syncSendState();
      });

      await refreshFromSlots(defaultFromLesson);
      if (!isSwap) {
        state.toUid = safeText(teacherSelect.value).trim();
        syncSendState();
      }

      sendBtn.addEventListener('click', async ()=>{
        const toUid = safeText(teacherSelect.value).trim();
        if (!toUid) {
          toast({ title: 'ناقص', text: 'اختر المعلّم أولاً.', icon: 'fa-circle-exclamation' });
          return;
        }
        if (toUid === currentUser.uid) {
          toast({ title: 'غير صالح', text: 'لا يمكنك إرسال طلب لنفسك.', icon: 'fa-circle-exclamation' });
          return;
        }

        const sourceDate = safeText(fromDateInput.value).trim();
        const sourceLesson = normalizeLessonNumber(fromLessonSelect.value);
        const sourceSlot = await getTeacherSlotForDateLesson(currentUser.uid, sourceDate, sourceLesson);
        if (!sourceSlot) {

          return;
        }

        const targetTeacher = teachers.find(t => t.uid === toUid) || null;
        const toName = targetTeacher?.name || (await getTeacherName(toUid));
        let toDepartment = isSwap
          ? resolveDepartmentName(state.toDepartment || departmentSelect?.value || '')
          : resolveDepartmentName(targetTeacher?.normalizedDepartment || targetTeacher?.department || targetTeacher?.subject || '');

          toDepartment = resolveDepartmentName(targetTeacher?.subject || '');

            title: 'خطأ',

            icon: 'fa-triangle-exclamation'
          });
          return;
        }

        let targetSlot = null;
        if (isSwap) {
          const targetDate = safeText(toDateInput.value).trim();
          const targetLesson = normalizeLessonNumber(toLessonSelect.value);
          targetSlot = await getTeacherSlotForDateLesson(toUid, targetDate, targetLesson);
          if (!targetSlot) {
            toast({
              title: 'تعذّر إتمام التبديل',
              text: 'المعلم المطلوب لا يملك حصة في التاريخ/الحصة المحددة.',
              icon: 'fa-circle-exclamation'
            });
            return;
          }
        }

        let toHead = null;
        if (toDepartment === fromDepartment) {
          toHead = fromHead;
        } else {
          toHead = await findHeadOfDepartment(toDepartment);
          if (!toHead) {
            toast({
              title: 'خطأ',
              text: 'لا يمكن العثور على رئيس قسم المعلّم المطلوب. تأكد من أن قسمه له رئيس معيّن.',
              icon: 'fa-triangle-exclamation',
              ms: 5000
            });
            return;
          }
        }

        try{
          const qDup = query(
            collection(db,'swapRequests'),
            where('fromTeacherUid','==', currentUser.uid),
            where('date','==', sourceSlot.date),
            where('lesson','==', sourceSlot.lesson),
            where('status','in', ['pending_head_from', 'pending_head_to', 'pending_head']),
            limit(1)
          );
          const dup = await getDocs(qDup);
          if(!dup.empty){
            toast({ title: 'موجود مسبقاً', text: 'يوجد طلب معلّق لهذه الحصة بالفعل.', icon: 'fa-clock' });
            closeModal();
            return;
          }
        }catch(e){
          console.warn('dup check skipped', e);
        }

        sendBtn.setAttribute('disabled','disabled');
        sendBtn.classList.add('loading');

        try{
          const msg = safeText(reqMessage.value).trim();
          const fromName = myName || (await getTeacherName(currentUser.uid));

          await addDoc(collection(db,'swapRequests'), {
            date: sourceSlot.date,
            lesson: sourceSlot.lesson,
            fromDate: sourceSlot.date,
            fromLesson: sourceSlot.lesson,
            fromClassKey: sourceSlot.classKey,
            toDate: isSwap ? targetSlot.date : null,
            toLesson: isSwap ? targetSlot.lesson : null,
            toClassKey: isSwap ? targetSlot.classKey : null,
            type,
            requestVersion: 2,

            fromTeacherUid: currentUser.uid,
            fromTeacherName: fromName,
            fromDepartment,
            fromSubject: currentTeacherProfile?.subject || '',

            toTeacherUid: toUid,
            toTeacherName: toName,
            toDepartment,
            toSubject: targetTeacher?.subject || '',

            fromHeadUid: fromHead.uid,
            fromHeadName: fromHead.name,
            toHeadUid: toHead.uid,
            toHeadName: toHead.name,

            status: 'pending_head_from',
            stage: 'head_from',

            message: msg || null,
            createdAt: serverTimestamp(),

            headUid: fromHead.uid,
            headName: fromHead.name,
            headStatus: 'pending',
            headRespondedAt: null,
            headNote: null,
            respondedAt: null
          });

          toast({ title: 'تم', text: 'تم إرسال الطلب.', icon: 'fa-check-circle' });
          closeModal();
        }catch(e){
          console.error(e);
          toast({ title: 'خطأ', text: 'فشل إرسال الطلب.', icon: 'fa-exclamation-circle' });
        }finally{
          sendBtn.classList.remove('loading');
          syncSendState();
        }
      });
    }

    /* ========= Requests Sheet (طلبات القسم — department heads only) =========
       Ported from depHead/schedual.html so heads no longer need that separate
       page. headUid is set once auth confirms currentRole === 'head'. */
    let headUid = '';
    let unsubRequestsFrom = null;
    let unsubRequestsTo = null;

    function openRequestsSheet(){
      requestsSheet.classList.add('open');
      requestsSheet.setAttribute('aria-hidden','false');
      document.body.style.overflow = 'hidden';
      loadRequests();

    function closeRequestsSheet(){

      requestsSheet.setAttribute('aria-hidden','true');
      document.body.style.overflow = '';
      if(unsubRequestsFrom) unsubRequestsFrom();
      if(unsubRequestsTo) unsubRequestsTo();

    function renderRequestCard(requestDocId, request){

      card.className = 'request-card';
      card.dataset.id = requestDocId;

      const typeLabel = request.type === 'cover' ? 'تغطية' : 'تبديل';
      const typeClass = request.type === 'cover' ? 'type-cover' : 'type-swap';

      let statusLabel = '';
      let statusClass = '';
      switch(request.status) {
        case 'pending_head_from':
          statusLabel = 'بانتظار موافقة رئيس قسم المرسل';
          statusClass = 'status-pending';
          break;
        case 'pending_head_to':
          statusLabel = 'بانتظار موافقة رئيس قسم المستلم';
          statusClass = 'status-pending';
          break;
        case 'accepted':
          statusLabel = 'مقبول';
          statusClass = 'status-accepted';
          break;
        case 'denied':
          statusLabel = 'مرفوض';
          statusClass = 'status-denied';
          break;
        default:
          statusLabel = request.status || '—';
          statusClass = 'status-pending';

      const isToMe = request.toHeadUid === headUid;
      const isFromMe = request.fromHeadUid === headUid;

          <button class="filter-btn btn-solid btn-approve" data-id="${requestDocId}">
            <i class="fas fa-check"></i> موافقة
          </button>
          <button class="filter-btn btn-danger btn-deny" data-id="${requestDocId}">
            <i class="fas fa-xmark"></i> رفض
          </button>
        `;
      } else if(request.status === 'pending_head_to' && isToMe){

          <button class="filter-btn btn-solid btn-approve" data-id="${requestDocId}">
            <i class="fas fa-check"></i> قبول
          </button>
          <button class="filter-btn btn-danger btn-deny" data-id="${requestDocId}">
            <i class="fas fa-xmark"></i> رفض
          </button>

      const fromLessonNumber = Number(request.fromLesson || request.lesson) || 0;
      const fromLessonLabel = fromLessonNumber ? `${LESSONS_AR[fromLessonNumber - 1] || `الحصة #${fromLessonNumber}`} (#${fromLessonNumber})` : '—';
      const toDate = request.toDate || '—';

          ${request.type === 'swap' ? `
