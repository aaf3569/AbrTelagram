<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1"/>
  <meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self' 'unsafe-inline' https://www.gstatic.com https://cdnjs.cloudflare.com https://cdn.jsdelivr.net; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com https://cdnjs.cloudflare.com; img-src 'self' data: blob: https:; font-src 'self' data: https://fonts.gstatic.com https://cdnjs.cloudflare.com; connect-src 'self' https://*.googleapis.com https://*.firebaseio.com wss://*.firebaseio.com https://*.gstatic.com https://cdn.jsdelivr.net https://cdnjs.cloudflare.com; object-src 'none'; base-uri 'self'; form-action 'self'; frame-src 'none'; manifest-src 'self'; upgrade-insecure-requests; block-all-mixed-content">
<meta name="referrer" content="strict-origin-when-cross-origin">
<meta http-equiv="Permissions-Policy" content="camera=(), microphone=(), geolocation=()">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="preconnect" href="https://www.gstatic.com" crossorigin>
  <title>جدول المعلّم - ثانوية أحمد البشر الرومي</title>
  <link href="https://fonts.googleapis.com/css2?family=Noto+Kufi+Arabic:wght@300;400;500;600;700;800;900&display=swap" rel="stylesheet"/>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">

  <link rel="stylesheet" href="/shared/base.css" />
  <style>
    :root {
      --primary: #022b42;
      --primary-2: #044563;
      --primary-light: rgba(2, 43, 66, 0.08);
      --page: #f8fafc;
      --card-bg: #ffffff;
      --text: #0f172a;
      --text-light: #475569;
      --muted: #64748b;
      --border: #e2e8f0;
      --border-light: #f1f5f9;
      --radius: 16px;
      --radius-sm: 12px;
      --shadow-1: 0 4px 12px rgba(2, 43, 66, 0.08);
      --shadow-2: 0 10px 25px rgba(2, 43, 66, 0.12);
      --headerText: #ffffff;
      --focus: #79b3c8;
      --success: #10b981;
      --danger: #ef4444;
      --warning: #f59e0b;
      --transition: all 0.16s ease;
    }

    * { box-sizing: border-box; margin: 0; padding: 0; }
    html, body { height: 100%; }
    body {
      background: var(--page);
      color: var(--text);
      font-family: "Noto Kufi Arabic", system-ui, -apple-system, Segoe UI, Roboto, Arial, sans-serif;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      line-height: 1.6;
      -webkit-tap-highlight-color: transparent;
    }

    body.modal-open { overflow: hidden; }

    /* Header */
    .site-header {
      position: sticky; top: 0; z-index: 20;
      background: rgba(255, 255, 255, 0.85);
      backdrop-filter: blur(12px); -webkit-backdrop-filter: blur(12px);
      border-bottom: 1px solid rgba(2, 43, 66, 0.08);
      box-shadow: 0 2px 10px rgba(2, 43, 66, 0.06);
      padding: 16px 20px;
    }
    .header-container {
      max-width: 1200px; margin: 0 auto;
      display: flex; justify-content: space-between; align-items: center; gap: 16px;
    }
    .site-title {
      font-weight: 900;
      font-size: clamp(1.2rem, 2.5vw, 1.5rem);
      color: var(--primary);
      display: flex; align-items: center; gap: 10px;
    }
    .site-title i { font-size: 1.3em; }
    .top-info { display: flex; gap: 12px; align-items: center; flex-wrap: wrap; }

    .badge {
      padding: 6px 14px; border-radius: 999px; background: var(--primary-light);
      border: 1px solid var(--border); color: var(--primary);
      font-weight: 800; font-size: 12px; display: flex; align-items: center; gap: 6px;
    }
    .badge i { font-size: 0.9em; }

    /* Buttons */
    .filter-btn {
      height: 44px; padding: 0 18px; border-radius: var(--radius-sm);
      border: 1px solid rgba(2, 43, 66, 0.2); background: var(--card-bg); color: var(--primary);
      font-weight: 800; cursor: pointer; box-shadow: var(--shadow-1); transition: var(--transition);
      display: inline-flex; align-items: center; gap: 8px; font-size: 0.9rem; position: relative;
      font-family: "Noto Kufi Arabic", system-ui, -apple-system, Segoe UI, Roboto, Arial, sans-serif;
    }
    .filter-btn:hover { transform: translateY(-2px); box-shadow: var(--shadow-2); border-color: rgba(2, 43, 66, 0.4); }
    .filter-btn:active { transform: translateY(0); }
    .filter-btn.active { background: linear-gradient(135deg, var(--primary-2), var(--primary)); color: var(--headerText); border-color: var(--primary); }
    .filter-btn[disabled], .view-toggle-btn[disabled] { opacity: 0.6; cursor: not-allowed; }

    .btn-solid {
      background: linear-gradient(135deg, var(--primary-2), var(--primary));
      border-color: var(--primary);
      color: var(--headerText);
    }
    .btn-danger {
      background: #fff;
      border-color: rgba(239, 68, 68, 0.35);
      color: #b91c1c;
    }
    .btn-danger:hover { border-color: rgba(239, 68, 68, 0.6); }
    .btn-ghost {
      background: rgba(2, 43, 66, 0.04);
      border-color: rgba(2, 43, 66, 0.14);
      color: var(--primary);
    }

    /* Day/Week segmented toggle */
    .view-toggle {
      display: inline-flex;
      padding: 4px;
      gap: 2px;
      background: rgba(2, 43, 66, 0.06);
      border: 1px solid var(--border);
      border-radius: var(--radius-sm);
    }
    .view-toggle-btn {
      height: 38px; padding: 0 16px; border: 0; border-radius: 9px;
      background: transparent; color: var(--text-light);
      font-weight: 800; font-size: 0.88rem; cursor: pointer; transition: var(--transition);
      display: inline-flex; align-items: center; gap: 8px;
      font-family: "Noto Kufi Arabic", system-ui, -apple-system, Segoe UI, Roboto, Arial, sans-serif;
    }
    .view-toggle-btn:hover { color: var(--primary); }
    .view-toggle-btn.active {
      background: var(--card-bg); color: var(--primary);
      box-shadow: var(--shadow-1);
    }

    /* Floating back button */
    .fab-back {
      position: fixed;
      top: 50%;
      right: 18px;
      transform: translateY(-50%);
      z-index: 30;
      height: 48px; padding: 0 18px 0 20px;
      border-radius: 999px;
      border: 1px solid rgba(2, 43, 66, 0.16);
      background: rgba(255, 255, 255, 0.9);
      backdrop-filter: blur(10px); -webkit-backdrop-filter: blur(10px);
      color: var(--primary);
      font-weight: 900; font-size: 0.92rem; cursor: pointer;
      box-shadow: var(--shadow-2);
      transition: var(--transition);
      display: inline-flex; align-items: center; gap: 10px;
      font-family: "Noto Kufi Arabic", system-ui, -apple-system, Segoe UI, Roboto, Arial, sans-serif;
    }
    .fab-back:hover { transform: translateY(-50%) translateX(-3px); box-shadow: 0 14px 32px rgba(2, 43, 66, 0.2); border-color: rgba(2, 43, 66, 0.3); }
    .fab-back:active { transform: translateY(-50%) scale(0.97); }
    .fab-back i { font-size: 0.95em; }

    /* Loading dot */
    .filter-btn.loading, .view-toggle-btn.loading { position: relative; }
    .filter-btn.loading::after, .view-toggle-btn.loading::after {
      content: ""; width: 10px; height: 10px; border-radius: 50%;
      border: 2px solid currentColor; border-top-color: transparent;
      position: absolute; left: 10px; animation: spin 0.8s linear infinite;
    }
    @keyframes spin { to { transform: rotate(360deg); } }

    /* Main & cards */
    main { flex: 1; padding: 20px; }
    .board { max-width: 1200px; margin: 0 auto; display: flex; flex-direction: column; gap: 20px; }
    .card {
      background: var(--card-bg);
      border: 1px solid var(--border);
      border-radius: var(--radius);
      box-shadow: var(--shadow-1);
      padding: 20px;
      transition: var(--transition);
    }
    .card:hover { box-shadow: var(--shadow-2); }
    .muted { color: var(--muted); font-size: 0.9rem; }

    /* Table */
    .table { display: grid; grid-template-columns: repeat(2, minmax(160px, 1fr)); column-gap: 12px; row-gap: 8px; align-items: stretch; }
    .header-full {
      grid-column: 1 / -1; background: linear-gradient(135deg, var(--primary-2), var(--primary));
      color: var(--headerText); border-radius: var(--radius-sm); padding: 16px; text-align: center;
      font-weight: 900; box-shadow: var(--shadow-1);
      display: flex; align-items: center; justify-content: center; gap: 10px;
    }
    .th {
      background: linear-gradient(135deg, var(--primary-2), var(--primary));
      color: var(--headerText); border-radius: var(--radius-sm);
      padding: 14px 10px; text-align: center; font-weight: 900; box-shadow: var(--shadow-1);
      display: flex; align-items: center; justify-content: center; gap: 8px;
    }
    .cell {
      background: var(--card-bg); border: 1px solid var(--border-light); border-radius: var(--radius-sm);
      padding: 16px 12px; text-align: center; min-height: 60px; display: flex; flex-direction: column; align-items: center; justify-content: center;
      font-weight: 800; transition: var(--transition);
      position: relative;
      line-height: 1.25;
    }
    .cell:hover { border-color: var(--border); transform: translateY(-2px); box-shadow: var(--shadow-1); }
    .small { font-size: 0.8rem; color: var(--muted); margin-top: 4px; font-weight: 700; }
    .lesson-meta {
      width: 100%;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 3px;
      margin-inline: auto;
      text-align: center;
    }
    .lesson-title-row {
      font-weight: 900;
      line-height: 1.2;
      text-align: center;
      direction: rtl;
      width: 100%;
      display: block;
    }
    .lesson-time-row {
      font-size: 0.8rem;
      color: var(--muted);
      font-weight: 700;
      line-height: 1.2;
      direction: ltr;
      text-align: center;
      width: 100%;
      display: block;
    }
    .opportunity-divider {
      grid-column: 1 / -1;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      min-height: 30px;
      padding: 5px 10px;
      border-radius: 999px;
      border: 1px solid rgba(2, 43, 66, 0.18);
      background: rgba(2, 43, 66, 0.06);
      color: var(--primary);
      font-size: 12px;
      font-weight: 900;
      line-height: 1.2;
      text-align: center;
    }
    .opportunity-divider-label {
      display: block;
      width: 100%;
      text-align: center;
      white-space: nowrap;
    }

    .cell.clickable { cursor: pointer; }
    .cell.clickable::after {
      content: "";
      position: absolute; inset: 0;
      border-radius: var(--radius-sm);
      box-shadow: 0 0 0 0 rgba(2, 43, 66, 0.0);
      transition: box-shadow 0.25s ease;
      pointer-events: none;
    }
    .cell.clickable:hover::after { box-shadow: 0 0 0 3px rgba(2, 43, 66, 0.10); }

    /* Grid */
    .grid-wrap { overflow: visible; }
    .grid { direction: rtl; display: grid; grid-template-columns: 140px repeat(7, minmax(130px, 1fr)); gap: 12px; align-items: stretch; }
    .gth {
      background: linear-gradient(135deg, var(--primary-2), var(--primary)); color: var(--headerText);
      border-radius: var(--radius-sm); padding: 14px 10px; text-align: center; font-weight: 900; box-shadow: var(--shadow-1);
      display: grid;
      place-items: center;
      align-content: center;
    }
    .gcell {
      background: var(--card-bg); border: 1px solid var(--border-light); border-radius: var(--radius-sm);
      padding: 14px 10px; display: grid; align-items: center; justify-items: center; text-align: center;
      min-height: 60px; position: relative; font-weight: 800; transition: var(--transition);
    }
    .gcell:hover { border-color: var(--border); transform: translateY(-2px); box-shadow: var(--shadow-1); }
    .day-col { background: var(--primary-light); }

    /* Status */
    .status-message {
      padding: 12px 16px; border-radius: var(--radius-sm); background: var(--primary-light);
      color: var(--primary); font-weight: 700; margin-top: 12px; display: none; align-items: center; gap: 10px;
    }

    /* Highlight (has lesson) */
    .lesson-highlight {
      background-color: #fff9c4 !important;
      border: 2px solid #ffd54f !important;
      color: #5d4037;
      font-weight: 900;
    }

    /* Current lesson highlight (time-based, day view only) */
    .current-lesson {
      background-color: rgba(4, 69, 99, 0.10) !important;
      border: 2px solid var(--primary-2) !important;
      box-shadow: 0 0 0 3px rgba(2, 43, 66, 0.28);
      color: var(--primary-2) !important;
      position: relative;
      font-weight: 900;
    }

    /* Override badges */
    .pill {
      display: inline-flex;
      align-items: center;
      gap: 6px;
      padding: 5px 10px;
      border-radius: 999px;
      font-size: 12px;
      font-weight: 900;
      border: 1px solid var(--border);
      background: rgba(2, 43, 66, 0.06);
      color: var(--primary);
      margin-top: 8px;
      justify-content: center;
      width: fit-content;
    }
    .pill.success {
      background: rgba(16, 185, 129, 0.12);
      border-color: rgba(16, 185, 129, 0.25);
      color: #065f46;
    }
    .pill.warn {
      background: rgba(245, 158, 11, 0.14);
      border-color: rgba(245, 158, 11, 0.30);
      color: #7c2d12;
    }

    /* Compact on mobile */
    .compact-table { display: grid; grid-template-columns: 1fr 1fr; column-gap: 8px; row-gap: 6px; width: 100%; }
    .compact-header {
      grid-column: 1 / -1; background: linear-gradient(135deg, var(--primary-2), var(--primary));
      color: var(--headerText); border-radius: var(--radius-sm); padding: 12px; text-align: center;
      font-weight: 900; display: flex; align-items: center; justify-content: center; gap: 10px; margin-bottom: 8px;
    }
    .compact-th {
      background: var(--primary-light); border: 1px solid var(--border);
      border-radius: var(--radius-sm); padding: 10px 8px; text-align: center;
      font-weight: 900; font-size: 0.9rem;
      display: flex; align-items: center; justify-content: center; gap: 8px;
    }
    .compact-cell {
      background: var(--card-bg); border: 1px solid var(--border-light);
      border-radius: var(--radius-sm); padding: 12px 8px; text-align: center;
      min-height: 50px; display: flex; flex-direction: column; align-items: center; justify-content: center;
      font-weight: 800; font-size: 0.9rem;
      position: relative;
      line-height: 1.25;
    }
    .compact-cell.lesson-cell {
      align-items: stretch;
      justify-content: center;
    }
    .compact-cell.lesson-cell .lesson-meta {
      min-height: 100%;
      justify-content: center;
    }
    .compact-cell.clickable { cursor: pointer; }
    .compact-cell.clickable:hover { border-color: var(--border); box-shadow: var(--shadow-1); transform: translateY(-1px); }

    /* Sheet */
    .sheet {
      position: fixed; inset: 0; z-index: 50; background: var(--page);
      display: flex; flex-direction: column;
      transform: translateX(100%);
      transition: transform 0.3s cubic-bezier(0.22, 0.7, 0.25, 1);
    }
    .sheet.open { transform: translateX(0); }
    .sheet-header {
      background: var(--card-bg); border-bottom: 1px solid var(--border);
      padding: 18px 20px; display: flex; align-items: center; gap: 12px;
      position: sticky; top: 0; z-index: 10;
      box-shadow: 0 2px 8px rgba(2, 43, 66, 0.06);
    }
    .back-btn {
      height: 44px; padding: 0 18px; border-radius: var(--radius-sm);
      border: 1px solid rgba(2, 43, 66, 0.25); background: var(--card-bg);
      color: var(--primary); font-weight: 900; cursor: pointer;
      box-shadow: var(--shadow-1); transition: var(--transition);
      display: flex; align-items: center; gap: 8px;
      font-family: "Noto Kufi Arabic", system-ui, -apple-system, Segoe UI, Roboto, Arial, sans-serif;
    }
    .back-btn:hover { transform: translateY(-2px); box-shadow: var(--shadow-2); }
    .sheet-title { margin: 0; font-size: 1.15rem; font-weight: 900; color: var(--primary); }
    .sheet-body {
      flex: 1 1 auto; overflow: auto; padding: 24px;
      max-width: 1200px; margin: 0 auto;
      display: flex; flex-direction: column; gap: 20px; width: 100%;
    }

    .input-wrap {
      display: flex; align-items: center; gap: 12px; min-height: 52px; padding: 0 16px;
      background: var(--card-bg);
      border: 1px solid var(--border);
      border-radius: var(--radius-sm);
      box-shadow: var(--shadow-1);
      transition: var(--transition);
    }
    .input-wrap:focus-within { border-color: var(--primary); box-shadow: 0 0 0 3px rgba(2, 43, 66, 0.1); }
    .select, .input {
      flex: 1; height: 50px; border: none; outline: none; background: transparent;
      font-size: 1rem; font-weight: 800; color: var(--text);
      font-family: "Noto Kufi Arabic", system-ui, -apple-system, Segoe UI, Roboto, Arial, sans-serif;
      cursor: pointer;
    }
    .input { cursor: text; font-weight: 700; }
    .input::placeholder { color: rgba(71, 85, 105, 0.65); font-weight: 700; }
    .more-actions {
      margin-top: 12px;
      display: flex;
      gap: 10px;
      flex-wrap: wrap;
    }
    .more-actions .filter-btn {
      flex: 1 1 220px;
      justify-content: center;
      white-space: nowrap;
    }
    @media (max-width: 480px) {
      .more-actions { flex-direction: column; }
      .more-actions .filter-btn { width: 100%; flex: initial; }
    }

    /* Modal - IMPROVED FOR MOBILE */
    .modal {
      position: fixed; inset: 0; z-index: 70;
      display: none;
      align-items: center; justify-content: center;
      padding: 16px;
      width: 100%;
      height: 100%;
      box-sizing: border-box;
    }
    .modal.open { display: flex; }
    .modal-backdrop {
      position: absolute; inset: 0;
      background: rgba(2, 43, 66, 0.55);
      backdrop-filter: blur(10px);
      -webkit-backdrop-filter: blur(10px);
      animation: fadeIn 0.18s ease both;
    }
    @keyframes fadeIn { from { opacity: 0; } to { opacity: 1; } }

    .modal-card {
      position: relative;
      width: 100%;
      max-width: 720px;
      max-height: min(92vh, calc(100vh - 32px));
      background: rgba(255,255,255,0.97);
      border: 1px solid rgba(226, 232, 240, 0.9);
      border-radius: 20px;
      box-shadow: 0 24px 60px rgba(2, 43, 66, 0.25);
      overflow: hidden;
      transform: translateY(10px) scale(0.98);
      animation: popIn 0.18s ease both;
      display: flex;
      flex-direction: column;
      padding-bottom: env(safe-area-inset-bottom, 0);
    }
    @keyframes popIn { to { transform: translateY(0) scale(1); } }

    .modal-head {
      padding: 16px 18px;
      background: linear-gradient(135deg, rgba(4, 69, 99, 0.12), rgba(2, 43, 66, 0.05));
      border-bottom: 1px solid rgba(226, 232, 240, 0.85);
      display: flex; align-items: center; justify-content: space-between; gap: 12px;
      flex-shrink: 0;
    }
    .modal-title {
      font-weight: 900;
      color: var(--primary);
      display: flex; align-items: center; gap: 10px;
      font-size: 1.05rem;
      flex: 1;
      min-width: 0;
    }
    .modal-title span:last-child {
      overflow: hidden;
      text-overflow: ellipsis;
      white-space: nowrap;
    }
    .icon-circle {
      width: 36px; height: 36px; border-radius: 12px;
      background: rgba(2, 43, 66, 0.08);
      border: 1px solid rgba(2, 43, 66, 0.10);
      display: grid; place-items: center;
      color: var(--primary);
      flex-shrink: 0;
    }
    .modal-close {
      width: 44px; height: 44px; border-radius: 14px;
      border: 1px solid rgba(2, 43, 66, 0.18);
      background: rgba(255,255,255,0.75);
      cursor: pointer;
      display: grid; place-items: center;
      color: var(--primary);
      box-shadow: var(--shadow-1);
      transition: var(--transition);
      flex-shrink: 0;
    }
    .modal-close:hover { transform: translateY(-2px); box-shadow: var(--shadow-2); }
    .modal-body {
      padding: 18px;
      display: flex;
      flex-direction: column;
      gap: 14px;
      overflow-y: auto;
      -webkit-overflow-scrolling: touch;
      flex: 1;
      min-height: 0;
    }
    .modal-footer {
      padding: 16px 18px;
      border-top: 1px solid rgba(226, 232, 240, 0.85);
      display: flex; gap: 10px; justify-content: flex-start; flex-wrap: wrap;
      background: rgba(248, 250, 252, 0.65);
      flex-shrink: 0;
    }

    .info-grid {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 10px;
    }
    .info-box {
      border: 1px solid rgba(226, 232, 240, 0.95);
      background: rgba(255,255,255,0.8);
      border-radius: 14px;
      padding: 12px;
      box-shadow: 0 8px 18px rgba(2, 43, 66, 0.06);
    }
    .info-k { color: var(--muted); font-weight: 800; font-size: 12px; margin-bottom: 6px; display: flex; align-items: center; gap: 8px; }
    .info-v { color: var(--text); font-weight: 900; font-size: 14px; }

    .split {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 12px;
    }
    .hint {
      display: flex; align-items: flex-start; gap: 10px;
      padding: 12px;
      border-radius: 14px;
      background: rgba(2, 43, 66, 0.06);
      border: 1px solid rgba(2, 43, 66, 0.10);
      color: var(--primary);
      font-weight: 700;
    }

    .toast-wrap {
      position: fixed;
      bottom: 18px;
      left: 18px;
      z-index: 90;
      display: flex;
      flex-direction: column;
      gap: 10px;
      width: min(420px, calc(100% - 36px));
    }
    .toast {
      border-radius: 16px;
      background: rgba(255,255,255,0.92);
      border: 1px solid rgba(226, 232, 240, 0.95);
      box-shadow: 0 18px 50px rgba(2, 43, 66, 0.18);
      padding: 12px 14px;
      display: flex;
      align-items: flex-start;
      gap: 12px;
      animation: toastIn 0.22s ease both;
    }
    @keyframes toastIn {
      from { opacity: 0; transform: translateY(10px); }
      to { opacity: 1; transform: translateY(0); }
    }
    .toast .ticon {

  <script src="https://cdnjs.cloudflare.com/ajax/libs/html2canvas/1.4.1/html2canvas.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/jspdf@2.5.1/dist/jspdf.umd.min.js"></script>

  <script type="module">
    import { firebaseConfig } from "/shared/firebase.js";
    /* ========= Firebase ========= */
    import { initializeApp, getApp, getApps } from "/shared/firebase.js";
    import {
      getAuth, onAuthStateChanged, setPersistence, browserLocalPersistence
    } from "/shared/firebase.js";
    import {
      initializeFirestore, persistentSingleTabManager,
      collection, getDocs, query, where, doc, getDoc,
      addDoc, serverTimestamp, updateDoc, runTransaction,
      limit, orderBy, onSnapshot
    } from "/shared/firebase.js";

    

    const app = getApps().length ? getApp() : initializeApp(firebaseConfig);
    let db;
    try {
      db = initializeFirestore(app, {
        localCache: persistentSingleTabManager()
      });
    } catch (e) {
      db = initializeFirestore(app, {});
    }
    const auth = getAuth(app);

    /* ========= Constants ========= */
    const DAYS_AR = ["الأحد","الاثنين","الثلاثاء","الأربعاء","الخميس"]; // Sun→Thu
    const LESSONS_AR = [
      "الحصة الأولى","الحصة الثانية","الحصة الثالثة",
      "الحصة الرابعة","الحصة الخامسة","الحصة السادسة","الحصة السابعة"
    ];
    const FIXED_LESSON_COUNT = 7;

    const CLASS_OPTIONS = [
      "10 / 1","10 / 2","10 / 3","10 / 4","10 / 5","10 / 6","10 / 7",
      "11 / 1 ع","11 / 2 ع","11 / 3 ع","11 / 4 ع","11 / 5 ع","11 / 1 د",
      "12 / 1 ع","12 / 2 ع","12 / 3 ع","12 / 4 ع","12 / 5 ع","12 / 1 د"
    ];

    const FIXED_DEPARTMENTS = [
      "اللغة العربية",
      "اللغة الإنجليزية",
      "الرياضيات",
      "التربية الإسلامية",
      "التاريخ",
      "الجغرافيا",
      "الاقتصاد",
      "الفلسفة",
      "علم النفس",
      "الفيزياء",
      "الكيمياء",
      "الأحياء",
      "الجيولوجيا",
      "الحاسوب",
      "التربية البدنية",
      "التربية الفنية"
    ];

    const MERGED_DEPARTMENT_GROUPS = [
      { department: "الفيزياء والكيمياء", subjects: ["الفيزياء","الكيمياء"] },
      { department: "الجيولوجيا والأحياء", subjects: ["الجيولوجيا","الأحياء"] },
      { department: "علم النفس والفلسفة", subjects: ["علم النفس","الفلسفة"] },
      { department: "التاريخ والجغرافيا", subjects: ["التاريخ","الجغرافيا","جغرافيا"] }
    ];
    function resolveDepartmentName(rawValue){
      const value = (rawValue || "").toString().trim();
      if(!value) return "";
      for(const group of MERGED_DEPARTMENT_GROUPS){
        if(value === group.department || group.subjects.includes(value)) return group.department;
      }
      return value;
    }

    /* ========= Live Lesson Times ========= */
    let LESSON_TIMES = [
      { start: "07:55", end: "08:40" },
      { start: "08:45", end: "09:30" },
      { start: "09:35", end: "10:20" },
      { start: "10:35", end: "11:20" },
      { start: "11:25", end: "12:10" },
      { start: "12:25", end: "13:10" },
      { start: "13:15", end: "13:55" }
    ];

    const BREAK_LABELS = {
      first: "الفرصة الأولى",
      second: "الفرصة الثانية"
    };
    let SCHOOL_BREAKS = { firstAfter: null, secondAfter: null };
    let lessonTimesUnsubscribe = null;
    let currentLessonTimer = null;

    function normalizeBreakAfterLesson(value){
      const normalized = normalizeLessonNumber(value);
      return normalized || null;
    }

    function normalizeSchoolBreaks(raw = {}){
      const firstRaw = raw.firstAfter ?? raw.opportunity1After ?? raw.opportunityOneAfter;
      const secondRaw = raw.secondAfter ?? raw.opportunity2After ?? raw.opportunityTwoAfter;
      const firstAfter = normalizeBreakAfterLesson(firstRaw);
      let secondAfter = normalizeBreakAfterLesson(secondRaw);
      if (firstAfter && secondAfter && firstAfter === secondAfter) secondAfter = null;
      return { firstAfter, secondAfter };
    }

    function getOpportunityLabelsForLesson(lessonNumber){
      const normalized = normalizeLessonNumber(lessonNumber);
      if(!normalized) return [];
      const labels = [];
      if(SCHOOL_BREAKS.firstAfter === normalized) labels.push(BREAK_LABELS.first);
      if(SCHOOL_BREAKS.secondAfter === normalized) labels.push(BREAK_LABELS.second);
      return labels;
    }

    function renderOpportunityDivider(parentEl, lessonNumber){
      if(!parentEl) return;
      const labels = getOpportunityLabelsForLesson(lessonNumber);
      if(!labels.length) return;
      const divider = document.createElement('div');
      divider.className = 'opportunity-divider';
      divider.dataset.lessonAfter = String(lessonNumber);
      divider.innerHTML = `<span class="opportunity-divider-label">${escapeHtml(labels.join(' • '))}</span>`;
      parentEl.appendChild(divider);
    }

    function lessonMetaHtml(lessonNumber){
      const lesson = normalizeLessonNumber(lessonNumber) || 1;
      const lessonLabel = LESSONS_AR[lesson - 1] || `الحصة #${lesson}`;
      return `
        <div class="lesson-meta" data-lesson-meta="${lesson}">
          <div class="lesson-title-row">${escapeHtml(lessonLabel)}</div>
          <div class="lesson-time-row" data-lesson-time>${escapeHtml(lessonTimeLabel(lesson))}</div>
        </div>
      `;
    }

    function refreshRenderedLessonMeta(root = document){
      if(!root?.querySelectorAll) return;
      root.querySelectorAll('[data-lesson-meta]').forEach((metaEl)=>{
        const lessonNumber = normalizeLessonNumber(metaEl.dataset.lessonMeta);
        if(!lessonNumber) return;

        const timeEl = metaEl.querySelector('[data-lesson-time]');
        if(timeEl) timeEl.textContent = lessonTimeLabel(lessonNumber);
      });
    }

    function setupLessonTimesListener() {
      if (lessonTimesUnsubscribe) {
        lessonTimesUnsubscribe();
      }
      
      const lessonTimesDocRef = doc(db, 'settings', 'lessonTimes');
      lessonTimesUnsubscribe = onSnapshot(lessonTimesDocRef, (snap) => {
        if (snap.exists()) {
          const data = snap.data() || {};
          const breakSource = data.opportunityBreaks || data;
          SCHOOL_BREAKS = normalizeSchoolBreaks(breakSource);

          if (data.times && Array.isArray(data.times) && data.times.length === 7) {
            let valid = true;
            for (let i = 0; i < data.times.length; i++) {
              const t = data.times[i];
              if (!t.start || !t.end || typeof t.start !== 'string' || typeof t.end !== 'string') {
                valid = false;
                break;
              }
            }
            if (valid) {
              LESSON_TIMES = data.times;
              console.log('Lesson times updated from Firestore:', LESSON_TIMES);
            } else {
              console.warn('Invalid lesson times structure in Firestore, using defaults');
            }
          } else {
            console.warn('No valid times array in Firestore, using defaults');
          }
        } else {
          console.log('No lesson times document in Firestore, using defaults');
          SCHOOL_BREAKS = { firstAfter: null, secondAfter: null };
        }

        updateLessonTimeLabels();
        updateCurrentLessonHighlight();
        updateCompactViewTimeLabels();
        updateClassWeekGridTimeLabels();
      }, (error) => {
        console.error("Error listening to lesson times:", error);
      });
    }

    function updateLessonTimeLabels() {
      refreshRenderedLessonMeta(containerMain);
      refreshRenderedLessonMeta(classWeekGrid);

      if (currentView === 'today' && activeTodayISO && activeTodayByLesson instanceof Map) {
        renderTodayTable(activeTodayISO, activeTodayByLesson);
      } else {
        updateCurrentLessonHighlight();
      }
    }

    function updateCompactViewTimeLabels() {
      refreshRenderedLessonMeta(containerMain);
    }

    function updateClassWeekGridTimeLabels() {
      refreshRenderedLessonMeta(classWeekGrid);
    }

    function startCurrentLessonTimer() {
      if (currentLessonTimer) {
        clearInterval(currentLessonTimer);
      }
      
      currentLessonTimer = setInterval(() => {
        updateCurrentLessonHighlight();
      }, 20000);
    }

    /* ========= Elements ========= */
    const containerMain = document.getElementById('containerMain');
    const statusEl      = document.getElementById('status');
    const btnBackMain = document.getElementById('btnBackMain');

    const btnToday = document.getElementById('btnToday');
    const btnWeek  = document.getElementById('btnWeek');
    const btnDownloadPdf = document.getElementById('btnDownloadPdf');
    const btnMore  = document.getElementById('btnMore');

    const moreSheet   = document.getElementById('moreSheet');
    const closeMore   = document.getElementById('closeMore');
    const classPicker = document.getElementById('classPicker');
    const btnDownloadAllClassesPdf = document.getElementById('btnDownloadAllClassesPdf');
    const btnDownloadSelectedClassPdf = document.getElementById('btnDownloadSelectedClassPdf');
    const classWeekGrid = document.getElementById('classWeekGrid');

    const modalEl = document.getElementById('modal');
    const modalBackdrop = document.getElementById('modalBackdrop');
    const modalCloseBtn = document.getElementById('modalClose');
    const modalTitleText = document.getElementById('modalTitleText');
    const modalBody = document.getElementById('modalBody');
    const modalFooter = document.getElementById('modalFooter');

    const toastWrap = document.getElementById('toastWrap');

    /* ========= State ========= */
    let weekDates = []; // ISO strings Sun→Thu
    let currentUser = null;
    let currentRole = '';
    let currentTeacherProfile = null;

    let currentView = 'today'; // today | week
    let activeTodayISO = null; // what is rendered in day view
    let activeTodayByLesson = new Map(); // current day map for click
    let activeTodayMeta = new Map(); // lesson -> meta for swap/cover

    let unsubPendingRequests = null;

    const cache = {
      teacherWeek: new Map(), // uid -> Map(iso -> Map(lesson->classText))
      classWeek: new Map(),   // classKey -> Map(iso -> Map(lesson->text))
      overridesByTeacher: new Map(), // uid -> Map(date->Map(lesson->overrideObj))
      teacherNameByUid: new Map(),
      teacherList: null, // [{uid,name}]
      weekKey: "",
      customDayDocs: new Map() // "day:{dayIndex}" -> customDaySchedules rows
    };

    /* ========= Helpers ========= */
    const pad2 = (n)=> String(n).padStart(2,'0');
    const toISO = (d)=> {
      const y = d.getUTCFullYear();
      const m = pad2(d.getUTCMonth() + 1);
      const dd = pad2(d.getUTCDate());
      return `${y}-${m}-${dd}`;
    };
    const isoToUTCDate = (iso)=> {
      const [y,m,d] = String(iso || '').split('-').map(Number);
      return new Date(Date.UTC(y || 0, (m || 1) - 1, d || 1));
    };
    const kuwaitTodayISO = ()=> {
      const fmt = new Intl.DateTimeFormat('en-CA',{
        timeZone:'Asia/Kuwait', year:'numeric', month:'2-digit', day:'2-digit'
      });
      return fmt.format(new Date());
    };
    const startOfWeekSunday = (iso)=> {
      const d = isoToUTCDate(iso);
      const diff = d.getUTCDay();
      const s = new Date(d);
      s.setUTCDate(d.getUTCDate() - diff);
      return toISO(s);
    };
    const addDaysISO = (iso,n)=> {
      const d = isoToUTCDate(iso);
      d.setUTCDate(d.getUTCDate() + n);
      return toISO(d);
    };

    const parseClassKey = (label)=> {
      const m = (label||"").match(/^(\d+)\s*\/\s*(\d+)(?:\s*(.+))?$/);
      if(!m) return {grade:'', section:'', track:undefined, classKey: label};
      const grade=m[1], section=m[2], track=(m[3]||"").trim();
      return { grade, section, track: track || undefined, classKey: label };
    };

    function setFilterActive(which){
      [btnToday, btnWeek].forEach(b=> b.classList.remove('active'));
      which.classList.add('active');
    }
    function clearStatus(){
      statusEl.textContent='';
      statusEl.style.display = 'none';
    }
    function showStatus(message, isError = false) {
      statusEl.textContent = message;
      statusEl.style.display = 'flex';
      statusEl.style.background = isError ? '#fef2f2' : 'var(--primary-light)';
      statusEl.style.color = isError ? '#dc2626' : 'var(--primary)';
    }
    function setLoading(btn, on=true){
      if(!btn) return;
      if(on){ btn.classList.add('loading'); btn.setAttribute('disabled','disabled'); }
      else { btn.classList.remove('loading'); btn.removeAttribute('disabled'); }
    }
    function dayNameByISO(iso){
      const idx = weekDates.indexOf(iso);
      return idx>=0 ? DAYS_AR[idx] : '';
    }
    function lessonTimeLabel(idx){
      const t = LESSON_TIMES[idx-1];
      if(!t) return '—';
      return `${t.start} - ${t.end}`;
    }

    function safeText(s){
      return (s ?? '').toString();
    }

    function toast({title, text, icon='fa-info-circle', ms=3500}){
      const el = document.createElement('div');
      el.className = 'toast';
      el.innerHTML = `
        <div class="ticon"><i class="fas ${icon}"></i></div>
        <div class="tmain">
          <div class="ttitle">${escapeHtml(title)}</div>
          <div class="ttext">${escapeHtml(text)}</div>
        </div>
        <button class="tclose" type="button" aria-label="إغلاق">
          <i class="fas fa-times"></i>
        </button>
      `;
      const close = ()=> {
        el.style.opacity = '0';
        el.style.transform = 'translateY(8px)';
        setTimeout(()=> el.remove(), 180);
      };
      el.querySelector('.tclose').addEventListener('click', close);
      toastWrap.appendChild(el);
      setTimeout(close, ms);
    }

    function escapeHtml(str){
      return String(str)
        .replaceAll('&','&amp;')
        .replaceAll('<','&lt;')
        .replaceAll('>','&gt;')
        .replaceAll('"','&quot;')
        .replaceAll("'","&#039;");
    }

    function toArabicDigits(str){
      const digits = ['٠','١','٢','٣','٤','٥','٦','٧','٨','٩'];
      return String(str ?? '').replace(/\d/g, d => digits[Number(d)]);
    }

    function formatClassLabelForPdf(value){
      const raw = safeText(value).trim();
      if (!raw || raw === '—') return '—';
      return toArabicDigits(raw.replace(/\s*\/\s*/g, ' / '));
    }

    function formatClassKeyLabel(value){
      return formatClassLabelForPdf(value || '—');
    }

    function formatDateArabic(iso){
      const raw = safeText(iso).trim();
      const m = raw.match(/^(\d{4})-(\d{2})-(\d{2})$/);
      if (!m) return toArabicDigits(raw);

      const year2 = Number(m[1]).toString().slice(-2);
      const month = String(Number(m[2]));
      const day = String(Number(m[3]));
      return toArabicDigits(`${day} / ${month} / ${year2}`);
    }

    function filenameSafe(value){
      return safeText(value)
        .trim()
        .replace(/[\\/:*?"<>|]+/g, '-')
        .replace(/\s+/g, '-');
    }

    function formatDateArabicCompact(iso){
      const raw = safeText(iso).trim();
      const m = raw.match(/^(\d{4})-(\d{2})-(\d{2})$/);
      if (!m) return toArabicDigits(raw);
      const year2 = Number(m[1]).toString().slice(-2);
      const month = String(Number(m[2]));
      const day = String(Number(m[3]));
      return toArabicDigits(`${day}-${month}-${year2}`);
    }

    function shortTeacherName(value){
      const normalized = safeText(value).replace(/\s+/g, ' ').trim();
      if (!normalized) return '—';
      const parts = normalized.split(' ');
      if (parts.length === 1) return parts[0];
      return `${parts[0]} ${parts[parts.length - 1]}`;
    }

    function lessonHeaderHtml(label){
      const words = safeText(label).replace(/\s+/g, ' ').trim().split(' ').filter(Boolean);
      if (!words.length) return '<div class="lesson-main">—</div>';
      if (words.length === 1) return `<div class="lesson-main">${escapeHtml(words[0])}</div>`;
      const top = words[0];
      const main = words.slice(1).join(' ');
      return `<div class="lesson-small">${escapeHtml(top)}</div><div class="lesson-main">${escapeHtml(main)}</div>`;
    }

    /* ========= NEW: time → current lesson index ========= */
    function getCurrentKuwaitMinutes() {
      const now = new Date();
      const fmt = new Intl.DateTimeFormat('en-GB', {
        timeZone: 'Asia/Kuwait',
        hour: '2-digit',
        minute: '2-digit',
        hour12: false
      });
      const parts = fmt.formatToParts(now);
      const h = parseInt(parts.find(p => p.type === 'hour').value, 10);
      const m = parseInt(parts.find(p => p.type === 'minute').value, 10);
      return h * 60 + m;
    }

    function parseTimeToMinutes(t) {
      const [h, m] = t.split(':').map(Number);
      return h * 60 + m;
    }

    // returns 1..7 or null if outside all lessons
    function getActiveLessonIndex() {
      const minutes = getCurrentKuwaitMinutes();
      for (let i = 0; i < LESSON_TIMES.length; i++) {
        const start = parseTimeToMinutes(LESSON_TIMES[i].start);
        const end   = parseTimeToMinutes(LESSON_TIMES[i].end);
        if (minutes >= start && minutes < end) {
          return i + 1;
        }
      }
      return null;
    }

      if(cache.teacherList) return cache.teacherList;
      const list = [];

        snap.forEach(d=>{

          if(role === 'user' || role === 'admin' || role === 'head'){
            const subject = (data.subject || '').toString().trim();
            const department = (data.department || '').toString().trim();
            const normalizedDepartment = resolveDepartmentName(department || subject);
            list.push({

              role: data.role,

    async function loadOverridesForTeacherInDates(uid, dates){
      if(!uid) return;

      const targetDates = Array.isArray(dates) ? dates : [dates];
      const mapByDate = cache.overridesByTeacher.get(uid) || new Map();

      let allCached = true;
      for(const iso of targetDates){
        if(!mapByDate.has(iso)) { allCached = false; break; }
      }
      if(allCached){
        cache.overridesByTeacher.set(uid, mapByDate);
        return mapByDate;
      }

      for(const iso of targetDates){
        if(!mapByDate.has(iso)) mapByDate.set(iso, new Map());
      }

      try{
        const qNew = query(
          collection(db,'scheduleOverrides'),
          where('newTeacherUid','==', uid),
          where('active','==', true),
          where('date','in', targetDates)
        );
        const qOld = query(
          collection(db,'scheduleOverrides'),
          where('originalTeacherUid','==', uid),
          where('active','==', true),
          where('date','in', targetDates)
        );
        const [sNew, sOld] = await Promise.all([getDocs(qNew), getDocs(qOld)]);
        sNew.forEach(d=>{
          const x = d.data();
          if(!x || !x.date) return;
          const iso = x.date;
          if(!mapByDate.has(iso)) mapByDate.set(iso, new Map());
          mapByDate.get(iso).set(Number(x.lesson), { ...x, _id: d.id, _kind: 'new' });
        });

        sOld.forEach(d=>{
          const x = d.data();
          if(!x || !x.date) return;
          const iso = x.date;
          if(!mapByDate.has(iso)) mapByDate.set(iso, new Map());

          const existing = mapByDate.get(iso).get(Number(x.lesson));
          if(!existing){
            mapByDate.get(iso).set(Number(x.lesson), { ...x, _id: d.id, _kind: 'original' });
          }
        });

      }catch(e){
        console.error(e);
      }

      cache.overridesByTeacher.set(uid, mapByDate);
      return mapByDate;
    }

    async function getOverrideForTeacher(uid, dateISO, lesson){
      const mapByDate = await loadOverridesForTeacherInDates(uid, [dateISO]);
      const dayMap = mapByDate.get(dateISO);
      return dayMap ? (dayMap.get(Number(lesson)) || null) : null;
    }

    // Schedule entries recur weekly (identified by weekday, not calendar date),
    // so lookups match by dayIndex (0=Sun..4=Thu) rather than an exact date.
    function dayIndexForISO(iso){
      const m = /^(\d{4})-(\d{2})-(\d{2})$/.exec((iso || '').toString());
      if(!m) return -1;
      const d = new Date(Number(m[1]), Number(m[2]) - 1, Number(m[3]));
      return d.getDay();
    }

    function mergeCustomScheduleIntoMap(byLesson, uid, customRows){
      customRows.forEach(row=>{
        const lessonsArr = Array.isArray(row.lessons) ? row.lessons : [];
        const max = Math.min(7, Number(row.lessonCount) || lessonsArr.length || 7);
        for(let i=0;i<max;i++){
          const lessonRow = lessonsArr[i] || {};
          if((lessonRow.teacherUid || '').toString() !== uid) continue;
          const key = String(i + 1);
          if(byLesson.has(key)) continue;
          let classKey = (row.classKey || lessonRow.classKey || '').toString().trim();
          if(!classKey && row.grade && row.section){
            classKey = `${row.grade} / ${row.section}${row.track ? ` ${row.track}` : ''}`;
          }
          if(!classKey) continue;
          byLesson.set(key, { ...lessonRow, classKey, lesson: key, _source: 'custom' });
        }
      });
    }

    async function buildTodayMapWithOverrides(uid, dateISO){
      const byLesson = new Map();
      const dayIndex = dayIndexForISO(dateISO);

      const q1 = query(
        collection(db,'schedules'),
        where('teacherUid','==', uid),
        where('dayIndex','==', dayIndex)
      );
      const [snap, , customRows] = await Promise.all([
        getDocs(q1),
        loadOverridesForTeacherInDates(uid, [dateISO]),
        fetchCustomScheduleDocsForDayIndex(dayIndex)
      ]);
      snap.forEach(d=>{
        const x=d.data();
        byLesson.set(String(x.lesson), x);
      });

      const mapByDate = cache.overridesByTeacher.get(uid) || new Map();
      const dayMap = mapByDate.get(dateISO) || new Map();

      for(let i=1;i<=FIXED_LESSON_COUNT;i++){
        const o = dayMap.get(i);
        if(!o) continue;

        if(o._kind === 'new'){
          byLesson.set(String(i), {
            classKey: o.classKey || '—',
            _isOverride: true,
            _overrideInfo: o
          });
        } else if(o._kind === 'original'){
          byLesson.set(String(i), {
            _coveredAway: true,
            _isOverride: true,
            _overrideInfo: o
          });
        }
      }

      mergeCustomScheduleIntoMap(byLesson, uid, customRows);

      return byLesson;
    }

    function buildClassKeyFromScheduleData(data){
      const d = data || {};
      if (d.classKey) return String(d.classKey);
      const grade = safeText(d.grade).trim();
      const section = safeText(d.section).trim();
      const track = safeText(d.track).trim();
      if (!grade && !section) return '';
      return `${grade} / ${section}${track ? ` ${track}` : ''}`.trim();
    }

    function isSchoolDayISO(iso){
      if (!iso) return false;
      const day = isoToUTCDate(iso).getUTCDay();
      return day >= 0 && day <= 4;
    }

    function isPastISO(iso){
      if (!iso) return false;
      return iso < kuwaitTodayISO();
    }

    function normalizeLessonNumber(value){
      const lesson = Number(value);
      if (!Number.isFinite(lesson)) return null;
      if (lesson < 1 || lesson > FIXED_LESSON_COUNT) return null;
      return Math.floor(lesson);
    }

    async function getTeacherSlotsForDate(uid, dateISO){
      if (!uid || !dateISO) return [];
      const map = await buildTodayMapWithOverrides(uid, dateISO);
      const slots = [];
      for (let i = 1; i <= FIXED_LESSON_COUNT; i++) {
        const hit = map.get(String(i));
        if (!hit || hit._coveredAway) continue;
        slots.push({
          date: dateISO,
          lesson: i,
          classKey: hit.classKey || buildClassKeyFromScheduleData(hit) || '—',
          subject: hit.subject || '',
          teacherUid: uid
        });
      }
      return slots;
    }

    async function getTeacherSlotForDateLesson(uid, dateISO, lesson){
      const lessonNum = normalizeLessonNumber(lesson);
      if (!uid || !dateISO || !lessonNum) return null;
      const slots = await getTeacherSlotsForDate(uid, dateISO);
      return slots.find(x => x.lesson === lessonNum) || null;
    }

      }

      const [snap] = await Promise.all([
        fetchWeekDocsForTeacher(uid),
        loadOverridesForTeacherInDates(uid, weekDates)
      ]);
      snap.forEach(d => {
        const x = d.data();
        // Standing schedule entries recur by weekday — resolve to *this* week's
        // actual date for the matching weekday, not the (possibly stale) date
        // the entry happens to have last been saved with.
        const iso = weekDates[Number(x.dayIndex)];
        if (iso === undefined) return;
        if (!map.has(iso)) map.set(iso, new Map());
        const classText = x.classKey || `${x.grade} / ${x.section}${x.track ? ' '+x.track : ''}`;
        map.get(iso).set(Number(x.lesson), classText);
      });

      const mapByDate = cache.overridesByTeacher.get(uid) || new Map();
      for (const iso of weekDates) {
        const dayOv = mapByDate.get(iso);
        if (!dayOv) continue;
        for (let i = 1; i <= FIXED_LESSON_COUNT; i++) {
          const o = dayOv.get(i);
          if (!o) continue;
          if (o._kind === 'new') {
            map.get(iso).set(i, (o.classKey || 'بديل'));
          } else if (o._kind === 'original') {
            map.get(iso).set(i, '—');
          }
        }
      }

      const customRowsByDay = await Promise.all(
        weekDates.map((iso, dayIdx) => fetchCustomScheduleDocsForDayIndex(dayIdx))
      );
      weekDates.forEach((iso, dayIdx) => {
        const dayMap = map.get(iso);
        const customRows = customRowsByDay[dayIdx];
        customRows.forEach(row=>{
          const lessonsArr = Array.isArray(row.lessons) ? row.lessons : [];
          const max = Math.min(7, Number(row.lessonCount) || lessonsArr.length || 7);
          for(let i=0;i<max;i++){
            const lessonRow = lessonsArr[i] || {};
            if((lessonRow.teacherUid || '').toString() !== uid) continue;
            const lessonNum = i + 1;
            if(dayMap.has(lessonNum)) continue;
            let classKey = (row.classKey || lessonRow.classKey || '').toString().trim();
            if(!classKey && row.grade && row.section){
              classKey = `${row.grade} / ${row.section}${row.track ? ` ${row.track}` : ''}`;
            }
            if(!classKey) continue;
            dayMap.set(lessonNum, classKey);
          }
        });
      });

      cache.teacherWeek.set(cacheKey, map);
      return map;
    }

    async function waitForImageReady(imgEl){
      if (!imgEl) return;
      if (imgEl.complete && imgEl.naturalWidth > 0) return;
      await new Promise((resolve, reject) => {
        const onLoad = () => {
          cleanup();
          resolve();
        };
        const onError = () => {
          cleanup();
          reject(new Error('image_load_failed'));
        };
        const cleanup = () => {
          imgEl.removeEventListener('load', onLoad);
          imgEl.removeEventListener('error', onError);
        };
        imgEl.addEventListener('load', onLoad, { once: true });
        imgEl.addEventListener('error', onError, { once: true });
      });
    }

    async function getWeekMapForClass(classKey){
      if (cache.classWeek.has(classKey)) {
        return cache.classWeek.get(classKey);
      }

      const map = new Map();
      const { grade, section, track } = parseClassKey(classKey);
      for (const iso of weekDates) {
        map.set(iso, new Map());
      }

      const snap = await fetchWeekDocsForClass(grade, section, track);
      snap.forEach(d => {
        const x = d.data();
        const teacher = x.teacherName || x.teacherUid || '';
        const subj = x.subject || '—';
        // Standing schedule entries recur by weekday — resolve to *this* week's
        // actual date for the matching weekday, not the (possibly stale) date
        // the entry happens to have last been saved with.
        const iso = weekDates[Number(x.dayIndex)];
        if (iso === undefined) return;
        if (!map.has(iso)) map.set(iso, new Map());
        map.get(iso).set(Number(x.lesson), {
          subject: subj,
          teacherUid: x.teacherUid,
          teacherName: teacher,
          classKey: x.classKey || `${x.grade} / ${x.section}${x.track ? ' '+x.track : ''}`,
          date: iso,
          lesson: x.lesson
        });
      });

      try{
        const qOv = query(
          collection(db,'scheduleOverrides'),
          where('classKey','==', classKey),
          where('active','==', true),
          where('date','in', weekDates)
        );
        const ovSnap = await getDocs(qOv);
        const nameCache = new Map();
        for (const d of ovSnap.docs) {
          const x = d.data();
          const iso = x.date;
          if (!iso || !map.has(iso)) continue;

          let tName = nameCache.get(x.newTeacherUid);
          if (!tName) {
            tName = await getTeacherName(x.newTeacherUid);
            nameCache.set(x.newTeacherUid, tName);
          }

          map.get(iso).set(Number(x.lesson), {
            subject: 'بديل',
            teacherUid: x.newTeacherUid,
            teacherName: tName,
            classKey: x.classKey,
            date: iso,
            lesson: x.lesson,
            isOverride: true
          });
        }
      }catch(e){
        console.warn('Overrides for class view not loaded (index may be needed).', e);
      }

      cache.classWeek.set(classKey, map);
      return map;
    }

    function addCanvasToA4Page(docPdf, canvas, margin = 16){
      const pageW = docPdf.internal.pageSize.getWidth();
      const pageH = docPdf.internal.pageSize.getHeight();
      const ratio = Math.min(
        (pageW - margin * 2) / canvas.width,
        (pageH - margin * 2) / canvas.height
      );
      const drawW = canvas.width * ratio;
      const drawH = canvas.height * ratio;
      const x = (pageW - drawW) / 2;
      const y = margin;
      docPdf.addImage(canvas.toDataURL('image/jpeg', 0.9), 'JPEG', x, y, drawW, drawH, undefined, 'FAST');
    }

        toast({ title: 'خطأ', text: 'مكتبة إنشاء PDF غير متاحة حالياً.', icon: 'fa-exclamation-circle' });
        return;
      }

      setLoading(btnDownloadSelectedClassPdf, true);
      try{
        initWeek();
        const map = await getWeekMapForClass(classKey);
        const canvas = await renderClassScheduleCanvas(classKey, map);

        const { jsPDF } = window.jspdf;
        const docPdf = new jsPDF({
          orientation: 'portrait',
          unit: 'pt',
          format: 'a4',
          compress: true
        });
        addCanvasToA4Page(docPdf, canvas, 16);

        const from = formatDateArabicCompact(weekDates[0] || '');
        const to = formatDateArabicCompact(weekDates[weekDates.length - 1] || '');
        const className = filenameSafe(formatClassKeyLabel(classKey));
        docPdf.save(filenameSafe(`جدول-الفصل-${className}-من-${from}-إلى-${to}`) + '.pdf');
        toast({ title: 'تم', text: 'تم تنزيل جدول الفصل PDF.', icon: 'fa-check-circle' });
      } catch(e){
        console.error(e);
        toast({ title: 'خطأ', text: 'تعذّر تنزيل جدول الفصل.', icon: 'fa-exclamation-circle' });
      } finally {
        setLoading(btnDownloadSelectedClassPdf, false);
      }
    }

    async function downloadAllClassSchedulesPdf(){
      if (!window.html2canvas || !window.jspdf?.jsPDF) {
        toast({ title: 'خطأ', text: 'مكتبة إنشاء PDF غير متاحة حالياً.', icon: 'fa-exclamation-circle' });
        return;
      }
      if (!CLASS_OPTIONS.length) {
        toast({ title: 'تنبيه', text: 'لا توجد فصول للتنزيل.', icon: 'fa-info-circle' });
        return;
      }

      const labelEl = btnDownloadAllClassesPdf.querySelector('span');
      const originalLabel = labelEl ? labelEl.textContent : '';
      setLoading(btnDownloadAllClassesPdf, true);
      btnDownloadSelectedClassPdf.setAttribute('disabled', 'disabled');

      try{
        initWeek();
        const { jsPDF } = window.jspdf;
        const docPdf = new jsPDF({
          orientation: 'portrait',
          unit: 'pt',
          format: 'a4',
          compress: true
        });

        for (let idx = 0; idx < CLASS_OPTIONS.length; idx++) {
          const classKey = CLASS_OPTIONS[idx];
          if (labelEl) labelEl.textContent = `جاري التحضير ${idx + 1}/${CLASS_OPTIONS.length}`;

          const map = await getWeekMapForClass(classKey);
          const canvas = await renderClassScheduleCanvas(classKey, map);
          if (idx > 0) docPdf.addPage('a4', 'portrait');
          addCanvasToA4Page(docPdf, canvas, 16);
        }

        const from = formatDateArabicCompact(weekDates[0] || '');
        const to = formatDateArabicCompact(weekDates[weekDates.length - 1] || '');
        docPdf.save(filenameSafe(`جميع-جداول-الفصول-من-${from}-إلى-${to}`) + '.pdf');
        toast({ title: 'تم', text: 'تم تنزيل جميع جداول الفصول في ملف واحد.', icon: 'fa-check-circle' });
      } catch(e){
        console.error(e);
        toast({ title: 'خطأ', text: 'تعذّر تنزيل جميع الجداول.', icon: 'fa-exclamation-circle' });
      } finally {
        if (labelEl) labelEl.textContent = originalLabel;
        setLoading(btnDownloadAllClassesPdf, false);
        btnDownloadSelectedClassPdf.removeAttribute('disabled');
      }
    }

    async function loadWeekForClass(classKey){
      classWeekGrid.innerHTML = '';
      showStatus('جاري تحميل جدول الفصل المختار...', false);

      try{
        const map = await getWeekMapForClass(classKey);
        renderClassWeekGrid(map);
      }catch(e){
        console.error(e);
        showStatus('تعذّر تحميل جدول الفصل.', true);
        return;
      }

      clearStatus();
    }

    function renderClassWeekGrid(map){
      classWeekGrid.innerHTML = '';
      renderWeekHeaders(classWeekGrid);
      for(let r=0;r<5;r++){
        const iso = weekDates[r];

        const dayCell = document.createElement('div');
        dayCell.className='gcell day-col';
        dayCell.innerHTML = `<div style="font-weight:900">${DAYS_AR[r]}</div><div class="small">${iso}</div>`;
        classWeekGrid.appendChild(dayCell);

        for(let i=1;i<=FIXED_LESSON_COUNT;i++){
          const c = document.createElement('div');
          c.className='gcell';
          const row = map.get(iso);
          const cellData = row ? (row.get(i) || null) : null;
          
          if (cellData) {
            c.textContent = cellData.subject || '—';
            c.classList.add('lesson-highlight');
            c.classList.add('clickable');
            c.dataset.date = iso;
            c.dataset.lesson = i;
          } else {
            c.textContent = '—';
          }
          classWeekGrid.appendChild(c);
        }
      }

      classWeekGrid.querySelectorAll('.gcell.clickable').forEach(cell => {
        cell.addEventListener('click', async () => {
          const date = cell.dataset.date;
          const lesson = cell.dataset.lesson;
          const row = map.get(date);
          if (!row) return;
          const cellData = row.get(Number(lesson));
          if (!cellData) return;

          const teacherName = cellData.teacherName || await getTeacherName(cellData.teacherUid);
          const dayName = dayNameByISO(date);
          const timeLabel = lessonTimeLabel(Number(lesson));

          const body = `
            <div class="info-grid">
              <div class="info-box">
                <div class="info-k"><i class="fas fa-book"></i> المادة</div>
                <div class="info-v">${escapeHtml(cellData.subject)}</div>
              </div>
              <div class="info-box">
                <div class="info-k"><i class="fas fa-user"></i> اسم المعلم</div>
                <div class="info-v">${escapeHtml(teacherName)}</div>
              </div>
              <div class="info-box">
                <div class="info-k"><i class="fas fa-users"></i> الصف</div>
                <div class="info-v">${escapeHtml(cellData.classKey)}</div>
              </div>
              <div class="info-box">
                <div class="info-k"><i class="far fa-calendar"></i> اليوم + التاريخ</div>
                <div class="info-v">${escapeHtml(dayName)} | ${escapeHtml(date)}</div>
              </div>
              <div class="info-box">
                <div class="info-k"><i class="far fa-clock"></i> الحصة + وقتها</div>
                <div class="info-v">${escapeHtml(LESSONS_AR[lesson-1])} • ${escapeHtml(timeLabel)}</div>
              </div>
            </div>
          `;

          openModal({
            title: 'تفاصيل الحصة',
            bodyHtml: body,
            footerHtml: `<button class="filter-btn btn-ghost" onclick="closeModal()"><i class="fas fa-times"></i> إغلاق</button>`
          });
        });
      });
    }

    /* ========= Swap/Cover UX ========= */

    function lessonInfoBox(meta){
      const dayName = (meta.date === kuwaitTodayISO()) ? 'اليوم' : (dayNameByISO(meta.date) || meta.date);
      return `
        <div class="info-grid">
          <div class="info-box">
            <div class="info-k"><i class="far fa-calendar"></i> التاريخ</div>
            <div class="info-v">${escapeHtml(dayName)} | ${escapeHtml(meta.date)}</div>
          </div>
          <div class="info-box">
            <div class="info-k"><i class="far fa-clock"></i> الوقت</div>
            <div class="info-v">${escapeHtml(lessonTimeLabel(meta.lesson))}</div>
          </div>
          <div class="info-box">
            <div class="info-k"><i class="fas fa-hashtag"></i> الحصة</div>
            <div class="info-v">${escapeHtml(LESSONS_AR[meta.lesson-1])} (#${meta.lesson})</div>
          </div>
          <div class="info-box">
            <div class="info-k"><i class="fas fa-users"></i> الصف</div>
            <div class="info-v">${escapeHtml(meta.classKey || '—')}</div>
          </div>

    function slotSummaryLine(slot){
      if(!slot) return '—';
      const lesson = normalizeLessonNumber(slot.lesson) || 1;
      const dayName = dayNameByISO(slot.date) || slot.date || '—';
      const classKey = slot.classKey || '—';
      return `${dayName} | ${slot.date} | ${LESSONS_AR[lesson-1]} (#${lesson}) | ${classKey}`;
    }

    function openLessonActionsModal(slotOrLesson){
      let meta = null;
      if (typeof slotOrLesson === 'number') {
        meta = activeTodayMeta.get(String(slotOrLesson)) || null;
      } else if (slotOrLesson && typeof slotOrLesson === 'object') {
        const lesson = normalizeLessonNumber(slotOrLesson.lesson);
        meta = {
          date: safeText(slotOrLesson.date).trim(),
          lesson,
          classKey: safeText(slotOrLesson.classKey).trim() || '—',
          teacherUid: slotOrLesson.teacherUid || currentUser?.uid || '',
          teacherName: slotOrLesson.teacherName || '',
          subject: slotOrLesson.subject || ''
        };
      }

      if(!meta || !meta.date || !meta.lesson || meta._coveredAway){
        toast({ title: 'لا يمكن إنشاء طلب', text: 'هذه الحصة ليست متاحة للطلب.', icon: 'fa-circle-exclamation' });
        return;
      }

      const body = `
        ${lessonInfoBox(meta)}
        <div class="hint">
          <i class="fas fa-lightbulb" style="margin-top:2px"></i>
          <div>
            <div style="font-weight:900; margin-bottom:2px">اختيار أسهل</div>
            <div style="color:rgba(2,43,66,0.75)">
              يمكنك الآن اختيار تاريخ وحصة مختلفة داخل نفس الأسبوع أو أسابيع مستقبلية. التبديل يسمح بحصص في أيام وأوقات مختلفة، والتغطية لا تحتاج أن يكون لدى المعلم الآخر حصة.
            </div>
          </div>
        </div>
