      const footer = `
        <button id="actCover" class="filter-btn" type="button">
          <i class="fas fa-user-check"></i> طلب تغطية
        </button>
        <button id="actSwap" class="filter-btn btn-solid" type="button">
          <i class="fas fa-right-left"></i> طلب تبديل
        </button>
        <button id="actClose" class="filter-btn btn-ghost" type="button">
          <i class="fas fa-xmark"></i> إغلاق
        </button>
      `;

      openModal({ title: 'إدارة الحصة', bodyHtml: body, footerHtml: footer });

      document.getElementById('actClose').addEventListener('click', closeModal);
      document.getElementById('actCover').addEventListener('click', ()=> openRequestModal('cover', meta));
      document.getElementById('actSwap').addEventListener('click', ()=> openRequestModal('swap', meta));
    }

    function teacherSelectOptions(list, excludeUid){
      const filtered = (list || []).filter(t => t.uid !== excludeUid);
      const options = filtered.map(t => {
        const dep = resolveDepartmentName(t.normalizedDepartment || t.department || t.subject || '');
        const depSuffix = dep ? ` - ${escapeHtml(dep)}` : '';
        return `<option value="${escapeHtml(t.uid)}">${escapeHtml(t.name)}${depSuffix}</option>`;
      }).join('');
      return `<option value="">اختر المعلّم...</option>${options}`;
    }

    async function openRequestModal(type, meta){
      const isSwap = type === 'swap';
      const todayISO = kuwaitTodayISO();
      const myName = currentTeacherProfile?.name || currentTeacherProfile?.teacherName || currentTeacherProfile?.fullName || currentTeacherProfile?.displayName || '';
      const teachers = await loadTeachersList();

      const fromDepartment = resolveDepartmentName(
        currentTeacherProfile?.department || currentTeacherProfile?.subject || ''
      );
      let fromHead = null;
      if (fromDepartment) {
        fromHead = await findHeadOfDepartment(fromDepartment);
      }

      if (!fromHead) {
        toast({
          title: 'خطأ',
          text: 'لا يمكن العثور على رئيس القسم الخاص بك. تأكد من أن قسمك له رئيس معيّن.',
          icon: 'fa-triangle-exclamation',
          ms: 5000
        });
        return;
      }

      const defaultFromDate = safeText(meta?.date || todayISO).trim() || todayISO;
      const defaultFromLesson = normalizeLessonNumber(meta?.lesson);
      const defaultFromClassKey = safeText(meta?.classKey).trim() || '—';

      const departmentSet = new Set(FIXED_DEPARTMENTS.map(resolveDepartmentName).filter(Boolean));
      teachers.forEach(t => {
        const dep = resolveDepartmentName(t.normalizedDepartment || t.department || t.subject || '');
        if (dep) departmentSet.add(dep);
      });
      const departmentOptions = Array.from(departmentSet)
        .sort((a, b) => a.localeCompare(b, 'ar'))
        .map(dep => `<option value="${escapeHtml(dep)}">${escapeHtml(dep)}</option>`)
        .join('');

      let body = `
        ${lessonInfoBox({ ...meta, date: defaultFromDate, lesson: defaultFromLesson || 1, classKey: defaultFromClassKey })}
        <div class="split">
          <div class="info-box">
            <div class="info-k"><i class="fas fa-calendar-day"></i> 1) اختر تاريخ حصتك</div>
            <div class="input-wrap" style="margin-top:10px">
              <input id="reqFromDate" class="input" type="date" min="${todayISO}" value="${escapeHtml(defaultFromDate)}" />
            </div>
            <div class="muted" style="margin-top:8px">يمكنك اختيار اليوم الحالي أو أي يوم مستقبلي.</div>
          </div>
          <div class="info-box">
            <div class="info-k"><i class="far fa-clock"></i> 2) اختر حصتك</div>
            <div class="input-wrap" style="margin-top:10px">
              <select id="reqFromLesson" class="select">
                <option value="">اختر الحصة...</option>
              </select>
            </div>
            <div class="muted" style="margin-top:8px" id="reqFromPreview">—</div>
          </div>
        </div>
      `;

      if (isSwap) {
        body += `
          <div class="split">
            <div class="info-box">
              <div class="info-k"><i class="fas fa-building"></i> 3) اختر القسم</div>
              <div class="input-wrap" style="margin-top:10px">
                <select id="reqDepartment" class="select">
                  <option value="">اختر القسم...</option>
                  ${departmentOptions}
                </select>
              </div>
            </div>
            <div class="info-box">
              <div class="info-k"><i class="fas fa-user"></i> 4) اختر المعلّم</div>
              <div class="input-wrap" style="margin-top:10px">
                <select id="reqTeacherUid" class="select" disabled>
                  <option value="">اختر المعلّم...</option>
                </select>
              </div>
              <div class="muted" style="margin-top:8px" id="teacherSelectMessage">اختر القسم أولاً.</div>
            </div>
          </div>
          <div class="split">
            <div class="info-box">
              <div class="info-k"><i class="fas fa-calendar-week"></i> 5) تاريخ حصة المعلّم الآخر</div>
              <div class="input-wrap" style="margin-top:10px">
                <input id="reqToDate" class="input" type="date" min="${todayISO}" value="${escapeHtml(defaultFromDate)}" />
              </div>
            </div>
            <div class="info-box">
              <div class="info-k"><i class="far fa-clock"></i> 6) حصة المعلّم الآخر</div>
              <div class="input-wrap" style="margin-top:10px">
                <select id="reqToLesson" class="select" disabled>
                  <option value="">اختر الحصة...</option>
                </select>
              </div>
              <div class="muted" style="margin-top:8px" id="reqToPreview">اختر المعلّم أولاً.</div>
            </div>
          </div>
        `;
      } else {
        body += `
          <div class="info-box">
            <div class="info-k"><i class="fas fa-user"></i> 3) اختر المعلّم للتغطية</div>
            <div class="input-wrap" style="margin-top:10px">
              <select id="reqTeacherUid" class="select">
                ${teacherSelectOptions(teachers, currentUser.uid)}
              </select>
            </div>
            <div class="muted" style="margin-top:8px">يمكنك اختيار أي معلّم حتى لو لم يكن لديه حصة في هذا الوقت.</div>
          </div>
        `;
      }

      body += `
        <div class="info-box">
          <div class="info-k"><i class="fas fa-message"></i> ملاحظة (اختياري)</div>
          <div class="input-wrap" style="margin-top:10px">
            <input id="reqMessage" class="input" maxlength="160" placeholder="مثال: عندي ظرف، هل يناسبك التبديل؟" />
          </div>
        </div>
        <div id="reqStateHint" class="hint">
          <i class="fas fa-circle-info" style="margin-top:2px"></i>
          <div>حدد تفاصيل الحصص لإكمال الطلب.</div>
        </div>
      `;

      const actionTitle = isSwap ? 'طلب تبديل' : 'طلب تغطية';
      const footer = `
        <button id="sendReq" class="filter-btn btn-solid" type="button" disabled>
          <i class="fas fa-paper-plane"></i> إرسال الطلب
        </button>
        <button id="backToActions" class="filter-btn btn-ghost" type="button">
          <i class="fas fa-arrow-right"></i> رجوع
        </button>
      `;

      openModal({ title: actionTitle, bodyHtml: body, footerHtml: footer });
      document.getElementById('backToActions').addEventListener('click', ()=> openLessonActionsModal(meta));

      const sendBtn = document.getElementById('sendReq');
      const hintEl = document.getElementById('reqStateHint');
      const fromDateInput = document.getElementById('reqFromDate');
      const fromLessonSelect = document.getElementById('reqFromLesson');
      const fromPreview = document.getElementById('reqFromPreview');
      const teacherSelect = document.getElementById('reqTeacherUid');
      const reqMessage = document.getElementById('reqMessage');

      const departmentSelect = isSwap ? document.getElementById('reqDepartment') : null;
      const teacherMessage = isSwap ? document.getElementById('teacherSelectMessage') : null;
      const toDateInput = isSwap ? document.getElementById('reqToDate') : null;
      const toLessonSelect = isSwap ? document.getElementById('reqToLesson') : null;
      const toPreview = isSwap ? document.getElementById('reqToPreview') : null;

      const state = {
        fromSlots: [],
        toSlots: [],
        fromSlot: null,
        toSlot: null,
        toUid: '',
        toDepartment: ''
      };
      let fromLoadToken = 0;
      let toLoadToken = 0;

      function setHint(text, isError = false){
        if (!hintEl) return;
        hintEl.style.background = isError ? 'rgba(239, 68, 68, 0.12)' : 'rgba(2, 43, 66, 0.06)';
        hintEl.style.borderColor = isError ? 'rgba(239, 68, 68, 0.25)' : 'rgba(2, 43, 66, 0.10)';
        hintEl.style.color = isError ? '#991b1b' : 'var(--primary)';
        hintEl.innerHTML = `
          <i class="fas ${isError ? 'fa-triangle-exclamation' : 'fa-circle-info'}" style="margin-top:2px"></i>
          <div>${escapeHtml(text)}</div>
        `;
      }

      function fillSlotSelect(selectEl, slots, placeholder){
        if (!selectEl) return;
        const options = (slots || []).map(slot => `
          <option value="${slot.lesson}">
            ${escapeHtml(LESSONS_AR[slot.lesson-1])} (#${slot.lesson}) • ${escapeHtml(lessonTimeLabel(slot.lesson))} • ${escapeHtml(slot.classKey || '—')}
          </option>
        `).join('');
        selectEl.innerHTML = `<option value="">${escapeHtml(placeholder)}</option>${options}`;
      }

      function updateSlotPreview(el, slot, fallbackText){
        if (!el) return;
        if (!slot) {
          el.textContent = fallbackText;
          return;
        }
        el.textContent = slotSummaryLine(slot);
      }

      function validateDateInput(dateISO){
        if (!dateISO) return 'اختر التاريخ.';
        if (isPastISO(dateISO)) return 'لا يمكن اختيار تاريخ ماضٍ.';
        if (!isSchoolDayISO(dateISO)) return 'اختر يومًا دراسيًا من الأحد إلى الخميس.';
        return '';
      }

      function syncSendState(){
        const srcDateErr = validateDateInput(fromDateInput.value);
        if (srcDateErr) {
          sendBtn.disabled = true;
          setHint(`الحصة الأساسية: ${srcDateErr}`, true);
          return;
        }
        if (!state.fromSlot) {
          sendBtn.disabled = true;
          setHint('اختر حصتك الأساسية أولاً.', true);
          return;
        }
        if (!state.toUid) {
          sendBtn.disabled = true;
          setHint('اختر المعلّم المطلوب.', true);
          return;
        }
        if (state.toUid === currentUser.uid) {
          sendBtn.disabled = true;
          setHint('لا يمكنك إرسال طلب لنفسك.', true);
          return;
        }

        if (isSwap) {
          const toDateErr = validateDateInput(toDateInput.value);
          if (toDateErr) {
            sendBtn.disabled = true;
            setHint(`حصة المعلّم الآخر: ${toDateErr}`, true);
            return;
          }
          if (!state.toSlot) {
            sendBtn.disabled = true;
            setHint('اختر حصة المعلّم الآخر لإتمام التبديل.', true);
            return;
          }
          sendBtn.disabled = false;
          setHint(`سيتم التبديل بين: ${slotSummaryLine(state.fromSlot)} ⇄ ${slotSummaryLine(state.toSlot)}`, false);
          return;
        }

        sendBtn.disabled = false;
        setHint(`سيتم إرسال طلب تغطية للحصة: ${slotSummaryLine(state.fromSlot)}`, false);
      }

      async function refreshFromSlots(preferredLesson = null){
        const token = ++fromLoadToken;
        const dateISO = safeText(fromDateInput.value).trim();
        state.fromSlots = [];
        state.fromSlot = null;
        fillSlotSelect(fromLessonSelect, [], 'اختر الحصة...');
        updateSlotPreview(fromPreview, null, 'اختر التاريخ ثم الحصة.');

        const dateErr = validateDateInput(dateISO);
        if (dateErr) {
          syncSendState();
          return;
        }

        const slots = await getTeacherSlotsForDate(currentUser.uid, dateISO);
        if (token !== fromLoadToken) return;
        state.fromSlots = slots;
        fillSlotSelect(fromLessonSelect, slots, slots.length ? 'اختر الحصة...' : 'لا توجد حصص في هذا التاريخ');

        const selected = normalizeLessonNumber(preferredLesson || fromLessonSelect.value);
        if (selected && slots.some(s => s.lesson === selected)) {
          fromLessonSelect.value = String(selected);
        } else if (defaultFromLesson && slots.some(s => s.lesson === defaultFromLesson)) {
          fromLessonSelect.value = String(defaultFromLesson);
        } else if (slots.length === 1) {
          fromLessonSelect.value = String(slots[0].lesson);
        }

        const chosenLesson = normalizeLessonNumber(fromLessonSelect.value);
        state.fromSlot = chosenLesson ? (slots.find(s => s.lesson === chosenLesson) || null) : null;
        updateSlotPreview(fromPreview, state.fromSlot, slots.length ? 'اختر الحصة.' : 'لا توجد حصص لك في هذا التاريخ.');
        syncSendState();
      }

      async function refreshTargetSlots(preferredLesson = null){
        if (!isSwap) return;
        const token = ++toLoadToken;
        state.toSlots = [];
        state.toSlot = null;
        fillSlotSelect(toLessonSelect, [], 'اختر الحصة...');
        updateSlotPreview(toPreview, null, 'اختر المعلّم والتاريخ.');
        toLessonSelect.disabled = true;

        const toUid = safeText(teacherSelect.value).trim();
        state.toUid = toUid;
        const dateISO = safeText(toDateInput.value).trim();

        const dateErr = validateDateInput(dateISO);
        if (!toUid || dateErr) {
          syncSendState();
          return;
        }

        const slots = await getTeacherSlotsForDate(toUid, dateISO);
        if (token !== toLoadToken) return;
        state.toSlots = slots;
        fillSlotSelect(toLessonSelect, slots, slots.length ? 'اختر الحصة...' : 'لا توجد حصص للمعلم في هذا التاريخ');
        toLessonSelect.disabled = !slots.length;

        const selected = normalizeLessonNumber(preferredLesson || toLessonSelect.value);
        if (selected && slots.some(s => s.lesson === selected)) {
          toLessonSelect.value = String(selected);
        } else if (slots.length === 1) {
          toLessonSelect.value = String(slots[0].lesson);
        }

        const chosenLesson = normalizeLessonNumber(toLessonSelect.value);
        state.toSlot = chosenLesson ? (slots.find(s => s.lesson === chosenLesson) || null) : null;
        updateSlotPreview(toPreview, state.toSlot, slots.length ? 'اختر حصة المعلم.' : 'لا توجد حصص في هذا التاريخ.');
        syncSendState();
      }

      if (isSwap) {
        departmentSelect.addEventListener('change', async () => {
          const selectedDepartment = resolveDepartmentName(departmentSelect.value);
          state.toDepartment = selectedDepartment;
          teacherSelect.innerHTML = '<option value="">اختر المعلّم...</option>';
          teacherSelect.disabled = true;
          teacherMessage.textContent = selectedDepartment ? 'جاري تحميل المعلمين...' : 'اختر القسم أولاً.';
          state.toUid = '';
          await refreshTargetSlots();

          if (!selectedDepartment) {
            syncSendState();
            return;
          }

          const departmentTeachers = await getTeachersByDepartment(selectedDepartment);
          if (!departmentTeachers.length) {
            teacherMessage.textContent = 'لا يوجد معلمون في هذا القسم.';
            syncSendState();
            return;
          }

          teacherSelect.disabled = false;
          teacherMessage.textContent = 'اختر المعلّم.';
          departmentTeachers.forEach(teacher => {
            const opt = document.createElement('option');
            opt.value = teacher.uid;
            opt.textContent = teacher.name;
            teacherSelect.appendChild(opt);
          });
          syncSendState();
        });

        teacherSelect.addEventListener('change', async () => {
          const selectedTeacher = teachers.find(t => t.uid === teacherSelect.value);
          if (selectedTeacher && !state.toDepartment) {
            state.toDepartment = resolveDepartmentName(
              selectedTeacher.normalizedDepartment || selectedTeacher.department || selectedTeacher.subject || ''
            );
          }
          await refreshTargetSlots();
        });
        toDateInput.addEventListener('change', async () => {
          await refreshTargetSlots();
        });
        toLessonSelect.addEventListener('change', () => {
          const chosenLesson = normalizeLessonNumber(toLessonSelect.value);
          state.toSlot = chosenLesson ? (state.toSlots.find(s => s.lesson === chosenLesson) || null) : null;
          updateSlotPreview(toPreview, state.toSlot, state.toSlots.length ? 'اختر حصة المعلم.' : 'لا توجد حصص في هذا التاريخ.');
          syncSendState();
        });
      } else {
        teacherSelect.addEventListener('change', () => {
          state.toUid = safeText(teacherSelect.value).trim();
          syncSendState();
        });
      }

      fromDateInput.addEventListener('change', async () => {
        await refreshFromSlots();
      });
      fromLessonSelect.addEventListener('change', () => {
        const chosenLesson = normalizeLessonNumber(fromLessonSelect.value);
        state.fromSlot = chosenLesson ? (state.fromSlots.find(s => s.lesson === chosenLesson) || null) : null;
        updateSlotPreview(fromPreview, state.fromSlot, state.fromSlots.length ? 'اختر الحصة.' : 'لا توجد حصص لك في هذا التاريخ.');
        syncSendState();
      });

      await refreshFromSlots(defaultFromLesson);
      if (!isSwap) {
        state.toUid = safeText(teacherSelect.value).trim();
        syncSendState();
      }

      sendBtn.addEventListener('click', async ()=>{
        const toUid = safeText(teacherSelect.value).trim();
        if (!toUid) {
          toast({ title: 'ناقص', text: 'اختر المعلّم أولاً.', icon: 'fa-circle-exclamation' });
          return;
        }
        if (toUid === currentUser.uid) {
          toast({ title: 'غير صالح', text: 'لا يمكنك إرسال طلب لنفسك.', icon: 'fa-circle-exclamation' });
          return;
        }

        const sourceDate = safeText(fromDateInput.value).trim();
        const sourceLesson = normalizeLessonNumber(fromLessonSelect.value);
        const sourceSlot = await getTeacherSlotForDateLesson(currentUser.uid, sourceDate, sourceLesson);
        if (!sourceSlot) {
          toast({ title: 'تعذّر إكمال الطلب', text: 'تعذّر العثور على حصتك في التاريخ/الحصة المحددة.', icon: 'fa-circle-exclamation' });
          return;
        }

        const targetTeacher = teachers.find(t => t.uid === toUid) || null;
        const toName = targetTeacher?.name || (await getTeacherName(toUid));
        let toDepartment = isSwap
          ? resolveDepartmentName(state.toDepartment || departmentSelect?.value || '')
          : resolveDepartmentName(targetTeacher?.normalizedDepartment || targetTeacher?.department || targetTeacher?.subject || '');

        if (!toDepartment) {
          toDepartment = resolveDepartmentName(targetTeacher?.subject || '');
        }
        if (!toDepartment) {
          toast({
            title: 'خطأ',
            text: 'قسم المعلم المطلوب غير محدد. يرجى تحديث بيانات المعلم أولاً.',
            icon: 'fa-triangle-exclamation'
          });
          return;
        }

        let targetSlot = null;
        if (isSwap) {
          const targetDate = safeText(toDateInput.value).trim();
          const targetLesson = normalizeLessonNumber(toLessonSelect.value);
          targetSlot = await getTeacherSlotForDateLesson(toUid, targetDate, targetLesson);
          if (!targetSlot) {
            toast({
              title: 'تعذّر إتمام التبديل',
              text: 'المعلم المطلوب لا يملك حصة في التاريخ/الحصة المحددة.',
              icon: 'fa-circle-exclamation'
            });
            return;
          }
        }

        let toHead = null;
        if (toDepartment === fromDepartment) {
          toHead = fromHead;
        } else {
          toHead = await findHeadOfDepartment(toDepartment);
          if (!toHead) {
            toast({
              title: 'خطأ',
              text: 'لا يمكن العثور على رئيس قسم المعلّم المطلوب. تأكد من أن قسمه له رئيس معيّن.',
              icon: 'fa-triangle-exclamation',
              ms: 5000
            });
            return;
          }
        }

        try{
          const qDup = query(
            collection(db,'swapRequests'),
            where('fromTeacherUid','==', currentUser.uid),
            where('date','==', sourceSlot.date),
            where('lesson','==', sourceSlot.lesson),
            where('status','in', ['pending_head_from', 'pending_head_to', 'pending_head']),
            limit(1)
          );
          const dup = await getDocs(qDup);
          if(!dup.empty){
            toast({ title: 'موجود مسبقاً', text: 'يوجد طلب معلّق لهذه الحصة بالفعل.', icon: 'fa-clock' });
            closeModal();
            return;
          }
        }catch(e){
          console.warn('dup check skipped', e);
        }

        sendBtn.setAttribute('disabled','disabled');
        sendBtn.classList.add('loading');

        try{
          const msg = safeText(reqMessage.value).trim();
          const fromName = myName || (await getTeacherName(currentUser.uid));

          await addDoc(collection(db,'swapRequests'), {
            date: sourceSlot.date,
            lesson: sourceSlot.lesson,
            fromDate: sourceSlot.date,
            fromLesson: sourceSlot.lesson,
            fromClassKey: sourceSlot.classKey,
            toDate: isSwap ? targetSlot.date : null,
            toLesson: isSwap ? targetSlot.lesson : null,
            toClassKey: isSwap ? targetSlot.classKey : null,
            type,
            requestVersion: 2,

            fromTeacherUid: currentUser.uid,
            fromTeacherName: fromName,
            fromDepartment,
            fromSubject: currentTeacherProfile?.subject || '',

            toTeacherUid: toUid,
            toTeacherName: toName,
            toDepartment,
            toSubject: targetTeacher?.subject || '',

            fromHeadUid: fromHead.uid,
            fromHeadName: fromHead.name,
            toHeadUid: toHead.uid,
            toHeadName: toHead.name,

            status: 'pending_head_from',
            stage: 'head_from',

            message: msg || null,
            createdAt: serverTimestamp(),

            headUid: fromHead.uid,
            headName: fromHead.name,
            headStatus: 'pending',
            headRespondedAt: null,
            headNote: null,
            respondedAt: null
          });

          toast({ title: 'تم', text: 'تم إرسال الطلب.', icon: 'fa-check-circle' });
          closeModal();
        }catch(e){
          console.error(e);
          toast({ title: 'خطأ', text: 'فشل إرسال الطلب.', icon: 'fa-exclamation-circle' });
        }finally{
          sendBtn.classList.remove('loading');
          syncSendState();
        }
      });
    }

    /* ========= Incoming requests listener ========= */
    function buildIncomingRequestText(req){
      const fromName = req.fromTeacherName || 'معلّم';
      const typeLabel = (req.type === 'cover') ? 'تغطية' : 'تبديل';
      const fromLesson = Number(req.fromLesson || req.lesson) || 1;
      const fromDate = req.fromDate || req.date || kuwaitTodayISO();
      const lessonLabel = LESSONS_AR[fromLesson - 1] || `حصة #${fromLesson}`;
      const timeLabel = lessonTimeLabel(fromLesson);
      const cls = req.fromClassKey || '—';
      const toDate = req.toDate || null;
      const toLesson = Number(req.toLesson) || 0;
      const targetLine = (req.type === 'swap' && toDate && toLesson)
        ? ` • مقابل: ${toDate} • ${LESSONS_AR[toLesson - 1] || `حصة #${toLesson}`}`
        : '';
      return {
        title: `طلب ${typeLabel} جديد`,
        body: `
          <div class="hint" style="background:rgba(245, 158, 11, 0.12); border-color:rgba(245, 158, 11, 0.25); color:#7c2d12;">
            <i class="fas fa-bell" style="margin-top:2px"></i>
            <div>
              <div style="font-weight:900; margin-bottom:4px">${escapeHtml(fromName)} يطلب ${typeLabel}</div>
              <div style="color:rgba(124,45,18,0.85)">
                ${escapeHtml(fromDate)} • ${escapeHtml(lessonLabel)} • ${escapeHtml(timeLabel)} • ${escapeHtml(cls)}${escapeHtml(targetLine)}
              </div>
            </div>
          </div>
        `
      };
    }

    async function openIncomingRequestModal(requestDocId, reqData){
      const req = reqData || {};
      
      if (req.status !== 'pending_teacher_to') {
        toast({
          title: 'طلب غير صالح',
          text: 'هذا الطلب ليس في مرحلة الانتظار منك.',
          icon: 'fa-circle-exclamation'
        });
        return;
      }

      const fromName = req.fromTeacherName || await getTeacherName(req.fromTeacherUid);
      const typeLabel = (req.type === 'cover') ? 'تغطية' : 'تبديل';
      const sourceDate = req.fromDate || req.date || kuwaitTodayISO();
      const sourceLesson = Number(req.fromLesson || req.lesson) || 1;
      const targetDate = req.toDate || sourceDate;
      const targetLesson = Number(req.toLesson) || 0;

      let myLessonsHtml = '';
      if(req.type === 'swap' && !targetLesson){
        const myMap = await buildTodayMapWithOverrides(currentUser.uid, targetDate);
        const items = [];
        for(let i=1;i<=FIXED_LESSON_COUNT;i++){
          const hit = myMap.get(String(i));
          if(hit && !hit._coveredAway){
            const classKey = hit.classKey || `${hit.grade||''} / ${hit.section||''}${hit.track? ' '+hit.track : ''}` || '—';
            items.push({ lesson: i, classKey });
          }
        }
        const opts = items.length
          ? items.map(x=> `<option value="${x.lesson}">${escapeHtml(LESSONS_AR[x.lesson-1])} (#${x.lesson}) • ${escapeHtml(lessonTimeLabel(x.lesson))} • ${escapeHtml(x.classKey)}</option>`).join('')
          : `<option value="">لا توجد حصص متاحة في التاريخ المحدد</option>`;

        myLessonsHtml = `
          <div class="info-box">
            <div class="info-k"><i class="fas fa-right-left"></i> اختر حصتك للتبديل</div>
            <div class="input-wrap" style="margin-top:10px">
              <select id="swapMyLesson" class="select">
                <option value="">اختر الحصة...</option>
                ${opts}
              </select>
            </div>
            <div class="muted" style="margin-top:8px">
              اختر الحصة التي ستعطيها للمعلّم الآخر في تاريخ ${escapeHtml(targetDate)}.
            </div>
          </div>
        `;
      }

      const body = `
        ${buildIncomingRequestText({ ...req, fromTeacherName: fromName }).body}
        <div class="info-grid">
          <div class="info-box">
            <div class="info-k"><i class="far fa-calendar"></i> التاريخ</div>
            <div class="info-v">${escapeHtml(sourceDate)}</div>
          </div>
          <div class="info-box">
            <div class="info-k"><i class="far fa-clock"></i> الوقت</div>
            <div class="info-v">${escapeHtml(lessonTimeLabel(sourceLesson))}</div>
          </div>
          <div class="info-box">
            <div class="info-k"><i class="fas fa-users"></i> الصف</div>
            <div class="info-v">${escapeHtml(req.fromClassKey || '—')}</div>
          </div>
          <div class="info-box">
            <div class="info-k"><i class="fas fa-message"></i> الملاحظة</div>
            <div class="info-v">${escapeHtml(req.message || '—')}</div>
          </div>
          ${req.type === 'swap' ? `
          <div class="info-box">
            <div class="info-k"><i class="fas fa-calendar-week"></i> تاريخ الحصة المقابلة</div>
            <div class="info-v">${escapeHtml(targetDate)}</div>
          </div>
          <div class="info-box">
            <div class="info-k"><i class="fas fa-arrows-left-right"></i> الحصة المقابلة</div>
            <div class="info-v">${escapeHtml(targetLesson ? `${LESSONS_AR[targetLesson - 1] || `حصة #${targetLesson}`} • ${lessonTimeLabel(targetLesson)}` : 'سيتم اختيارها عند القبول')}</div>
          </div>
          ` : ''}
        </div>
        ${myLessonsHtml}
        <div class="hint">
          <i class="fas fa-circle-info" style="margin-top:2px"></i>
          <div>
            <div style="font-weight:900; margin-bottom:2px">تنبيه</div>
            <div style="color:rgba(2,43,66,0.75)">
              عند القبول سيتم إنشاء تعديل (Override) حسب التاريخ والحصة المحددين في الطلب.
            </div>
          </div>
        </div>
      `;

      const footer = `
        <button id="reqAccept" class="filter-btn btn-solid" type="button">
          <i class="fas fa-check"></i> قبول
        </button>
        <button id="reqDeny" class="filter-btn btn-danger" type="button">
          <i class="fas fa-xmark"></i> رفض
        </button>
        <button id="reqClose" class="filter-btn btn-ghost" type="button">
          <i class="fas fa-arrow-right"></i> إغلاق
        </button>
      `;

      openModal({
        title: `طلب ${typeLabel}`,
        bodyHtml: body,
        footerHtml: footer
      });

      document.getElementById('reqClose').addEventListener('click', closeModal);

      document.getElementById('reqDeny').addEventListener('click', async () => {
        try {
          await updateDoc(doc(db, 'swapRequests', requestDocId), {
            status: 'denied',
            respondedAt: serverTimestamp()
          });
          toast({
            title: 'تم الرفض',
            text: 'تم رفض الطلب.',
            icon: 'fa-circle-xmark'
          });
          closeModal();
        } catch (e) {
          console.error(e);
          toast({
            title: 'خطأ',
            text: 'تعذّر رفض الطلب.',
            icon: 'fa-triangle-exclamation'
          });
        }
      });

      document.getElementById('reqAccept').addEventListener('click', async () => {
        const btn = document.getElementById('reqAccept');
        btn.setAttribute('disabled','disabled');
        btn.classList.add('loading');

        try {
          await runTransaction(db, async (tx) => {
            const reqRef = doc(db, 'swapRequests', requestDocId);
            const snap = await tx.get(reqRef);
            if (!snap.exists()) throw new Error('missing');

            const data = snap.data();
            if (data.status !== 'pending_teacher_to') throw new Error('already_done');
            if (data.toTeacherUid !== currentUser.uid) throw new Error('forbidden');

            const fromDateISO = data.fromDate || data.date;
            const fromLesson = Number(data.fromLesson || data.lesson);

            if (data.type === 'cover') {
              const overrideId = `${fromDateISO}_${fromLesson}_${data.fromTeacherUid}`;
              tx.set(doc(db, 'scheduleOverrides', overrideId), {
                date: fromDateISO,
                lesson: fromLesson,
                classKey: data.fromClassKey,
                originalTeacherUid: data.fromTeacherUid,
                newTeacherUid: data.toTeacherUid,
                swapRequestId: requestDocId,
                createdAt: serverTimestamp(),
                active: true
              }, { merge: true });
            }

            if (data.type === 'swap') {
              const toDateISO = data.toDate || fromDateISO;
              let toLesson = Number(data.toLesson) || 0;
              if (!toLesson) {
                toLesson = Number(document.getElementById('swapMyLesson')?.value);
              }
              if (!toLesson) throw new Error('missing_my_lesson');

              const overrideA = `${fromDateISO}_${fromLesson}_${data.fromTeacherUid}`;
              const overrideB = `${toDateISO}_${toLesson}_${data.toTeacherUid}`;

              tx.set(doc(db, 'scheduleOverrides', overrideA), {
                date: fromDateISO,
                lesson: fromLesson,
                classKey: data.fromClassKey,
                originalTeacherUid: data.fromTeacherUid,
                newTeacherUid: data.toTeacherUid,
                swapRequestId: requestDocId,
                createdAt: serverTimestamp(),
                active: true
              }, { merge: true });

              tx.set(doc(db, 'scheduleOverrides', overrideB), {
                date: toDateISO,
                lesson: toLesson,
                classKey: data.toClassKey || '—',
                originalTeacherUid: data.toTeacherUid,
                newTeacherUid: data.fromTeacherUid,
                swapRequestId: requestDocId,
                createdAt: serverTimestamp(),
                active: true
              }, { merge: true });
            }

            tx.update(reqRef, {
              status: 'accepted',
              respondedAt: serverTimestamp()
            });
          });

          toast({
            title: 'تم القبول',
            text: 'تم تطبيق التعديل بنجاح.',
            icon: 'fa-circle-check'
          });

          closeModal();
          await loadTodayForTeacher(currentUser.uid);

        } catch (e) {
          console.error(e);
          const errMsg = e.message === 'missing_my_lesson' 
            ? 'يجب اختيار حصة للتبديل.'
            : 'تعذّر قبول الطلب.';
          toast({
            title: 'خطأ',
            text: errMsg,
            icon: 'fa-triangle-exclamation'
          });
        } finally {
          btn.classList.remove('loading');
          btn.removeAttribute('disabled');
        }
      });
    }

    function startPendingRequestsListener(){
      if(unsubPendingRequests) { unsubPendingRequests(); unsubPendingRequests = null; }
      if(!currentUser?.uid) return;

      const qPending = query(
        collection(db,'swapRequests'),
        where('toTeacherUid','==', currentUser.uid),
        where('status','==', 'pending_teacher_to'),
        orderBy('createdAt','desc'),
        limit(10)
      );

      unsubPendingRequests = onSnapshot(qPending, (snap)=>{
        snap.docChanges().forEach((ch)=>{
          if(ch.type !== 'added') return;

          const id = ch.doc.id;
          const data = ch.doc.data();

          openIncomingRequestModal(id, data);
        });
      }, (err)=>{
        console.error(err);
      });
    }

    /* ========= Current Lesson Highlight Update ========= */
    function updateCurrentLessonHighlight() {
      const todayISO = kuwaitTodayISO();
      
      if (currentView === 'today' && activeTodayISO === todayISO) {
        const activeLesson = getActiveLessonIndex();
        
        containerMain.querySelectorAll('.cell.current-lesson').forEach(el => el.classList.remove('current-lesson'));
        containerMain.querySelectorAll('.compact-cell.current-lesson').forEach(el => el.classList.remove('current-lesson'));
        
        if (activeLesson !== null) {
          const mainLessonCell = containerMain.querySelector(`.table .cell[data-row-role="lesson"][data-lesson-index="${activeLesson}"]`);
          const mainClassCell = containerMain.querySelector(`.table .cell[data-row-role="class"][data-lesson-index="${activeLesson}"]`);
          if (mainLessonCell) mainLessonCell.classList.add('current-lesson');
          if (mainClassCell) mainClassCell.classList.add('current-lesson');

          const compactLessonCell = containerMain.querySelector(`.compact-table .compact-cell[data-row-role="lesson"][data-lesson-index="${activeLesson}"]`);
          const compactClassCell = containerMain.querySelector(`.compact-table .compact-cell[data-row-role="class"][data-lesson-index="${activeLesson}"]`);
          if (compactLessonCell) compactLessonCell.classList.add('current-lesson');
          if (compactClassCell) compactClassCell.classList.add('current-lesson');
        }
      }
    }

    /* ========= Init week ========= */
    function initWeek(){
      const today = kuwaitTodayISO();
      const start = startOfWeekSunday(today);
      weekDates = [0,1,2,3,4].map(n => addDaysISO(start, n));
      cache.weekKey = start;
    }

    function initClassPicker(){
      CLASS_OPTIONS.forEach((c)=>{
        const opt = document.createElement('option');
        opt.value = c;
        opt.textContent = c;
        classPicker.appendChild(opt);
      });
      btnDownloadSelectedClassPdf.hidden = true;
    }

    function updateSelectedClassDownloadButton(){
      btnDownloadSelectedClassPdf.hidden = !classPicker.value;
    }

    /* ========= More sheet ========= */
    function openMore(){
      moreSheet.classList.add('open');
      moreSheet.setAttribute('aria-hidden','false');
      document.body.style.overflow = 'hidden';
    }
    function closeMoreSheet(){
      moreSheet.classList.remove('open');
      moreSheet.setAttribute('aria-hidden','true');
      document.body.style.overflow = '';
    }

    btnMore.addEventListener('click', openMore);
    closeMore.addEventListener('click', closeMoreSheet);
    btnBackMain.addEventListener('click', () => {
      location.href = '/teachers/user';
    });
    btnDownloadPdf.addEventListener('click', downloadWeeklySchedulePdf);
    btnDownloadAllClassesPdf.addEventListener('click', downloadAllClassSchedulesPdf);
    btnDownloadSelectedClassPdf.addEventListener('click', downloadSelectedClassSchedulePdf);

    classPicker.addEventListener('change', async ()=>{
      const v = classPicker.value;
      updateSelectedClassDownloadButton();
      if(!v){
        classWeekGrid.innerHTML = '';
        return;
      }
      await loadWeekForClass(v);
    });

    /* ========= Auth ========= */
    setPersistence(auth, browserLocalPersistence).catch(()=>{});

    onAuthStateChanged(auth, async (user)=>{
      if(!user){
        currentUser = null;
        showStatus('الرجاء تسجيل الدخول أولاً.', true);
        return;
      }

      currentUser = user;

      setupLessonTimesListener();
      startCurrentLessonTimer();
      initWeek();
      initClassPicker();
      setFilterActive(btnToday);

      const profilePromise = getDoc(doc(db,'teachers', user.uid))
        .then(snap=>{
          if(snap.exists()){
            currentTeacherProfile = snap.data();
            currentRole = (currentTeacherProfile.role || '').toString().toLowerCase();
          }
        })
        .catch(e=> console.error(e));

      await Promise.all([
        profilePromise,
        loadTodayForTeacher(user.uid)
      ]);

      startPendingRequestsListener();
    });

    /* ========= Tabs ========= */
    btnToday.addEventListener('click', async ()=>{
      if(!currentUser?.uid) return;
      setFilterActive(btnToday);
      await loadTodayForTeacher(currentUser.uid);
    });

    btnWeek.addEventListener('click', async ()=>{
      if(!currentUser?.uid) return;
      setFilterActive(btnWeek);
      await loadWeekForTeacher(currentUser.uid);
