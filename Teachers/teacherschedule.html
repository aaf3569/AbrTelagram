    async function loadRequests(){
      requestsContainer.innerHTML = '<div style="text-align:center; padding:20px; color:var(--muted);">جاري التحميل...</div>';

      if(unsubRequestsFrom) unsubRequestsFrom();
      if(unsubRequestsTo) unsubRequestsTo();

      const qFrom = query(
        collection(db,'swapRequests'),
        where('fromHeadUid','==', headUid),
        orderBy('createdAt','desc')
      );

      const qTo = query(
        collection(db,'swapRequests'),
        where('toHeadUid','==', headUid),
        orderBy('createdAt','desc')
      );

      let requestsMap = new Map();

      function renderAllRequests() {
        requestsContainer.innerHTML = '';

        if(requestsMap.size === 0){
          requestsContainer.innerHTML = '<div style="text-align:center; padding:40px; color:var(--muted); font-weight:700;">لا توجد طلبات حالياً.</div>';
          return;
        }

        const allRequests = Array.from(requestsMap.values()).sort((a, b) => {
          const aTime = a.request.createdAt?.toMillis() || 0;
          const bTime = b.request.createdAt?.toMillis() || 0;
          return bTime - aTime;
        });

        allRequests.forEach(({id, request}) => {
          const card = renderRequestCard(id, request);
          requestsContainer.appendChild(card);
        });

        requestsContainer.querySelectorAll('.btn-approve').forEach(btn => {
          btn.addEventListener('click', () => handleRequestApprove(btn.dataset.id));
        });
        requestsContainer.querySelectorAll('.btn-deny').forEach(btn => {
          btn.addEventListener('click', () => handleRequestDeny(btn.dataset.id));
        });
      }

      unsubRequestsFrom = onSnapshot(qFrom, (snap) => {
        snap.docChanges().forEach(change => {
          const id = change.doc.id;
          const request = change.doc.data();
          if(change.type === 'added' || change.type === 'modified') {
            requestsMap.set(id, { id, request });
          } else if(change.type === 'removed') {
            requestsMap.delete(id);
          }
        });
        renderAllRequests();
      }, (error) => {
        console.error('Error loading fromHeadUid requests:', error);
        toast({ title: 'خطأ', text: 'حدث خطأ في تحميل بعض الطلبات.', icon: 'fa-triangle-exclamation' });
      });

      unsubRequestsTo = onSnapshot(qTo, (snap) => {
        snap.docChanges().forEach(change => {
          const id = change.doc.id;
          const request = change.doc.data();
          if(change.type === 'added' || change.type === 'modified') {
            requestsMap.set(id, { id, request });
          } else if(change.type === 'removed') {
            requestsMap.delete(id);
          }
        });
        renderAllRequests();
      }, (error) => {
        console.error('Error loading toHeadUid requests:', error);
        toast({ title: 'خطأ', text: 'حدث خطأ في تحميل بعض الطلبات.', icon: 'fa-triangle-exclamation' });
      });

      try {
        const [fromSnap, toSnap] = await Promise.all([getDocs(qFrom), getDocs(qTo)]);
        requestsMap.clear();
        fromSnap.forEach(docSnap => { requestsMap.set(docSnap.id, { id: docSnap.id, request: docSnap.data() }); });
        toSnap.forEach(docSnap => { requestsMap.set(docSnap.id, { id: docSnap.id, request: docSnap.data() }); });
        renderAllRequests();
      } catch (error) {
        console.error('Error loading initial requests:', error);
        requestsContainer.innerHTML = '<div style="text-align:center; padding:20px; color:var(--danger); font-weight:700;">حدث خطأ في تحميل الطلبات.</div>';
      }
    }

    async function handleRequestApprove(requestId){
      try {
        await runTransaction(db, async (tx) => {
          const requestRef = doc(db, 'swapRequests', requestId);
          const requestSnap = await tx.get(requestRef);

          if(!requestSnap.exists()) {
            throw new Error('الطلب غير موجود');
          }

          const request = requestSnap.data();

          if(request.status === 'pending_head_from' && request.fromHeadUid === headUid) {
            if(request.fromDepartment === request.toDepartment || request.toHeadUid === request.fromHeadUid) {
              tx.update(requestRef, { status: 'accepted', respondedAt: serverTimestamp() });
              await createOverridesInTransaction(tx, request, requestId);
            } else {
              tx.update(requestRef, { status: 'pending_head_to', respondedAt: serverTimestamp() });
            }
          } else if(request.status === 'pending_head_to' && request.toHeadUid === headUid) {
            tx.update(requestRef, { status: 'accepted', respondedAt: serverTimestamp() });
            await createOverridesInTransaction(tx, request, requestId);
          } else {
            throw new Error('غير مصرح لك بالموافقة على هذا الطلب في هذه المرحلة');
          }
        });

        toast({ title: 'تم القبول', text: 'تمت الموافقة على الطلب بنجاح.', icon: 'fa-circle-check' });

        if(currentView === 'today' && activeTodayISO === kuwaitTodayISO()){
          loadTodayForTeacher(currentUser.uid);
        } else if (currentView === 'week') {
          loadWeekForTeacher(currentUser.uid);
        }
      } catch (error) {
        console.error('Error approving request:', error);
        toast({ title: 'خطأ', text: error.message || 'تعذّر تنفيذ العملية.', icon: 'fa-triangle-exclamation' });
      }
    }

    async function handleRequestDeny(requestId){
      try {
        const requestRef = doc(db, 'swapRequests', requestId);
        const requestSnap = await getDoc(requestRef);

        if(!requestSnap.exists()) return;

        const request = requestSnap.data();

        if((request.status === 'pending_head_from' && request.fromHeadUid === headUid) ||
           (request.status === 'pending_head_to' && request.toHeadUid === headUid)) {
          await updateDoc(requestRef, { status: 'denied', respondedAt: serverTimestamp() });
          toast({ title: 'تم الرفض', text: 'تم رفض الطلب.', icon: 'fa-circle-xmark' });
        } else {
          toast({ title: 'غير مصرح', text: 'غير مصرح لك برفض هذا الطلب.', icon: 'fa-circle-exclamation' });
        }
      } catch (error) {
        console.error('Error denying request:', error);
        toast({ title: 'خطأ', text: 'تعذّر تنفيذ العملية.', icon: 'fa-triangle-exclamation' });
      }
    }

    async function createOverridesInTransaction(tx, request, requestId){
      const fromDate = request.fromDate || request.date;
      const fromLesson = Number(request.fromLesson || request.lesson);

      if(request.type === 'cover') {
        const overrideId = `cover_${fromDate}_${fromLesson}_${request.fromTeacherUid}_${request.toTeacherUid}`;
        const overrideRef = doc(db, 'scheduleOverrides', overrideId);
        tx.set(overrideRef, {
          date: fromDate, lesson: fromLesson, classKey: request.fromClassKey,
          originalTeacherUid: request.fromTeacherUid, newTeacherUid: request.toTeacherUid,
          active: true, createdAt: serverTimestamp(), sourceRequestId: requestId, type: 'cover'
        }, { merge: true });
      } else if(request.type === 'swap') {
        const toDate = request.toDate || fromDate;
        const toLesson = Number(request.toLesson || request.lesson);

        const overrideId1 = `swapA_${fromDate}_${fromLesson}_${request.fromTeacherUid}_${request.toTeacherUid}`;
        const overrideRef1 = doc(db, 'scheduleOverrides', overrideId1);
        tx.set(overrideRef1, {
          date: fromDate, lesson: fromLesson, classKey: request.fromClassKey,
          originalTeacherUid: request.fromTeacherUid, newTeacherUid: request.toTeacherUid,
          active: true, createdAt: serverTimestamp(), sourceRequestId: requestId, type: 'swap'
        }, { merge: true });

        const toClassKey = request.toClassKey || '—';
        const overrideId2 = `swapB_${toDate}_${toLesson}_${request.toTeacherUid}_${request.fromTeacherUid}`;
        const overrideRef2 = doc(db, 'scheduleOverrides', overrideId2);
        tx.set(overrideRef2, {
          date: toDate, lesson: toLesson, classKey: toClassKey,
          originalTeacherUid: request.toTeacherUid, newTeacherUid: request.fromTeacherUid,
          active: true, createdAt: serverTimestamp(), sourceRequestId: requestId, type: 'swap'
        }, { merge: true });
      }
    }

            <div style="font-weight:900; margin-bottom:2px">تنبيه</div>
            <div style="color:rgba(2,43,66,0.75)">
              عند القبول سيتم إنشاء تعديل (Override) حسب التاريخ والحصة المحددين في الطلب.
            </div>
          </div>
        </div>
      `;

      const footer = `
        <button id="reqAccept" class="filter-btn btn-solid" type="button">
          <i class="fas fa-check"></i> قبول
        </button>
        <button id="reqDeny" class="filter-btn btn-danger" type="button">
          <i class="fas fa-xmark"></i> رفض
        </button>
        <button id="reqClose" class="filter-btn btn-ghost" type="button">
          <i class="fas fa-arrow-right"></i> إغلاق
        </button>
      `;

      openModal({
        title: `طلب ${typeLabel}`,
        bodyHtml: body,
        footerHtml: footer
      });

      document.getElementById('reqClose').addEventListener('click', closeModal);

      document.getElementById('reqDeny').addEventListener('click', async () => {
        try {
          await updateDoc(doc(db, 'swapRequests', requestDocId), {
            status: 'denied',
            respondedAt: serverTimestamp()
          });
          toast({
            title: 'تم الرفض',
            text: 'تم رفض الطلب.',
            icon: 'fa-circle-xmark'
          });
          closeModal();
        } catch (e) {
          console.error(e);
          toast({
            title: 'خطأ',
            text: 'تعذّر رفض الطلب.',
            icon: 'fa-triangle-exclamation'
          });
        }
      });

      document.getElementById('reqAccept').addEventListener('click', async () => {
        const btn = document.getElementById('reqAccept');
        btn.setAttribute('disabled','disabled');
        btn.classList.add('loading');

        try {
          await runTransaction(db, async (tx) => {
            const reqRef = doc(db, 'swapRequests', requestDocId);
            const snap = await tx.get(reqRef);
            if (!snap.exists()) throw new Error('missing');

            const data = snap.data();
            if (data.status !== 'pending_teacher_to') throw new Error('already_done');
            if (data.toTeacherUid !== currentUser.uid) throw new Error('forbidden');

            const fromDateISO = data.fromDate || data.date;
            const fromLesson = Number(data.fromLesson || data.lesson);

            if (data.type === 'cover') {
              const overrideId = `${fromDateISO}_${fromLesson}_${data.fromTeacherUid}`;
              tx.set(doc(db, 'scheduleOverrides', overrideId), {
                date: fromDateISO,
                lesson: fromLesson,
                classKey: data.fromClassKey,
                originalTeacherUid: data.fromTeacherUid,
                newTeacherUid: data.toTeacherUid,
                swapRequestId: requestDocId,
                createdAt: serverTimestamp(),
                active: true
              }, { merge: true });
            }

            if (data.type === 'swap') {
              const toDateISO = data.toDate || fromDateISO;
              let toLesson = Number(data.toLesson) || 0;
              if (!toLesson) {
                toLesson = Number(document.getElementById('swapMyLesson')?.value);
              }
              if (!toLesson) throw new Error('missing_my_lesson');

              const overrideA = `${fromDateISO}_${fromLesson}_${data.fromTeacherUid}`;
              const overrideB = `${toDateISO}_${toLesson}_${data.toTeacherUid}`;

              tx.set(doc(db, 'scheduleOverrides', overrideA), {
                date: fromDateISO,
                lesson: fromLesson,
                classKey: data.fromClassKey,
                originalTeacherUid: data.fromTeacherUid,
                newTeacherUid: data.toTeacherUid,
                swapRequestId: requestDocId,
                createdAt: serverTimestamp(),
                active: true
              }, { merge: true });

              tx.set(doc(db, 'scheduleOverrides', overrideB), {
                date: toDateISO,
                lesson: toLesson,
                classKey: data.toClassKey || '—',
                originalTeacherUid: data.toTeacherUid,
                newTeacherUid: data.fromTeacherUid,
                swapRequestId: requestDocId,
                createdAt: serverTimestamp(),
                active: true
              }, { merge: true });
            }

            tx.update(reqRef, {
              status: 'accepted',
              respondedAt: serverTimestamp()
            });
          });

          toast({
            title: 'تم القبول',
            text: 'تم تطبيق التعديل بنجاح.',
            icon: 'fa-circle-check'
          });

          closeModal();
          await loadTodayForTeacher(currentUser.uid);

        } catch (e) {
          console.error(e);
          const errMsg = e.message === 'missing_my_lesson' 
            ? 'يجب اختيار حصة للتبديل.'
            : 'تعذّر قبول الطلب.';
          toast({
            title: 'خطأ',
            text: errMsg,
            icon: 'fa-triangle-exclamation'
          });
        } finally {
          btn.classList.remove('loading');
          btn.removeAttribute('disabled');
        }
      });
    }

    function startPendingRequestsListener(){
      if(unsubPendingRequests) { unsubPendingRequests(); unsubPendingRequests = null; }
      if(!currentUser?.uid) return;

      const qPending = query(
        collection(db,'swapRequests'),
        where('toTeacherUid','==', currentUser.uid),
        where('status','==', 'pending_teacher_to'),
        orderBy('createdAt','desc'),
        limit(10)
      );

      unsubPendingRequests = onSnapshot(qPending, (snap)=>{
        snap.docChanges().forEach((ch)=>{
          if(ch.type !== 'added') return;

          const id = ch.doc.id;
          const data = ch.doc.data();

          openIncomingRequestModal(id, data);
        });
      }, (err)=>{
        console.error(err);
      });
    }

    /* ========= Current Lesson Highlight Update ========= */
    // Re-evaluated on a timer (see startCurrentLessonTimer) independently of
    // the render loop in renderTodayTable — must use the exact same
    // per-lesson time resolution (isLessonCurrentNow/resolveDisplayLessonTimes)
    // that render used, or it periodically stomps a correct custom-schedule
    // highlight with one computed from the generic site-wide bell schedule.
    function updateCurrentLessonHighlight() {
      const todayISO = kuwaitTodayISO();

      if (currentView === 'today' && activeTodayISO === todayISO) {
        const activeLesson = getActiveLessonIndex();

        containerMain.querySelectorAll('.cell.current-lesson').forEach(el => el.classList.remove('current-lesson'));
        containerMain.querySelectorAll('.compact-row.current-lesson').forEach(el => el.classList.remove('current-lesson'));

        for (let i = 1; i <= FIXED_LESSON_COUNT; i++) {
          const hit = activeTodayByLesson.get(String(i));
          const customTimes = resolveDisplayLessonTimes(hit, activeDayCustomTimes, i);
          if (!isLessonCurrentNow(activeTodayISO, todayISO, i, activeLesson, customTimes)) continue;

          const mainLessonCell = containerMain.querySelector(`.table .cell[data-row-role="lesson"][data-lesson-index="${i}"]`);
          const mainClassCell = containerMain.querySelector(`.table .cell[data-row-role="class"][data-lesson-index="${i}"]`);
          if (mainLessonCell) mainLessonCell.classList.add('current-lesson');
          if (mainClassCell) mainClassCell.classList.add('current-lesson');

          const compactRow = containerMain.querySelector(`.compact-table .compact-row[data-lesson-index="${i}"]`);
          if (compactRow) compactRow.classList.add('current-lesson');
        }
      }
    }

    /* ========= Init week ========= */
    function initWeek(){
      const today = kuwaitTodayISO();
      const start = startOfWeekSunday(today);
      weekDates = [0,1,2,3,4].map(n => addDaysISO(start, n));
      cache.weekKey = start;
    }

    function initClassPicker(){
      CLASS_OPTIONS.forEach((c)=>{
        const opt = document.createElement('option');
        opt.value = c;
        opt.textContent = c;
        classPicker.appendChild(opt);
      });
      btnDownloadSelectedClassPdf.hidden = true;
    }

    function updateSelectedClassDownloadButton(){
      btnDownloadSelectedClassPdf.hidden = !classPicker.value;
    }

    /* ========= More sheet ========= */
    function openMore(){
      moreSheet.classList.add('open');
      moreSheet.setAttribute('aria-hidden','false');
      document.body.style.overflow = 'hidden';
    }
    function closeMoreSheet(){
      moreSheet.classList.remove('open');
      moreSheet.setAttribute('aria-hidden','true');
      document.body.style.overflow = '';
    }

    btnMore.addEventListener('click', openMore);
    closeMore.addEventListener('click', closeMoreSheet);
    btnRequests.addEventListener('click', openRequestsSheet);
    closeRequests.addEventListener('click', closeRequestsSheet);
    btnBackMain.addEventListener('click', () => {
      // This page is reached from several different hubs depending on the
      // signed-in user's role (Teachers/user.html, depHead/dptlead.html,
      // supervisors/supervisor.html, admins/admin-late-attendance.html) —
      // each records its own path right before navigating here, so رجوع
      // returns to wherever the user actually came from instead of always
      // landing on the plain teacher hub.
      let returnTo = '/Teachers/user.html';
      try {
        const stored = sessionStorage.getItem('teacherScheduleReturnTo');
        if (stored) {
          returnTo = stored;
          sessionStorage.removeItem('teacherScheduleReturnTo');
        }
      } catch {}
      location.href = returnTo;
    });
    btnDownloadPdf.addEventListener('click', downloadWeeklySchedulePdf);
    btnDownloadAllClassesPdf.addEventListener('click', downloadAllClassSchedulesPdf);
    btnDownloadSelectedClassPdf.addEventListener('click', downloadSelectedClassSchedulePdf);

    classPicker.addEventListener('change', async ()=>{
      const v = classPicker.value;
      updateSelectedClassDownloadButton();
      if(!v){
        classWeekGrid.innerHTML = '';
        return;
      }
      await loadWeekForClass(v);
    });

    /* ========= Auth ========= */
    setPersistence(auth, browserLocalPersistence).catch(()=>{});

    onAuthStateChanged(auth, async (user)=>{
      if(!user){
        currentUser = null;
        showStatus('الرجاء تسجيل الدخول أولاً.', true);
        return;
      }

      currentUser = user;

      await setupLessonTimesListener();
      startCurrentLessonTimer();
      initWeek();
      CLASS_OPTIONS = sortClassList(await fetchClassList(db));
      initClassPicker();
      setFilterActive(btnToday);

      const profilePromise = getDoc(doc(db,'teachers', user.uid))
        .then(snap=>{
          if(snap.exists()){
            currentTeacherProfile = snap.data();
            currentRole = (currentTeacherProfile.role || '').toString().toLowerCase();
          }
        })
        .catch(e=> console.error(e));

      await Promise.all([
        profilePromise,
        loadTodayForTeacher(user.uid)
      ]);

      if(currentRole === 'head'){
        headUid = user.uid;
        btnRequests.hidden = false;
      }

      startPendingRequestsListener();
    });

    /* ========= Tabs ========= */
    btnToday.addEventListener('click', async ()=>{
      if(!currentUser?.uid) return;
      setFilterActive(btnToday);
      await loadTodayForTeacher(currentUser.uid);
    });

    btnWeek.addEventListener('click', async ()=>{
      if(!currentUser?.uid) return;
      setFilterActive(btnWeek);
      await loadWeekForTeacher(currentUser.uid);
    });

  </script>
  <script src="/shared/hub-title-link.js" defer></script>
<script src="/name-glow.js" defer></script>
</body>
</html>
