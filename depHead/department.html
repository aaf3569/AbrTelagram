  <style>
    :root{
      --primary:#022b42;
      --primary-2:#044563;
      --primary-light: rgba(2, 43, 66, 0.08);

      --page:#f8fafc;
      --card-bg:#ffffff;

      --text:#0f172a;
      --muted:#64748b;

      --border:#e2e8f0;
      --border-light:#f1f5f9;

      --radius:16px;
      --radius-sm:12px;

      --shadow-1:0 4px 12px rgba(2,43,66,.08);
      --shadow-2:0 12px 28px rgba(2,43,66,.12);

      --success:#10b981;
      --danger:#ef4444;
      --warning:#f59e0b;

      --transition: transform .12s ease, box-shadow .12s ease, background-color .12s ease, border-color .12s ease, color .12s ease, opacity .12s ease;
    }

    *{ box-sizing:border-box; margin:0; padding:0; }
    html, body{ height:100%; }

    /* Force Noto Kufi Arabic everywhere */
    body, button, input, textarea, select, .btn, .chip, .tbtn, .cbtn, .stat, .card, .muted {
      font-family:"Noto Kufi Arabic", system-ui, -apple-system, Segoe UI, Roboto, Arial, sans-serif !important;
    }

    body{
      background: var(--page);
      color:var(--text);
      min-height:100vh;
      display:flex;
      flex-direction:column;
      -webkit-tap-highlight-color:transparent;
      line-height:1.6;
    }

    /* Header */
    .site-header{
      position:sticky; top:0; z-index:30;
      background: rgba(255,255,255,0.85);
      backdrop-filter: blur(12px);
      -webkit-backdrop-filter: blur(12px);
      border-bottom:1px solid rgba(2,43,66,0.10);
      box-shadow: 0 2px 10px rgba(2,43,66,0.06);
      padding: 14px 18px;
    }
    .header-container{
      max-width:1200px; margin:0 auto;
      display:grid;
      grid-template-columns: 1fr auto 1fr;
      align-items:center;
      gap:12px;
    }
    .header-side{ display:flex; align-items:center; }
    .header-side.end{ justify-content:flex-end; }
    .dept-label{
      justify-self:center;
      font-weight:900;
      color:var(--primary);
      font-size:1.15rem;
      text-align:center;
      white-space:nowrap;
      overflow:hidden;
      text-overflow:ellipsis;
    }

    .btn{
      height:44px;
      padding:0 16px;
      border-radius: var(--radius-sm);
      border:1px solid rgba(2,43,66,0.20);
      background: var(--card-bg);
      color: var(--primary);
      font-weight:900;
      cursor:pointer;
      box-shadow: var(--shadow-1);
      transition: var(--transition);
      display:inline-flex;
      align-items:center;
      gap:8px;
      font-size: 0.9rem;
      position:relative;
    }
    .btn:hover{ transform: translateY(-2px); box-shadow: var(--shadow-2); border-color: rgba(2,43,66,0.35); }
    .btn:active{ transform: translateY(0); }
    .btn[disabled]{ opacity:.6; cursor:not-allowed; transform:none; }
    .btn.solid{
      background: linear-gradient(135deg, var(--primary-2), var(--primary));
      border-color: rgba(2,43,66,0.15);
      color: #fff;
    }
    .btn.ghost{
      background: rgba(2,43,66,0.04);
      border-color: rgba(2,43,66,0.14);
    }
    .btn.loading::after{
      content:"";
      width:10px; height:10px;
      border-radius:50%;
      border:2px solid currentColor;
      border-top-color:transparent;
      position:absolute;
      left:10px;
      animation: spin .8s linear infinite;
    }
    @keyframes spin { to { transform: rotate(360deg); } }

    /* Layout */
    main{ flex:1; padding:18px; }
    .wrap{
      max-width:1200px; margin:0 auto;
      display:flex; flex-direction:column;
      gap:16px;
    }

    .card{
      background: var(--card-bg);
      border:1px solid var(--border);
      border-radius: var(--radius);
      box-shadow: var(--shadow-1);
      padding:16px;
      transition: var(--transition);
    }
    .card:hover{ box-shadow: var(--shadow-2); }
    .muted{ color: var(--muted); font-weight:800; font-size: .9rem; }

    /* Responsive */
    @media (max-width: 600px){
      main{ padding: 14px; }
    }
    @media (max-width: 420px){
      .btn span{ display:none; }
      .btn{ width:44px; padding:0; justify-content:center; }
    }
  </style>

<body>
  <header class="site-header">
    <div class="header-container">
      <div class="header-side">
        <button id="btnBack" class="btn" type="button" aria-label="رجوع">
          <i class="fas fa-arrow-right"></i><span>رجوع</span>
        </button>
      </div>

      <div class="dept-label" id="deptLabel">قسم —</div>

      <div class="header-side end" aria-hidden="true"></div>
    </div>
  </header>

  <main>
    <div class="wrap"></div>
  </main>

  <script type="module">
    import { firebaseConfig } from "/shared/firebase.js";
    /* ========= Firebase ========= */
    import { initializeApp, getApp, getApps } from "/shared/firebase.js";
    import {
      getAuth, onAuthStateChanged, setPersistence, browserLocalPersistence
    } from "/shared/firebase.js";
    import {
      initializeFirestore, persistentSingleTabManager,
      doc, getDoc
    } from "/shared/firebase.js";

    

    const app = getApps().length ? getApp() : initializeApp(firebaseConfig);
    let db;
    try{
      db = initializeFirestore(app, { localCache: persistentSingleTabManager() });
    }catch(e){
      db = initializeFirestore(app, {});
    }
    const auth = getAuth(app);

    /* ========= Elements ========= */
    const deptLabel = document.getElementById('deptLabel');
    const btnBack = document.getElementById('btnBack');

    const MERGED_DEPARTMENTS = [
      { department: 'الفيزياء والكيمياء', subjects: ['الفيزياء','الكيمياء'] },
      { department: 'الجيولوجيا والأحياء', subjects: ['الجيولوجيا','الأحياء'] },
      { department: 'علم النفس والفلسفة', subjects: ['علم النفس','الفلسفة'] },
      { department: 'التاريخ والجغرافيا', subjects: ['التاريخ','الجغرافيا','جغرافيا'] }
    ];
    function resolveDepartmentName(rawValue){
      const value=(rawValue||'').toString().trim();
      if(!value) return '';
      for(const group of MERGED_DEPARTMENTS){
        if(value===group.department || group.subjects.includes(value)) return group.department;
      }
      return value;
    }

    /* ========= Data Loading ========= */
    async function loadHeadProfileAndCheck(user){
      const snap = await getDoc(doc(db,'teachers', user.uid));
      if(!snap.exists()){
        throw new Error('no_teacher_profile');
      }
      const d = snap.data() || {};
      const role = (d.role || '').toString().toLowerCase();
      if(role !== 'head'){
        throw new Error('not_head');
      }
      const rawDept = (d.department || d.dept || d.subject || '').toString().trim();
      const headDept = resolveDepartmentName(rawDept) || '—';
      deptLabel.textContent = `قسم ${headDept}`;
      return d;
    }

    /* ========= Init ========= */
    setPersistence(auth, browserLocalPersistence).catch(()=>{});

    btnBack.addEventListener('click', ()=>{
      window.location.href = 'dptlead.html';
    });

    onAuthStateChanged(auth, async (user)=>{
      if(!user){
        deptLabel.textContent = 'الرجاء تسجيل الدخول...';
        setTimeout(()=> window.location.href = '/index.html', 250);
        return;
      }

      try{
        await loadHeadProfileAndCheck(user);
      }catch(e){
        console.error(e);
        deptLabel.textContent = (String(e?.message || e) === 'not_head')
          ? 'غير مصرح'
          : 'تعذّر تحميل البيانات';
      }
    });
  </script>
