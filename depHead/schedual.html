    async function openRequestModal(type, meta){
      const isSwap = type === 'swap';
      const todayISO = kuwaitTodayISO();
      const teachers = await loadTeachersList();
      const fromDepartment = resolveDepartmentName(headSubject || '');
      const fromHeadName = currentHead?.name || await getHeadName(headUid);
      const fromHead = { uid: headUid, name: fromHeadName, subject: fromDepartment };

      const defaultFromDate = safeText(meta?.date || todayISO).trim() || todayISO;
      const defaultFromLesson = normalizeLessonNumber(meta?.lesson);
      const defaultFromClassKey = safeText(meta?.classKey).trim() || '—';

      const departmentSet = new Set();
      teachers.forEach(t => {
        const dep = resolveDepartmentName(t.normalizedDepartment || t.department || t.subject || '');
        if (dep) departmentSet.add(dep);
      });
      if (fromDepartment) departmentSet.add(fromDepartment);
      const departmentOptions = Array.from(departmentSet)
        .sort((a, b) => a.localeCompare(b, 'ar'))
        .map(dep => `<option value="${escapeHtml(dep)}">${escapeHtml(dep)}</option>`)
        .join('');

      let body = `
        ${lessonInfoBox({ ...meta, date: defaultFromDate, lesson: defaultFromLesson || 1, classKey: defaultFromClassKey })}
        <div class="split">
          <div class="info-box">
            <div class="info-k"><i class="fas fa-calendar-day"></i> 1) اختر تاريخ حصتك</div>
            <div class="input-wrap" style="margin-top:10px">
              <input id="reqFromDate" class="input" type="date" min="${todayISO}" value="${escapeHtml(defaultFromDate)}" />
            </div>
            <div class="muted" style="margin-top:8px">يمكنك اختيار اليوم الحالي أو أي يوم مستقبلي.</div>
          </div>
          <div class="info-box">
            <div class="info-k"><i class="far fa-clock"></i> 2) اختر حصتك</div>
            <div class="input-wrap" style="margin-top:10px">
              <select id="reqFromLesson" class="select">
                <option value="">اختر الحصة...</option>
              </select>
            </div>
            <div class="muted" style="margin-top:8px" id="reqFromPreview">—</div>
          </div>
        </div>
      `;

      if (isSwap) {
        body += `
          <div class="split">
            <div class="info-box">
              <div class="info-k"><i class="fas fa-building"></i> 3) اختر القسم</div>
              <div class="input-wrap" style="margin-top:10px">
                <select id="reqDepartment" class="select">
                  <option value="">اختر القسم...</option>
                  ${departmentOptions}
                </select>
              </div>
            </div>
            <div class="info-box">
              <div class="info-k"><i class="fas fa-user"></i> 4) اختر المعلّم</div>
              <div class="input-wrap" style="margin-top:10px">
                <select id="reqTeacherUid" class="select" disabled>
                  <option value="">اختر المعلّم...</option>
                </select>
              </div>
              <div class="muted" style="margin-top:8px" id="teacherSelectMessage">اختر القسم أولاً.</div>
            </div>
          </div>
          <div class="split">
            <div class="info-box">
              <div class="info-k"><i class="fas fa-calendar-week"></i> 5) تاريخ حصة المعلّم الآخر</div>
              <div class="input-wrap" style="margin-top:10px">
                <input id="reqToDate" class="input" type="date" min="${todayISO}" value="${escapeHtml(defaultFromDate)}" />
              </div>
            </div>
            <div class="info-box">
              <div class="info-k"><i class="far fa-clock"></i> 6) حصة المعلّم الآخر</div>
              <div class="input-wrap" style="margin-top:10px">
                <select id="reqToLesson" class="select" disabled>
                  <option value="">اختر الحصة...</option>
                </select>
              </div>
              <div class="muted" style="margin-top:8px" id="reqToPreview">اختر المعلّم أولاً.</div>
            </div>
          </div>
        `;
      } else {
        body += `
          <div class="info-box">
            <div class="info-k"><i class="fas fa-user"></i> 3) اختر المعلّم للتغطية</div>
            <div class="input-wrap" style="margin-top:10px">
              <select id="reqTeacherUid" class="select">
                ${teacherSelectOptions(teachers, headUid)}
              </select>
            </div>
            <div class="muted" style="margin-top:8px">يمكنك اختيار أي معلّم حتى لو لم تكن لديه حصة في هذا الوقت.</div>
          </div>
        `;
      }

      body += `
        <div class="info-box">
          <div class="info-k"><i class="fas fa-message"></i> ملاحظة (اختياري)</div>
          <div class="input-wrap" style="margin-top:10px">
            <input id="reqMessage" class="input" maxlength="160" placeholder="مثال: هل يناسبك التبديل؟" />
          </div>
        </div>
        <div id="reqStateHint" class="hint">
          <i class="fas fa-circle-info" style="margin-top:2px"></i>
          <div>حدد تفاصيل الحصص لإكمال الطلب.</div>
        </div>
      `;

      const actionTitle = isSwap ? 'طلب تبديل' : 'طلب تغطية';
      const footer = `
        <button id="sendReq" class="filter-btn btn-solid" type="button" disabled>
          <i class="fas fa-paper-plane"></i> إرسال الطلب
        </button>
        <button id="backToActions" class="filter-btn btn-ghost" type="button">
          <i class="fas fa-arrow-right"></i> رجوع
        </button>
      `;

      openModal({ title: actionTitle, bodyHtml: body, footerHtml: footer });
      document.getElementById('backToActions').addEventListener('click', ()=> openLessonActionsModal(meta));

      const sendBtn = document.getElementById('sendReq');
      const hintEl = document.getElementById('reqStateHint');
      const fromDateInput = document.getElementById('reqFromDate');
      const fromLessonSelect = document.getElementById('reqFromLesson');
      const fromPreview = document.getElementById('reqFromPreview');
      const teacherSelect = document.getElementById('reqTeacherUid');
      const reqMessage = document.getElementById('reqMessage');

      const departmentSelect = isSwap ? document.getElementById('reqDepartment') : null;
      const teacherMessage = isSwap ? document.getElementById('teacherSelectMessage') : null;
      const toDateInput = isSwap ? document.getElementById('reqToDate') : null;
      const toLessonSelect = isSwap ? document.getElementById('reqToLesson') : null;
      const toPreview = isSwap ? document.getElementById('reqToPreview') : null;

      const state = {
        fromSlots: [],
        toSlots: [],
        fromSlot: null,
        toSlot: null,
        toUid: '',
        toDepartment: ''
      };
      let fromLoadToken = 0;
      let toLoadToken = 0;

      function setHint(text, isError = false){
        if (!hintEl) return;
        hintEl.style.background = isError ? 'rgba(239, 68, 68, 0.12)' : 'rgba(2, 43, 66, 0.06)';
        hintEl.style.borderColor = isError ? 'rgba(239, 68, 68, 0.25)' : 'rgba(2, 43, 66, 0.10)';
        hintEl.style.color = isError ? '#991b1b' : 'var(--primary)';
        hintEl.innerHTML = `
          <i class="fas ${isError ? 'fa-triangle-exclamation' : 'fa-circle-info'}" style="margin-top:2px"></i>
          <div>${escapeHtml(text)}</div>
        `;
      }

      function fillSlotSelect(selectEl, slots, placeholder){
        if (!selectEl) return;
        const options = (slots || []).map(slot => `
          <option value="${slot.lesson}">
            ${escapeHtml(LESSONS_AR[slot.lesson-1])} (#${slot.lesson}) • ${escapeHtml(lessonTimeLabel(slot.lesson))} • ${escapeHtml(slot.classKey || '—')}
          </option>
        `).join('');
        selectEl.innerHTML = `<option value="">${escapeHtml(placeholder)}</option>${options}`;
      }

      function updateSlotPreview(el, slot, fallbackText){
        if (!el) return;
        if (!slot) {
          el.textContent = fallbackText;
          return;
        }
        el.textContent = slotSummaryLine(slot);
      }

      function validateDateInput(dateISO){
        if (!dateISO) return 'اختر التاريخ.';
        if (isPastISO(dateISO)) return 'لا يمكن اختيار تاريخ ماضٍ.';
        if (!isSchoolDayISO(dateISO)) return 'اختر يومًا دراسيًا من الأحد إلى الخميس.';
        return '';
      }

      function syncSendState(){
        const srcDateErr = validateDateInput(fromDateInput.value);
        if (srcDateErr) {
          sendBtn.disabled = true;
          setHint(`الحصة الأساسية: ${srcDateErr}`, true);
          return;
        }
        if (!state.fromSlot) {
          sendBtn.disabled = true;
          setHint('اختر حصتك الأساسية أولاً.', true);
          return;
        }
        if (!state.toUid) {
          sendBtn.disabled = true;
          setHint('اختر المعلّم المطلوب.', true);
          return;
        }
        if (state.toUid === headUid) {
          sendBtn.disabled = true;
          setHint('لا يمكنك إرسال طلب لنفسك.', true);
          return;
        }

        if (isSwap) {
          const toDateErr = validateDateInput(toDateInput.value);
          if (toDateErr) {
            sendBtn.disabled = true;
            setHint(`حصة المعلّم الآخر: ${toDateErr}`, true);
            return;
          }
          if (!state.toSlot) {
            sendBtn.disabled = true;
            setHint('اختر حصة المعلّم الآخر لإتمام التبديل.', true);
            return;
          }
          sendBtn.disabled = false;
          setHint(`سيتم التبديل بين: ${slotSummaryLine(state.fromSlot)} ⇄ ${slotSummaryLine(state.toSlot)}`, false);
          return;
        }

        sendBtn.disabled = false;
        setHint(`سيتم إرسال طلب تغطية للحصة: ${slotSummaryLine(state.fromSlot)}`, false);
      }

      async function refreshFromSlots(preferredLesson = null){
        const token = ++fromLoadToken;
        const dateISO = safeText(fromDateInput.value).trim();
        state.fromSlots = [];
        state.fromSlot = null;
        fillSlotSelect(fromLessonSelect, [], 'اختر الحصة...');
        updateSlotPreview(fromPreview, null, 'اختر التاريخ ثم الحصة.');

        const dateErr = validateDateInput(dateISO);
        if (dateErr) {
          syncSendState();
          return;
        }

        const slots = await getTeacherSlotsForDate(headUid, dateISO);
        if (token !== fromLoadToken) return;
        state.fromSlots = slots;
        fillSlotSelect(fromLessonSelect, slots, slots.length ? 'اختر الحصة...' : 'لا توجد حصص في هذا التاريخ');

        const selected = normalizeLessonNumber(preferredLesson || fromLessonSelect.value);
        if (selected && slots.some(s => s.lesson === selected)) {
          fromLessonSelect.value = String(selected);
        } else if (defaultFromLesson && slots.some(s => s.lesson === defaultFromLesson)) {
          fromLessonSelect.value = String(defaultFromLesson);
        } else if (slots.length === 1) {
          fromLessonSelect.value = String(slots[0].lesson);
        }

        const chosenLesson = normalizeLessonNumber(fromLessonSelect.value);
        state.fromSlot = chosenLesson ? (slots.find(s => s.lesson === chosenLesson) || null) : null;
        updateSlotPreview(fromPreview, state.fromSlot, slots.length ? 'اختر الحصة.' : 'لا توجد حصص لك في هذا التاريخ.');
        syncSendState();
      }

      async function refreshTargetSlots(preferredLesson = null){
        if (!isSwap) return;
        const token = ++toLoadToken;
        state.toSlots = [];
        state.toSlot = null;
        fillSlotSelect(toLessonSelect, [], 'اختر الحصة...');
        updateSlotPreview(toPreview, null, 'اختر المعلّم والتاريخ.');
        toLessonSelect.disabled = true;

        const toUid = safeText(teacherSelect.value).trim();
        state.toUid = toUid;
        const dateISO = safeText(toDateInput.value).trim();

        const dateErr = validateDateInput(dateISO);
        if (!toUid || dateErr) {
          syncSendState();
          return;
        }

        const slots = await getTeacherSlotsForDate(toUid, dateISO);
        if (token !== toLoadToken) return;
        state.toSlots = slots;
        fillSlotSelect(toLessonSelect, slots, slots.length ? 'اختر الحصة...' : 'لا توجد حصص للمعلم في هذا التاريخ');
        toLessonSelect.disabled = !slots.length;

        const selected = normalizeLessonNumber(preferredLesson || toLessonSelect.value);
        if (selected && slots.some(s => s.lesson === selected)) {
          toLessonSelect.value = String(selected);
        } else if (slots.length === 1) {
          toLessonSelect.value = String(slots[0].lesson);
        }

        const chosenLesson = normalizeLessonNumber(toLessonSelect.value);
        state.toSlot = chosenLesson ? (slots.find(s => s.lesson === chosenLesson) || null) : null;
        updateSlotPreview(toPreview, state.toSlot, slots.length ? 'اختر حصة المعلم.' : 'لا توجد حصص في هذا التاريخ.');
        syncSendState();
      }

      if (isSwap) {
        departmentSelect.addEventListener('change', async ()=>{
          const selectedDepartment = resolveDepartmentName(departmentSelect.value);
          state.toDepartment = selectedDepartment;
          teacherSelect.innerHTML = '<option value="">اختر المعلّم...</option>';
          teacherSelect.disabled = true;
          teacherMessage.textContent = selectedDepartment ? 'جاري تحميل المعلمين...' : 'اختر القسم أولاً.';
          state.toUid = '';
          await refreshTargetSlots();

          if (!selectedDepartment) {
            syncSendState();
            return;
          }

          const departmentTeachers = await getTeachersByDepartment(selectedDepartment, headUid);
          if(!departmentTeachers.length){
            teacherMessage.textContent = 'لا يوجد معلمون في هذا القسم.';
            syncSendState();
            return;
          }

          teacherSelect.disabled = false;
          teacherMessage.textContent = 'اختر المعلّم.';
          departmentTeachers.forEach(t=>{
            const option = document.createElement('option');
            option.value = t.uid;
            option.textContent = t.name;
            teacherSelect.appendChild(option);
          });
          syncSendState();
        });

        teacherSelect.addEventListener('change', async ()=>{
          const selectedTeacher = teachers.find(t => t.uid === teacherSelect.value);
          if (selectedTeacher && !state.toDepartment) {
            state.toDepartment = resolveDepartmentName(
              selectedTeacher.normalizedDepartment || selectedTeacher.department || selectedTeacher.subject || ''
            );
          }
          await refreshTargetSlots();
        });
        toDateInput.addEventListener('change', async ()=>{
          await refreshTargetSlots();
        });
        toLessonSelect.addEventListener('change', ()=>{
          const chosenLesson = normalizeLessonNumber(toLessonSelect.value);
          state.toSlot = chosenLesson ? (state.toSlots.find(s => s.lesson === chosenLesson) || null) : null;
          updateSlotPreview(toPreview, state.toSlot, state.toSlots.length ? 'اختر حصة المعلم.' : 'لا توجد حصص في هذا التاريخ.');
          syncSendState();
        });
      } else {
        teacherSelect.addEventListener('change', ()=>{
          state.toUid = safeText(teacherSelect.value).trim();
          syncSendState();
        });
      }

      fromDateInput.addEventListener('change', async ()=>{
        await refreshFromSlots();
      });
      fromLessonSelect.addEventListener('change', ()=>{
        const chosenLesson = normalizeLessonNumber(fromLessonSelect.value);
        state.fromSlot = chosenLesson ? (state.fromSlots.find(s => s.lesson === chosenLesson) || null) : null;
        updateSlotPreview(fromPreview, state.fromSlot, state.fromSlots.length ? 'اختر الحصة.' : 'لا توجد حصص لك في هذا التاريخ.');
        syncSendState();
      });

      await refreshFromSlots(defaultFromLesson);
      if (!isSwap) {
        state.toUid = safeText(teacherSelect.value).trim();
        syncSendState();
      }

      sendBtn.addEventListener('click', async ()=>{
        const toTeacherUid = safeText(teacherSelect.value).trim();
        if(!toTeacherUid){
          toast({ title: 'ناقص', text: 'اختر المعلّم أولاً.', icon: 'fa-circle-exclamation' });
          return;
        }
        if(toTeacherUid === headUid){
          toast({ title: 'غير صالح', text: 'لا يمكنك إرسال طلب لنفسك.', icon: 'fa-circle-exclamation' });
          return;
        }

        const sourceDate = safeText(fromDateInput.value).trim();
        const sourceLesson = normalizeLessonNumber(fromLessonSelect.value);
        const sourceSlot = await getTeacherSlotForDateLesson(headUid, sourceDate, sourceLesson);
        if (!sourceSlot) {
          toast({ title: 'تعذّر إكمال الطلب', text: 'تعذّر العثور على حصتك في التاريخ/الحصة المحددة.', icon: 'fa-circle-exclamation' });
          return;
        }

        const targetTeacher = teachers.find(t => t.uid === toTeacherUid);
        if(!targetTeacher){
          toast({ title: 'خطأ', text: 'تعذّر العثور على بيانات المعلم المطلوب.', icon: 'fa-triangle-exclamation' });
          return;
        }

        let toDepartment = isSwap
          ? resolveDepartmentName(state.toDepartment || departmentSelect?.value || '')
          : resolveDepartmentName(targetTeacher.normalizedDepartment || targetTeacher.department || targetTeacher.subject || '');

        if(!toDepartment){
          toDepartment = resolveDepartmentName(targetTeacher.subject || '');
        }
        if(!toDepartment){
          toast({
            title: 'خطأ',
            text: 'قسم المعلم المطلوب غير محدد. حدّث بيانات المعلم أولاً.',
            icon: 'fa-triangle-exclamation'
          });
          return;
        }

        let targetSlot = null;
        if (isSwap) {
          const targetDate = safeText(toDateInput.value).trim();
          const targetLesson = normalizeLessonNumber(toLessonSelect.value);
          targetSlot = await getTeacherSlotForDateLesson(toTeacherUid, targetDate, targetLesson);
          if (!targetSlot) {
            toast({
              title: 'تعذّر إتمام التبديل',
              text: 'المعلم المطلوب لا يملك حصة في التاريخ/الحصة المحددة.',
              icon: 'fa-circle-exclamation'
            });
            return;
          }
        }

        let toHead = null;
        if(toDepartment === fromDepartment){
          toHead = fromHead;
        } else {
          toHead = await findHeadOfDepartment(toDepartment);
          if(!toHead){
            toast({
              title: 'خطأ',
              text: 'لا يمكن العثور على رئيس القسم الخاص بالمعلم المطلوب.',
              icon: 'fa-triangle-exclamation',
              ms: 5000
            });
            return;
          }
        }

        try{
          const qDup = query(
            collection(db,'swapRequests'),
            where('fromHeadUid','==', headUid),
            where('date','==', sourceSlot.date),
            where('lesson','==', sourceSlot.lesson),
            where('status','in', ['pending_head_to', 'pending_head_from', 'pending_head']),
            limit(1)
          );
          const dup = await getDocs(qDup);
          if(!dup.empty){
            toast({ title: 'موجود مسبقاً', text: 'يوجد طلب معلّق لهذه الحصة بالفعل.', icon: 'fa-clock' });
            closeModal();
            return;
          }
        }catch(e){
          console.warn('dup check skipped', e);
        }

        sendBtn.setAttribute('disabled','disabled');
        sendBtn.classList.add('loading');

        try{
          const toHeadName = toHead.name || await getHeadName(toHead.uid);
          const reqRef = await addDoc(collection(db,'swapRequests'), {
            date: sourceSlot.date,
            lesson: sourceSlot.lesson,
            fromDate: sourceSlot.date,
            fromLesson: sourceSlot.lesson,
            fromClassKey: sourceSlot.classKey,
            toDate: isSwap ? targetSlot.date : null,
            toLesson: isSwap ? targetSlot.lesson : null,
            toClassKey: isSwap ? targetSlot.classKey : null,
            type,
            requestVersion: 2,
            fromTeacherUid: headUid,
            fromTeacherName: fromHeadName,
            fromSubject: fromDepartment,
            fromDepartment,
            toTeacherUid,
            toTeacherName: targetTeacher.name,
            toSubject: targetTeacher.subject || '',
            toDepartment,
            fromHeadUid: fromHead.uid,
            fromHeadName: fromHead.name,
            toHeadUid: toHead.uid,
            toHeadName,
            status: 'pending_head_to',
            stage: 'head_to',
            createdAt: serverTimestamp(),
            respondedAt: null,
            message: safeText(reqMessage.value).trim() || null
          });

          if(toDepartment === fromDepartment){
            await runTransaction(db, async (tx)=>{
              const requestRef = doc(db, 'swapRequests', reqRef.id);
              const requestSnap = await tx.get(requestRef);
              if(!requestSnap.exists()) throw new Error('missing_request');
              const requestData = requestSnap.data();
              if(requestData.status !== 'pending_head_to') throw new Error('request_not_pending');
              if(requestData.toHeadUid !== headUid) throw new Error('not_authorized');

              tx.update(requestRef, {
                status: 'accepted',
                respondedAt: serverTimestamp()
              });
              await createOverridesInTransaction(tx, requestData, reqRef.id);
            });

            toast({
              title: 'تم التنفيذ',
              text: `تم تنفيذ ${type === 'cover' ? 'التغطية' : 'التبديل'} مباشرة داخل القسم.`,
              icon: 'fa-circle-check'
            });
          } else {
            toast({
              title: 'تم إرسال الطلب',
              text: `تم إرسال ${type === 'cover' ? 'طلب التغطية' : 'طلب التبديل'} إلى ${toHeadName} للموافقة.`,
              icon: 'fa-circle-check'
            });
          }

          closeModal();
          if(currentView === 'today' && activeTodayISO === kuwaitTodayISO()){
            await loadTodayForHead();
          } else if (currentView === 'week') {
            await loadWeekForHead();
          }
        }catch(e){
          console.error(e);
          toast({
            title: 'خطأ',
            text: 'تعذّر إرسال الطلب أو تنفيذه. حاول مرة أخرى.',
            icon: 'fa-triangle-exclamation',
            ms: 5000
          });
        }finally{
          sendBtn.classList.remove('loading');
          syncSendState();
        }
      });
    }

    /* ========= Requests Sheet ========= */
    function openRequestsSheet(){
      requestsSheet.classList.add('open');
      requestsSheet.setAttribute('aria-hidden','false');
      document.body.style.overflow = 'hidden';
      loadRequests();
    }

    function closeRequestsSheet(){
      requestsSheet.classList.remove('open');
      requestsSheet.setAttribute('aria-hidden','true');
      document.body.style.overflow = '';
      if(unsubRequestsFrom) unsubRequestsFrom();
      if(unsubRequestsTo) unsubRequestsTo();
    }

    function renderRequestCard(requestDocId, request){
      const card = document.createElement('div');
      card.className = 'request-card';
      card.dataset.id = requestDocId;
      
      const typeLabel = request.type === 'cover' ? 'تغطية' : 'تبديل';
      const typeClass = request.type === 'cover' ? 'type-cover' : 'type-swap';
      
      // Update status labels according to new Arabic labels
      let statusLabel = '';
      let statusClass = '';
      switch(request.status) {
        case 'pending_head_from':
          statusLabel = 'بانتظار موافقة رئيس قسم المرسل';
          statusClass = 'status-pending';
          break;
        case 'pending_head_to':
          statusLabel = 'بانتظار موافقة رئيس قسم المستلم';
          statusClass = 'status-pending';
          break;
        case 'accepted':
          statusLabel = 'مقبول';
          statusClass = 'status-accepted';
          break;
        case 'denied':
          statusLabel = 'مرفوض';
          statusClass = 'status-denied';
          break;
        default:
          statusLabel = request.status || '—';
          statusClass = 'status-pending';
      }
      
      const isToMe = request.toHeadUid === headUid;
      const isFromMe = request.fromHeadUid === headUid;
      
      // Show action buttons only when THIS head must act
      let actionsHtml = '';
      if(request.status === 'pending_head_from' && isFromMe){
        actionsHtml = `
          <button class="filter-btn btn-solid btn-approve" data-id="${requestDocId}">
            <i class="fas fa-check"></i> موافقة
          </button>
          <button class="filter-btn btn-danger btn-deny" data-id="${requestDocId}">
            <i class="fas fa-xmark"></i> رفض
          </button>
        `;
      } else if(request.status === 'pending_head_to' && isToMe){
        actionsHtml = `
          <button class="filter-btn btn-solid btn-approve" data-id="${requestDocId}">
            <i class="fas fa-check"></i> قبول
          </button>
          <button class="filter-btn btn-danger btn-deny" data-id="${requestDocId}">
            <i class="fas fa-xmark"></i> رفض
          </button>
        `;
      }
      
      const fromDate = request.fromDate || request.date || '—';
      const fromLessonNumber = Number(request.fromLesson || request.lesson) || 0;
      const fromLessonLabel = fromLessonNumber ? `${LESSONS_AR[fromLessonNumber - 1]} (#${fromLessonNumber})` : '—';
      const toDate = request.toDate || '—';
      const toLessonNumber = Number(request.toLesson) || 0;
      const toLessonLabel = toLessonNumber ? `${LESSONS_AR[toLessonNumber - 1]} (#${toLessonNumber})` : '—';
      
      card.innerHTML = `
        <div class="request-header">
          <span class="request-type ${typeClass}">${typeLabel}</span>
          <span class="status-badge ${statusClass}">${statusLabel}</span>
        </div>
        <div class="request-body">
          <div class="request-row">
            <span class="request-label"><i class="far fa-calendar"></i> تاريخ الحصة الأساسية</span>
            <span class="request-value">${escapeHtml(fromDate)}</span>
          </div>
          <div class="request-row">
            <span class="request-label"><i class="far fa-clock"></i> الحصة الأساسية</span>
            <span class="request-value">${escapeHtml(fromLessonLabel)}</span>
          </div>
          ${request.type === 'swap' ? `
          <div class="request-row">
            <span class="request-label"><i class="fas fa-calendar-week"></i> تاريخ الحصة المقابلة</span>
            <span class="request-value">${escapeHtml(toDate)}</span>
          </div>
          <div class="request-row">
            <span class="request-label"><i class="fas fa-arrows-left-right"></i> الحصة المقابلة</span>
            <span class="request-value">${escapeHtml(toLessonLabel)}</span>
          </div>
          ` : ''}
          <div class="request-row">
            <span class="request-label"><i class="fas fa-users"></i> الصف</span>
            <span class="request-value">${escapeHtml(request.fromClassKey || '—')}</span>
          </div>
          <div class="request-row">
            <span class="request-label"><i class="fas fa-user"></i> المرسل</span>
            <span class="request-value">${escapeHtml(request.fromTeacherName || '—')} (${escapeHtml(request.fromSubject || '—')})</span>
          </div>
          <div class="request-row">
            <span class="request-label"><i class="fas fa-user-tie"></i> المُرسل إليه</span>
            <span class="request-value">${escapeHtml(request.toTeacherName || '—')} (${escapeHtml(request.toSubject || '—')})</span>
          </div>
          ${request.message ? `
          <div class="request-row">
            <span class="request-label"><i class="fas fa-message"></i> الملاحظة</span>
            <span class="request-value">${escapeHtml(request.message)}</span>
          </div>
          ` : ''}
        </div>
        ${actionsHtml ? `<div class="request-footer">${actionsHtml}</div>` : ''}
      `;
      
      return card;
    }

    async function loadRequests(){
      requestsContainer.innerHTML = '<div style="text-align:center; padding:20px; color:var(--muted);">جاري التحميل...</div>';
      
      // Clean up previous listeners
      if(unsubRequestsFrom) unsubRequestsFrom();
      if(unsubRequestsTo) unsubRequestsTo();
      
      // Create two separate queries for fromHeadUid and toHeadUid
      const qFrom = query(
        collection(db,'swapRequests'),
        where('fromHeadUid','==', headUid),
        orderBy('createdAt','desc')
      );
      
      const qTo = query(
        collection(db,'swapRequests'),
        where('toHeadUid','==', headUid),
        orderBy('createdAt','desc')
      );
      
      let requestsMap = new Map();
      
      function renderAllRequests() {
        requestsContainer.innerHTML = '';
        
        if(requestsMap.size === 0){
          requestsContainer.innerHTML = '<div style="text-align:center; padding:40px; color:var(--muted); font-weight:700;">لا توجد طلبات حالياً.</div>';
          return;
        }
        
        // Convert map to array and sort by createdAt desc
        const allRequests = Array.from(requestsMap.values()).sort((a, b) => {
          const aTime = a.request.createdAt?.toMillis() || 0;
          const bTime = b.request.createdAt?.toMillis() || 0;
          return bTime - aTime;
        });
        
        allRequests.forEach(({id, request}) => {
          const card = renderRequestCard(id, request);
          requestsContainer.appendChild(card);
        });
        
        // Add event listeners for buttons
        requestsContainer.querySelectorAll('.btn-approve').forEach(btn => {
          btn.addEventListener('click', () => handleRequestApprove(btn.dataset.id));
        });
        requestsContainer.querySelectorAll('.btn-deny').forEach(btn => {
          btn.addEventListener('click', () => handleRequestDeny(btn.dataset.id));
        });
      }
      
      // Set up two listeners
      unsubRequestsFrom = onSnapshot(qFrom, (snap) => {
        snap.docChanges().forEach(change => {
          const id = change.doc.id;
          const request = change.doc.data();
          
          if(change.type === 'added' || change.type === 'modified') {
            requestsMap.set(id, { id, request });
          } else if(change.type === 'removed') {
            requestsMap.delete(id);
          }
        });
        
        renderAllRequests();
      }, (error) => {
        console.error('Error loading fromHeadUid requests:', error);
        toast({
          title: 'خطأ',
          text: 'حدث خطأ في تحميل بعض الطلبات.',
          icon: 'fa-triangle-exclamation'
        });
      });
      
      unsubRequestsTo = onSnapshot(qTo, (snap) => {
        snap.docChanges().forEach(change => {
          const id = change.doc.id;
          const request = change.doc.data();
          
          if(change.type === 'added' || change.type === 'modified') {
            requestsMap.set(id, { id, request });
          } else if(change.type === 'removed') {
            requestsMap.delete(id);
          }
        });
        
        renderAllRequests();
      }, (error) => {
        console.error('Error loading toHeadUid requests:', error);
        toast({
          title: 'خطأ',
          text: 'حدث خطأ في تحميل بعض الطلبات.',
          icon: 'fa-triangle-exclamation'
        });
      });
      
      // Also load initial data for both queries
      try {
        const [fromSnap, toSnap] = await Promise.all([
          getDocs(qFrom),
          getDocs(qTo)
        ]);
        
        requestsMap.clear();
        
        fromSnap.forEach(docSnap => {
          requestsMap.set(docSnap.id, { id: docSnap.id, request: docSnap.data() });
        });
        
        toSnap.forEach(docSnap => {
          requestsMap.set(docSnap.id, { id: docSnap.id, request: docSnap.data() });
        });
        
        renderAllRequests();
      } catch (error) {
        console.error('Error loading initial requests:', error);
        requestsContainer.innerHTML = '<div style="text-align:center; padding:20px; color:var(--danger); font-weight:700;">حدث خطأ في تحميل الطلبات.</div>';
      }
    }

    async function handleRequestApprove(requestId){
      try {
        await runTransaction(db, async (tx) => {
          const requestRef = doc(db, 'swapRequests', requestId);
          const requestSnap = await tx.get(requestRef);
          
          if(!requestSnap.exists()) {
            throw new Error('الطلب غير موجود');
          }
          
          const request = requestSnap.data();
          
          // Check if this head is authorized to approve at this stage
          if(request.status === 'pending_head_from' && request.fromHeadUid === headUid) {
            // First stage approval
            if(request.fromDepartment === request.toDepartment || request.toHeadUid === request.fromHeadUid) {
              // Same department or same head - final approval
              tx.update(requestRef, {
                status: 'accepted',
                respondedAt: serverTimestamp()
              });
              
              // Create override(s) immediately
              await createOverridesInTransaction(tx, request, requestId);
            } else {
              // Different departments - move to second stage
              tx.update(requestRef, {
                status: 'pending_head_to',
                respondedAt: serverTimestamp()
              });
              // Don't create overrides yet
            }
          } else if(request.status === 'pending_head_to' && request.toHeadUid === headUid) {
            // Second stage approval - final approval
            tx.update(requestRef, {
              status: 'accepted',
              respondedAt: serverTimestamp()
            });
            
            // Create override(s)
            await createOverridesInTransaction(tx, request, requestId);
          } else {
            throw new Error('غير مصرح لك بالموافقة على هذا الطلب في هذه المرحلة');
          }
        });
        
        toast({
          title: 'تم القبول',
          text: 'تمت الموافقة على الطلب بنجاح.',
          icon: 'fa-circle-check'
        });
        
        if(currentView === 'today' && activeTodayISO === kuwaitTodayISO()){
          loadTodayForHead();
        } else if (currentView === 'week') {
          loadWeekForHead();
        }
        
      } catch (error) {
        console.error('Error approving request:', error);
        toast({
          title: 'خطأ',
          text: error.message || 'تعذّر تنفيذ العملية.',
          icon: 'fa-triangle-exclamation'
        });
      }
    }

    async function handleRequestDeny(requestId){
      try {
        const requestRef = doc(db, 'swapRequests', requestId);
        const requestSnap = await getDoc(requestRef);
        
        if(!requestSnap.exists()) return;
        
        const request = requestSnap.data();
        
        // Check if this head is authorized to deny
        if((request.status === 'pending_head_from' && request.fromHeadUid === headUid) ||
           (request.status === 'pending_head_to' && request.toHeadUid === headUid)) {
          
          await updateDoc(requestRef, {
            status: 'denied',
            respondedAt: serverTimestamp()
          });
          
          toast({
            title: 'تم الرفض',
            text: 'تم رفض الطلب.',
            icon: 'fa-circle-xmark'
          });
        } else {
          toast({
            title: 'غير مصرح',
            text: 'غير مصرح لك برفض هذا الطلب.',
            icon: 'fa-circle-exclamation'
          });
        }
        
      } catch (error) {
        console.error('Error denying request:', error);
        toast({
          title: 'خطأ',
          text: 'تعذّر تنفيذ العملية.',
          icon: 'fa-triangle-exclamation'
        });
      }
    }

    async function createOverridesInTransaction(tx, request, requestId){
      const fromDate = request.fromDate || request.date;
      const fromLesson = Number(request.fromLesson || request.lesson);

      if(request.type === 'cover') {
        const overrideId = `cover_${fromDate}_${fromLesson}_${request.fromTeacherUid}_${request.toTeacherUid}`;
        const overrideRef = doc(db, 'scheduleOverrides', overrideId);
        
        tx.set(overrideRef, {
          date: fromDate,
          lesson: fromLesson,
          classKey: request.fromClassKey,
          originalTeacherUid: request.fromTeacherUid,
          newTeacherUid: request.toTeacherUid,
          active: true,
          createdAt: serverTimestamp(),
          sourceRequestId: requestId,
          type: 'cover'
        }, { merge: true });
        
      } else if(request.type === 'swap') {
        const toDate = request.toDate || fromDate;
        const toLesson = Number(request.toLesson || request.lesson);

        const overrideId1 = `swapA_${fromDate}_${fromLesson}_${request.fromTeacherUid}_${request.toTeacherUid}`;
        const overrideRef1 = doc(db, 'scheduleOverrides', overrideId1);
        
        tx.set(overrideRef1, {
          date: fromDate,
          lesson: fromLesson,
          classKey: request.fromClassKey,
          originalTeacherUid: request.fromTeacherUid,
          newTeacherUid: request.toTeacherUid,
          active: true,
          createdAt: serverTimestamp(),
          sourceRequestId: requestId,
          type: 'swap'
        }, { merge: true });
        
        const toClassKey = request.toClassKey || '—';
        
        const overrideId2 = `swapB_${toDate}_${toLesson}_${request.toTeacherUid}_${request.fromTeacherUid}`;
        const overrideRef2 = doc(db, 'scheduleOverrides', overrideId2);
        
        tx.set(overrideRef2, {
          date: toDate,
          lesson: toLesson,
          classKey: toClassKey,
          originalTeacherUid: request.toTeacherUid,
          newTeacherUid: request.fromTeacherUid,
          active: true,
          createdAt: serverTimestamp(),
          sourceRequestId: requestId,
          type: 'swap'
        }, { merge: true });
      }
    }

    /* ========= More Sheet ========= */
    async function loadWeekForClass(classKey){
      classWeekGrid.innerHTML = '';
      showStatus('جاري تحميل جدول الفصل المختار...', false);

      if (cache.classWeek.has(classKey)) {
        renderClassWeekGrid(cache.classWeek.get(classKey));
        clearStatus();
        return;
      }

      const map = new Map();
      const {grade, section, track} = parseClassKey(classKey);

      try{
        for(const iso of weekDates){ map.set(iso, new Map()); }

        const snap = await getDocs(query(
          collection(db,'schedules'),
          where('grade','==', String(grade)),
          where('section','==', String(section)),
          ...(track ? [where('track','==', track)] : []),
          where('date','in', weekDates)
        ));
        snap.forEach(d=>{
          const x=d.data();
          const iso = x.date;
          if (!map.has(iso)) map.set(iso, new Map());
          map.get(iso).set(Number(x.lesson), x.subject || '—');
        });

        // Apply overrides
        const qOv = query(
          collection(db,'scheduleOverrides'),
          where('classKey','==', classKey),
          where('active','==', true),
          where('date','in', weekDates)
        );
        const ovSnap = await getDocs(qOv);
        const nameCache = new Map();
        for(const d of ovSnap.docs){
          const x = d.data();
          const iso = x.date;
          if(!iso || !map.has(iso)) continue;

          let tName = nameCache.get(x.newTeacherUid);
          if(!tName){
            tName = await getHeadName(x.newTeacherUid);
            nameCache.set(x.newTeacherUid, tName);
          }

          map.get(iso).set(Number(x.lesson), `بديل (${tName})`);
        }

        cache.classWeek.set(classKey, map);
      }catch(e){
        console.error(e);
        showStatus('تعذّر تحميل جدول الفصل.', true);
      }

      renderClassWeekGrid(map);
      clearStatus();
    }

    function renderClassWeekGrid(map){
      classWeekGrid.innerHTML = '';
      renderWeekHeaders(classWeekGrid);
      for(let r=0;r<5;r++){
        const iso = weekDates[r];

        const dayCell = document.createElement('div');
        dayCell.className='gcell day-col';
        dayCell.innerHTML = `<div style="font-weight:900">${DAYS_AR[r]}</div><div class="small">${iso}</div>`;
        classWeekGrid.appendChild(dayCell);

        for(let i=1;i<=FIXED_LESSON_COUNT;i++){
          const c = document.createElement('div');
          c.className='gcell';
          const row = map.get(iso);
          const cellContent = row ? (row.get(i) || '—') : '—';
          c.textContent = cellContent;
          if (cellContent && cellContent !== '—') c.classList.add('lesson-highlight');
          classWeekGrid.appendChild(c);
        }
      }
    }

    function openMoreSheet(){
      moreSheet.classList.add('open');
      moreSheet.setAttribute('aria-hidden','false');
      document.body.style.overflow = 'hidden';
    }

    function closeMoreSheet(){
      moreSheet.classList.remove('open');
      moreSheet.setAttribute('aria-hidden','true');
      document.body.style.overflow = '';
    }

    /* ========= Init ========= */
    function initWeek(){
      const today = kuwaitTodayISO();
      const start = startOfWeekSunday(today);
      weekDates = [0,1,2,3,4].map(n => addDaysISO(start, n));
      cache.weekKey = start;
      weekLabel.innerHTML = `<i class="far fa-calendar"></i> أسبوع: ${start} → ${weekDates[4]}`;
    }

    function initClassPicker(){
      CLASS_OPTIONS.forEach((c)=>{
        const opt = document.createElement('option');
        opt.value = c;
        opt.textContent = c;
        classPicker.appendChild(opt);
      });
    }

    /* ========= Event Listeners ========= */
    btnRequests.addEventListener('click', openRequestsSheet);
    closeRequests.addEventListener('click', closeRequestsSheet);
    
    btnToday.addEventListener('click', async ()=>{
      if(!headUid) return;
      setFilterActive(btnToday);
      await loadTodayForHead();
    });

    btnWeek.addEventListener('click', async ()=>{
      if(!headUid) return;
      setFilterActive(btnWeek);
      await loadWeekForHead();
    });

    btnMore.addEventListener('click', openMoreSheet);
    closeMore.addEventListener('click', closeMoreSheet);

    classPicker.addEventListener('change', async ()=>{
      const v = classPicker.value;
      if(!v){
        classWeekGrid.innerHTML = '';
        return;
      }
      await loadWeekForClass(v);
    });

    /* ========= Auth & Main Init ========= */
    setPersistence(auth, browserLocalPersistence).catch(()=>{});

    onAuthStateChanged(auth, async (user)=>{
      if(!user){
        currentUser = null;
        showStatus('الرجاء تسجيل الدخول أولاً.', true);
        containerMain.innerHTML = '<div style="text-align:center; padding:40px; color:var(--danger); font-weight:900;">هذه الصفحة خاصة برؤساء الأقسام فقط</div>';
        [btnRequests, btnToday, btnWeek, btnMore].forEach(b => b.setAttribute('disabled', 'disabled'));
        return;
      }

      currentUser = user;

      try{
        const snap = await getDoc(doc(db,'teachers', user.uid));
        if(snap.exists()){
          const data = snap.data();
          const role = (data.role || '').toString().toLowerCase();
          
          if(role !== 'head'){
            showStatus('هذه الصفحة خاصة برؤساء الأقسام فقط.', true);
            containerMain.innerHTML = '<div style="text-align:center; padding:40px; color:var(--danger); font-weight:900;">عذراً، يجب أن تكون رئيس قسم للوصول إلى هذه الصفحة</div>';
            [btnRequests, btnToday, btnWeek, btnMore].forEach(b => b.setAttribute('disabled', 'disabled'));
            return;
          }
          
          // User is a head
          currentHead = {
            uid: user.uid,
            name: displayTeacherNameFromDoc(data),
            subject: resolveDepartmentName(data.department || data.dept || data.subject || '')
          };
          headUid = user.uid;
          headSubject = currentHead.subject;
          
          meNameEl.textContent = currentHead.name;
          meBadge.style.display = 'inline-flex';
          
          departmentName.textContent = headSubject;
          departmentBadge.style.display = 'inline-flex';
          
          // Enable buttons
          [btnRequests, btnToday, btnWeek, btnMore].forEach(b => b.removeAttribute('disabled'));
          
          setupBreaksListener();
          initWeek();
          initClassPicker();
          
          setFilterActive(btnToday);
          await loadTodayForHead();
          
        } else {
          showStatus('لم يتم العثور على ملفك الشخصي.', true);
          containerMain.innerHTML = '<div style="text-align:center; padding:40px; color:var(--danger); font-weight:900;">هذه الصفحة خاصة برؤساء الأقسام فقط</div>';
          [btnRequests, btnToday, btnWeek, btnMore].forEach(b => b.setAttribute('disabled', 'disabled'));
        }
      }catch(e){
        console.error(e);
        showStatus('حدث خطأ في تحميل البيانات.', true);
      }
    });
  </script>
