  <style>
    :root {
      --primary: #033C54;
      --primary-light: #065372;
      --primary-lighter: #E8F4FC;
      --secondary: #2e8bc0;
      --accent: #0a5f80;
      --bg: #f9fbfd;
      --card: #ffffff;
      --text: #0f172a;
      --text-light: #4a6572;
      --muted: #64748b;
      --border: #e1e8f0;
      --focus: rgba(3, 60, 84, 0.15);
      --success: #0f8a4b;
      --error: #b91c1c;
      --shadow-sm: 0 2px 8px rgba(3, 60, 84, 0.08);
      --shadow-md: 0 6px 16px rgba(3, 60, 84, 0.12);
      --shadow-lg: 0 15px 35px rgba(3, 60, 84, 0.18);
      --radius-sm: 8px;
      --radius-md: 12px;
      --radius-lg: 16px;
      --radius-xl: 24px;
      --transition: transform .12s ease, box-shadow .12s ease, background-color .12s ease, border-color .12s ease, color .12s ease, opacity .12s ease;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    html, body {
      height: 100%;
      font-family: "Tajawal", system-ui, -apple-system, "Segoe UI", Roboto, Arial, sans-serif;
      background: var(--bg);
      color: var(--text);
    }

    body {
      display: flex;
      flex-direction: column;
      min-height: 100vh;
      background: linear-gradient(135deg, #f3f9fd 0%, #e6f2fa 100%);
      overflow-x: hidden;
    }

    /* Header */
    .site-header {
      position: sticky;
      top: 0;
      z-index: 50;
      background: rgba(255, 255, 255, 0.92);
      backdrop-filter: blur(8px);
      -webkit-backdrop-filter: blur(8px);
      padding: 1rem 1.5rem;
      display: flex;
      align-items: center;
      justify-content: center;
      box-shadow: var(--shadow-sm);
      border-bottom: 1px solid rgba(3, 60, 84, 0.08);
    }

    .site-title {
      margin: 0;
      font-weight: 900;
      font-size: clamp(1.25rem, 4vw, 1.7rem);
      color: var(--primary);
      text-align: center;
      line-height: 1.4;
    }

    /* Main Content */
    .main-container {
      flex: 1;
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: center;
      padding: 2rem 1rem;
      width: 100%;
    }

    /* Login Card — one white card: logo, title, the two fields, تذكرني,
       and the button, on an even vertical rhythm. */
    .login-card {
      width: 100%;
      max-width: 420px;
      background: var(--card);
      border-radius: var(--radius-xl);
      box-shadow: 0 1px 2px rgba(3, 60, 84, 0.06), 0 18px 40px rgba(3, 60, 84, 0.12);
      border: 1px solid rgba(3, 60, 84, 0.06);
      padding: 32px 28px 28px;
    }

    .card-head {
      display: flex;
      flex-direction: column;
      align-items: center;
      text-align: center;
      margin-bottom: 26px;
    }

    .card-logo {
      display: block;
      width: auto;
      height: 64px;
      max-width: 180px;
      object-fit: contain;
      margin-bottom: 18px;
    }

    .card-title {
      margin: 0;
      font-size: 1.45rem;
      font-weight: 900;
      color: var(--primary);
      line-height: 1.3;
    }

    .card-sub {
      margin: 6px 0 0;
      color: var(--muted);
      font-size: 0.92rem;
      font-weight: 500;
    }

    /* Form Elements */
    .form-group + .form-group {
      margin-top: 18px;
    }

    .form-label {
      display: block;
      margin-bottom: 8px;
      font-weight: 800;
      color: var(--text);
      font-size: 0.92rem;
    }

    .input-container {
      position: relative;
      height: 54px;
      border-radius: 14px;
      border: 1.5px solid var(--border);
      background: #fbfdff;
      transition: var(--transition);
      display: flex;
      align-items: center;
    }

    .input-container:hover {
      border-color: #cbd8e4;
    }

    .input-container:focus-within {
      border-color: var(--primary);
      background: #fff;
      box-shadow: 0 0 0 4px var(--focus);
    }

    .input-icon {
      width: 48px;
      height: 100%;
      display: flex;
      align-items: center;
      justify-content: center;
      color: #94a3b8;
      font-size: 1rem;
      flex-shrink: 0;
      transition: color .15s ease;
    }

    .input-container:focus-within .input-icon {
      color: var(--primary);
    }

    .form-input {
      flex: 1;
      min-width: 0;
      height: 100%;
      padding: 0 4px 0 14px;
      border: none;
      background: transparent;
      color: var(--text);
      font-family: inherit;
      font-size: 1.02rem;
      font-weight: 600;
      outline: none;
      caret-color: var(--primary);
    }

    .form-input::placeholder {
      color: #a3b1c2;
      font-weight: 500;
    }

    .password-toggle {
      width: 48px;
      height: 100%;
      display: flex;
      align-items: center;
      justify-content: center;
      color: #94a3b8;
      background: transparent;
      border: none;
      border-radius: 0 12px 12px 0;
      cursor: pointer;
      transition: var(--transition);
      flex-shrink: 0;
    }

    .password-toggle:hover {
      color: var(--primary);
    }

    .password-toggle:focus-visible {
      outline: 2px solid var(--primary);
      outline-offset: -4px;
    }

    .btn-login {
      width: 100%;
      height: 54px;
      border: none;
      border-radius: 14px;
      background: linear-gradient(to right, var(--primary), var(--accent));
      color: white;
      font-family: "Tajawal", system-ui, -apple-system, "Segoe UI", Roboto, Arial, sans-serif;
      font-weight: 800;
      font-size: 1.08rem;
      cursor: pointer;
      transition: var(--transition);
      box-shadow: 0 8px 20px rgba(3, 60, 84, 0.25);
      position: relative;
      overflow: hidden;
      margin-top: 22px;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 10px;
    }

    .btn-login::before {
      content: '';
      position: absolute;
      top: 0;
      left: -100%;
      width: 100%;
      height: 100%;
      background: linear-gradient(90deg, transparent, rgba(255, 255, 255, 0.2), transparent);
      transition: 0.5s;
    }

    .btn-login:hover {
      box-shadow: 0 10px 24px rgba(3, 60, 84, 0.32);
      transform: translateY(-1px);
    }

    .btn-login:hover::before {
      left: 100%;
    }

    .btn-login:active {
      transform: translateY(0);
    }

    .btn-login:disabled {
      cursor: progress;
      opacity: .85;
      transform: none;
    }

    .btn-login:focus-visible {
      outline: 3px solid rgba(3, 60, 84, 0.35);
      outline-offset: 3px;
    }

    .remember-me {
      display: inline-flex;
      align-items: center;
      gap: 10px;
      user-select: none;
      cursor: pointer;
      color: var(--text);
      font-weight: 700;
      font-size: 0.95rem;
      transition: var(--transition);
      padding: 6px 8px;
      margin: 16px -8px 0;
      border-radius: 10px;
    }

    .remember-me:hover {
      background: var(--primary-lighter);
    }

    .remember-me:focus-visible {
      outline: 2px solid var(--primary);
      outline-offset: 2px;
    }

    .checkmark {
      width: 22px;
      height: 22px;
      border-radius: 7px;
      border: 2px solid #b8c7d6;
      background: #fff;
      display: flex;
      align-items: center;
      justify-content: center;
      color: transparent;
      font-size: 13px;
      font-weight: 900;
      transition: var(--transition);
      flex-shrink: 0;
    }

    .remember-me:hover .checkmark {
      border-color: var(--primary);
    }

    .remember-me.active .checkmark {
      background: var(--primary);
      color: white;
      border-color: var(--primary);
    }

    /* Takes no space until there's something to say. */
    .message {
      display: none;
      font-size: 0.92rem;
      font-weight: 700;
      text-align: center;
      padding: 12px 14px;
      border-radius: 12px;
      margin-top: 16px;
      line-height: 1.6;
    }

    .message.show {
      display: block;
      animation: msgIn .25s ease;
    }

    @keyframes msgIn {
      from { opacity: 0; transform: translateY(-4px); }
      to { opacity: 1; transform: translateY(0); }
    }

    .message.error {
      color: var(--error);
      background: rgba(185, 28, 28, 0.07);
      border: 1px solid rgba(185, 28, 28, 0.18);
    }

    .message.success {
      color: var(--success);
      background: rgba(15, 138, 75, 0.07);
      border: 1px solid rgba(15, 138, 75, 0.18);
    }

    /* ===========================
       Loading Overlay
       =========================== */
    .loader-overlay {
      position: fixed;
      inset: 0;
      z-index: 9999;
      background: linear-gradient(135deg, #dff6ff 0%, #eaf6fb 100%);
      display: flex;
      align-items: center;
      justify-content: center;
      flex-direction: column;
      padding: 5vh 1rem;
      opacity: 0;
      visibility: hidden;
      overflow: hidden;
      transition: opacity 0.55s cubic-bezier(0.16, 1, 0.3, 1);
    }

    .loader-overlay.show {
      opacity: 1;
      visibility: visible;
    }

    /* .loader-overlay.leaving is intentionally not a rule here — it used
       to fade opacity to 0, which for its whole 0.4s duration made the
       overlay see-through right before the hard navigation, flashing the
       login form (and its still-visible "تم تسجيل الدخول بنجاح" message)
       back into view. The overlay now stays fully opaque throughout;
       only the content underneath gets a closing scale-down below. */
    .loader-overlay.leaving .loader-content {
      transition: transform 0.4s cubic-bezier(0.5, 0, 0.75, 0);
      transform: scale(calc(var(--loader-scale, 1) * 0.96));
    }

    .loader-main {
      transition: transform 0.65s cubic-bezier(0.22, 1, 0.36, 1);
      transform: translateY(0);
      transform-origin: center;
    }

    .loader-overlay.spinner-visible .loader-main {
      transform: translateY(-30px);
    }

    .loader-content {
      display: flex;
      flex-direction: column;
      align-items: center;
      padding: 20px;
      max-width: 90vw;
      text-align: center;
      transform: scale(var(--loader-scale, 1));
      transform-origin: center;
    }

    .loader-logo-container {
      width: 200px;
      height: 200px;
      margin-bottom: 24px;
      background: rgba(255, 255, 255, 0.4);
      backdrop-filter: blur(8px);
      -webkit-backdrop-filter: blur(8px);
      border-radius: 26px;
      display: flex;
      align-items: center;
      justify-content: center;
      box-shadow:
        0 8px 24px rgba(0, 0, 0, 0.1),
        0 2px 6px rgba(0, 0, 0, 0.06);
      animation: fadeUp 0.65s cubic-bezier(0.16, 1, 0.3, 1);
    }

    .loader-logo {
      width: 85%;
      height: 85%;
      object-fit: contain;
    }

    .loader-heading {
      font-family: "Tajawal", system-ui, -apple-system, "Segoe UI", Roboto, Arial, sans-serif;
      display: flex;
      flex-wrap: nowrap;
      white-space: nowrap;
      justify-content: center;
      align-items: center;
      text-align: center;
      color: #0c2d48;
      font-weight: 700;
      font-size: 26px;
      line-height: 1.5;
      letter-spacing: -0.5px;
      word-spacing: 4px;
      direction: rtl;
    }

    .loader-word {
      opacity: 0;
      transform: translateY(20px);
      animation: fadeWord 0.55s cubic-bezier(0.16, 1, 0.3, 1) forwards;
      margin: 0 3px;
      white-space: nowrap;
    }

    .loader-subtitle {
      height: 3px;
      width: 60%;
      border-radius: 2px;
      background: linear-gradient(90deg, #0c2d48, #2e8bc0, #0c2d48);
      margin-top: 14px;
      transform: scaleX(0);
      transform-origin: center;
      animation: growLine 0.75s 0.8s cubic-bezier(0.16, 1, 0.3, 1) forwards;
    }

    .loader-welcome {
      font-family: "Tajawal", system-ui, -apple-system, "Segoe UI", Roboto, Arial, sans-serif;
      font-weight: 700;
      color: #4a6572;
      font-size: 16px;
      margin-top: 22px;
      opacity: 0;
      transform: translateY(15px);
      transition: opacity 0.6s cubic-bezier(0.16, 1, 0.3, 1) 1.2s, transform 0.6s cubic-bezier(0.16, 1, 0.3, 1) 1.2s;
      direction: rtl;
      text-align: center;
      max-width: 90%;
      letter-spacing: -0.2px;
    }

    .loader-welcome.show {
      opacity: 1;
      transform: translateY(0);
    }

    .bar-spinner {
      width: 70px;
      height: 70px;
      position: absolute;
      bottom: var(--spinner-bottom, 80px);
      opacity: 0;
      transform: translateY(20px);
      transition: opacity 0.6s cubic-bezier(0.16, 1, 0.3, 1), transform 0.6s cubic-bezier(0.16, 1, 0.3, 1);
    }

    .loader-overlay.spinner-visible .bar-spinner {
      opacity: 1;
      transform: translateY(0);
    }

    .spinner-bar-rotate {
      position: absolute;
      width: 100%;
      height: 100%;
      transform: rotate(calc(var(--i) * 30deg));
    }

    .spinner-bar {
      position: absolute;
      top: 0;
      left: 50%;
      width: 4px;
      height: 18px;
      border-radius: 4px;
      transform: translateX(-50%);
      background: linear-gradient(to bottom, #0c2d48, #2e8bc0);
      box-shadow: 0 0 8px rgba(0, 50, 100, 0.3);
      animation: barPulse 1.2s infinite cubic-bezier(0.45, 0, 0.55, 1);
      animation-delay: calc(var(--i) * 0.07s);
    }

    /* Animations */
    @keyframes barPulse {
      0%, 100% { opacity: 0.2; }
      50% { opacity: 1; }
    }

    @keyframes fadeWord {
      from {
        opacity: 0;
        transform: translateY(20px);
      }
      to { opacity: 1; transform: translateY(0); }
    }

    @keyframes growLine {
      to { transform: scaleX(1); }
    }

    @keyframes fadeUp {
      from {
        opacity: 0;
        transform: translateY(10px) scale(0.9);
      }
      to {
        opacity: 1;
        transform: translateY(0) scale(1);
      }
    }

    /* Responsive adjustments */
    @media (max-width: 640px) {
      .login-card {
        padding: 28px 20px 22px;
      }

      .card-logo {
        height: 56px;
      }

      .site-header {
        padding: 1rem;
      }

      .login-card {
        max-width: 100%;
      }

      .loader-content {
        padding: 1.25rem;
      }

      .loader-welcome { font-size: 16px; }
    }

    @media (max-width: 480px) {
      .loader-overlay {
        padding-top: 12vh;
        padding-bottom: 10vh;
      }
    }

    /* Performance optimizations */
    .will-change {
      will-change: transform, opacity;
    }

    /* Reduced motion for accessibility */
    @media (prefers-reduced-motion: reduce) {
      * {
        animation-duration: 0.01ms !important;
        animation-iteration-count: 1 !important;
        transition-duration: 0.01ms !important;
      }
    }
  </style>
</head>
<body>
  <!-- Header -->
  <header class="site-header">
    <h1 class="site-title">ثانوية أحمد البشر الرومي</h1>
  </header>

  <!-- Main Content -->
  <main class="main-container">
    <div class="login-card">
      <div class="card-head">
        <img class="card-logo" src="/images/schoollogo.png" alt="شعار ثانوية أحمد البشر الرومي" width="1080" height="435">
        <h2 class="card-title">تسجيل الدخول</h2>
        <p class="card-sub">أدخل رقم المستخدم وكلمة المرور للمتابعة</p>
      </div>

      <div class="form-group">
        <label for="loginEmail" class="form-label">رقم المستخدم</label>
        <div class="input-container">
          <div class="input-icon" aria-hidden="true">
            <i class="fas fa-id-card"></i>
          </div>
          <input
            type="text"
            id="loginEmail"
            class="form-input"
            placeholder="مثال: 123456"
            autocomplete="off"
            inputmode="numeric"
            pattern="[0-9]*"
          >
        </div>
      </div>

      <div class="form-group">
        <label for="loginPassword" class="form-label">كلمة المرور</label>
        <div class="input-container">
          <div class="input-icon" aria-hidden="true">
            <i class="fas fa-lock"></i>
          </div>
          <input type="password" id="loginPassword" class="form-input" placeholder="••••••••" autocomplete="current-password">
          <button type="button" class="password-toggle" id="togglePassword" aria-label="إظهار كلمة المرور">
            <i class="fas fa-eye"></i>
          </button>
        </div>
      </div>

      <div id="rememberToggle" class="remember-me" role="checkbox" aria-checked="false" tabindex="0">
        <div class="checkmark" aria-hidden="true">✓</div>
        <div>تذكرني</div>
      </div>

      <button id="loginBtn" class="btn-login">دخول</button>

      <div id="msg" class="message" role="alert"></div>
    </div>
  </main>

  <!-- Loading Overlay -->
  <div id="loader" class="loader-overlay" aria-hidden="true">
    <div class="loader-main">
      <div class="loader-content">
        <div class="loader-logo-container">
          <img class="loader-logo" src="https://framerusercontent.com/images/aI1iHN9wVHJ3PyWbMpHkgJYWsqE.png" alt="شعار المدرسة">
        </div>

        <h2 id="loaderTitle" class="loader-heading" aria-label="ثانوية أحمد البشر الرومي"></h2>
        <div class="loader-subtitle"></div>
        <div id="loaderWelcome" class="loader-welcome"></div>
      </div>
    </div>

    <div id="barSpinner" class="bar-spinner" aria-hidden="true">
      <div class="spinner-bar-rotate" style="--i:0"><div class="spinner-bar" style="--i:0"></div></div>
      <div class="spinner-bar-rotate" style="--i:1"><div class="spinner-bar" style="--i:1"></div></div>
      <div class="spinner-bar-rotate" style="--i:2"><div class="spinner-bar" style="--i:2"></div></div>
      <div class="spinner-bar-rotate" style="--i:3"><div class="spinner-bar" style="--i:3"></div></div>
      <div class="spinner-bar-rotate" style="--i:4"><div class="spinner-bar" style="--i:4"></div></div>
      <div class="spinner-bar-rotate" style="--i:5"><div class="spinner-bar" style="--i:5"></div></div>
      <div class="spinner-bar-rotate" style="--i:6"><div class="spinner-bar" style="--i:6"></div></div>
      <div class="spinner-bar-rotate" style="--i:7"><div class="spinner-bar" style="--i:7"></div></div>
      <div class="spinner-bar-rotate" style="--i:8"><div class="spinner-bar" style="--i:8"></div></div>
      <div class="spinner-bar-rotate" style="--i:9"><div class="spinner-bar" style="--i:9"></div></div>
      <div class="spinner-bar-rotate" style="--i:10"><div class="spinner-bar" style="--i:10"></div></div>
      <div class="spinner-bar-rotate" style="--i:11"><div class="spinner-bar" style="--i:11"></div></div>
      </div>
  </div>

  <script type="module">
    import { firebaseConfig } from "./shared/firebase.js";
    // ===== Firebase SDKs (ES modules over CDN)
    import { initializeApp } from "./shared/firebase.js";
    import {
      getAuth,
      browserLocalPersistence,
      setPersistence,
      signInWithEmailAndPassword,
      onAuthStateChanged,
      signOut
    } from "./shared/firebase.js";
    import {
      getFirestore,
      doc,
      getDoc
    } from "./shared/firebase.js";

    // ===== Config
    

    // ===== Init
    const app  = initializeApp(firebaseConfig);
    const auth = getAuth(app);
    const db   = getFirestore(app);
    // Signed-in sessions always persist across browser restarts now (not
    // just when "تذكرني" is checked) — teachers stay logged in until they
    // explicitly log out, which is what actually ends the session
    // (signOut() clears it regardless of persistence mode). "تذكرني" below
    // is now purely about pre-filling رقم المستخدم on the next visit.
    setPersistence(auth, browserLocalPersistence).catch((e) => {
      console.error("setPersistence failed:", e);
    });

    // ===== UI refs
    const emailEl = document.getElementById('loginEmail'); // now holds civil id number
    const passEl  = document.getElementById('loginPassword');
    const loginBtn = document.getElementById('loginBtn');
    const msgEl = document.getElementById('msg');
    const togglePasswordBtn = document.getElementById('togglePassword');
    const eyeIcon = togglePasswordBtn.querySelector('i');
    const loader = document.getElementById('loader');
    const loaderTitle = document.getElementById('loaderTitle');
    const loaderWelcome = document.getElementById('loaderWelcome');
    function normalizeRole(value) {
      return (value || '').toString().trim().toLowerCase();
    }

    function isTruthyFlag(value) {
      return value === true || value === 'true' || value === 1 || value === '1';
    }

    function getRouteForProfile(profile) {
      const role = normalizeRole(profile?.role);
      if (role === 'admin') return './admins/adminpage.html';
      // Department heads use the same teachers hub as everyone else.
      if (role === 'head') return './teachers/user.html';
      // Supervisors land on the same teachers/user.html hub as everyone
      // else now — it recognizes isSupervisor itself and shows the extra
      // sidebar access, so there's no separate supervisor landing page.
      if (role === 'user') return './teachers/user.html';
      return null;
    }

    // Force numeric only for civil id input (works with paste too)
    function enforceDigitsOnly(inputEl) {
      inputEl.addEventListener('input', () => {
        const cleaned = inputEl.value.replace(/\D+/g, '');
        if (inputEl.value !== cleaned) inputEl.value = cleaned;
      });
    }
    enforceDigitsOnly(emailEl);

    // Build the real email used for Firebase auth
    function buildTeacherEmailFromCivilId(civilId) {
      const digits = (civilId || '').toString().replace(/\D+/g, '');
      return `t${digits}@gmail.com`;
    }

    // Remember me toggle
    const rememberToggle = document.getElementById('rememberToggle');
    let remember = false;

    function setRememberUI(state) {
      remember = state;
      rememberToggle.classList.toggle('active', state);
      rememberToggle.setAttribute('aria-checked', state ? 'true' : 'false');
    }

    rememberToggle.addEventListener('click', () => setRememberUI(!remember));
    rememberToggle.addEventListener('keydown', (e) => {
      if (e.key === 'Enter' || e.key === ' ') {
        e.preventDefault();
        setRememberUI(!remember);
      }
    });

    // Prefill from localStorage if previously remembered
    try {
      const saved = JSON.parse(localStorage.getItem('rememberLogin') || 'null');
      if (saved && saved.civilId) {
        emailEl.value = saved.civilId;
        setRememberUI(true);
        if (saved.password) {
          localStorage.setItem('rememberLogin', JSON.stringify({ civilId: saved.civilId }));
        }
      } else if (saved && saved.password) {
        localStorage.removeItem('rememberLogin');
      }
    } catch (e) {
      console.error("Error loading saved credentials:", e);
    }

    // Password visibility toggle
    let passwordVisible = false;
    function togglePasswordVisibility() {
      passwordVisible = !passwordVisible;
      passEl.type = passwordVisible ? 'text' : 'password';
      eyeIcon.className = passwordVisible ? 'fas fa-eye-slash' : 'fas fa-eye';
      togglePasswordBtn.setAttribute('aria-label', passwordVisible ? 'إخفاء كلمة المرور' : 'إظهار كلمة المرور');

      togglePasswordBtn.classList.add('will-change');
      setTimeout(() => {
        togglePasswordBtn.classList.remove('will-change');
      }, 300);
    }

    togglePasswordBtn.addEventListener('click', togglePasswordVisibility);

    // Helpers
    function showMsg(text, isSuccess = false) {
      if (text) {
        msgEl.textContent = text;
        msgEl.className = 'message ' + (isSuccess ? 'success' : 'error') + ' show';

        setTimeout(() => {
          msgEl.textContent = '';
          msgEl.className = 'message';
        }, 5000);
      } else {
        msgEl.textContent = '';
        msgEl.className = 'message';
      }
    }

    function validate() {
      const civilId = emailEl.value.trim();
      const pass = passEl.value;

      if (!civilId) return 'يرجى إدخال رقم المستخدم';
      if (!pass) return 'يرجى إدخال كلمة المرور';

      // Ensure digits only
      const digitsOnly = civilId.replace(/\D+/g, '');
      if (!digitsOnly) return 'يرجى إدخال رقم المستخدم بشكل صحيح';
      if (digitsOnly.length !== civilId.length) return 'يرجى إدخال أرقام فقط';

      return null;
    }

    // Loader overlay animation
    const loaderTitleText = 'ثانوية أحمد البشر الرومي';
    let spinnerTimer = null;
    let loaderShownAtMs = null;
    const REDIRECT_DELAY_MS = 2600; // hold time before the closing transition begins
    const EXIT_DURATION_MS = 400;   // closing transition, plays right before navigation
    let isLoginAttemptInProgress = false;
    let redirectScheduled = false;

    function setupLoaderHeading() {
      const words = loaderTitleText.split(/\s+/).filter(Boolean);
      loaderTitle.innerHTML = words
        .map((word, idx) => `<span class="loader-word" style="animation-delay:${(idx * 0.08 + 0.2).toFixed(2)}s">${word}</span>`)
        .join('');
    }

    function updateLoaderScale() {
      const width = window.innerWidth;
      const height = window.innerHeight;
      const isPhone = width < 480;
      const baseScale = Math.min(width / 375, height / 700);
      const scale = Math.min(1, Math.max(0.75, baseScale));
      loader.style.setProperty('--loader-scale', String(scale));
      loader.style.setProperty('--spinner-bottom', isPhone ? '7vh' : `${Math.round(80 * scale)}px`);
      fitLoaderHeading(scale);
    }

    // Keep the school name on a single line: shrink the font until it fits
    // the visible width (the content box is visually scaled by --loader-scale).
    function fitLoaderHeading(scale) {
      const base = 26;
      loaderTitle.style.fontSize = base + 'px';
      const available = (window.innerWidth - 32) / (scale || 1);
      const natural = loaderTitle.scrollWidth;
      if (natural > available && natural > 0) {
        loaderTitle.style.fontSize = Math.max(12, Math.floor(base * available / natural * 10) / 10) + 'px';
      }
    }

    setupLoaderHeading();
    updateLoaderScale();
    window.addEventListener('resize', updateLoaderScale);
    if (document.fonts?.ready) document.fonts.ready.then(updateLoaderScale);

    function setLoaderWelcomeName(name) {
      const safeName = (name || '').toString().trim();
      loaderWelcome.textContent = safeName ? `مرحباً، ${safeName}` : 'مرحباً';
    }

    function showLoader(name) {
      setLoaderWelcomeName(name);
      loaderWelcome.classList.add('show');
      loader.classList.remove('leaving');
      loader.classList.add('show');
      loader.classList.remove('spinner-visible');
      document.body.style.overflow = 'hidden';
      if (!loaderShownAtMs) loaderShownAtMs = Date.now();

      if (spinnerTimer) clearTimeout(spinnerTimer);
      spinnerTimer = setTimeout(() => {
        loader.classList.add('spinner-visible');
      }, 1200);
    }

    function hideLoader() {
      loader.classList.remove('show');
      loader.classList.remove('spinner-visible');
      loader.classList.remove('leaving');
      loaderWelcome.classList.remove('show');
      if (spinnerTimer) {
        clearTimeout(spinnerTimer);
        spinnerTimer = null;
      }
      loaderShownAtMs = null;
      document.body.style.overflow = '';
    }

    function getStoredAuthInfo() {
      try {
        const raw = sessionStorage.getItem('auth');
        return raw ? JSON.parse(raw) : null;
      } catch (e) {
        console.error("Stored auth parse error:", e);
        return null;
      }
    }

    // ---- Warm up the next page while the loader plays ----
    // Once the destination is known, the loader holds for REDIRECT_DELAY_MS
    // with the browser otherwise idle. That time now goes into fetching the
    // destination page and every same-origin file it pulls in — its CSS,
    // images, module scripts and everything those import — so they're
    // already in the HTTP cache when it loads. /shared/* and /images/* are
    // cacheable (see _headers), so the next page doesn't touch the network
    // for those at all; the rest come back as cheap revalidations.
    //
    // Fire-and-forget: nothing here is awaited by the redirect, so the
    // animation's timing is exactly what it was. Whatever hasn't finished
    // when the page navigates is simply dropped. Same-origin only — the
    // Firebase SDK and Font Awesome are already cached from this page, and
    // this page's CSP wouldn't allow fetching other origins anyway.
    const warmedUrls = new Set();
    const MAX_WARMED_FILES = 60; // a safety cap; a page uses ~15-25

    function sameOriginUrl(raw, base) {
      if (!raw) return null;
      try {
        const u = new URL(raw, base);
        return u.origin === location.origin ? u.href.split('#')[0] : null;
      } catch (e) {
        return null;
      }
    }

    function warmUrl(url) {
      if (!url || warmedUrls.has(url) || warmedUrls.size >= MAX_WARMED_FILES) return Promise.resolve(null);
      warmedUrls.add(url);
      return fetch(url, { credentials: 'same-origin' })
        .then((res) => (res.ok ? res : null))
        .catch(() => null);
    }

    // `import ... from "x"`, `export ... from "x"`, `import "x"`, `import("x")`.
    // A stray match inside a string or comment only costs one extra fetch.
    const IMPORT_SPECIFIER_RE = /(?:\bfrom\s*|\bimport\s*\(\s*|\bimport\s+)["']([^"']+)["']/g;
    function importedUrls(jsText, baseUrl) {
      const urls = [];
      for (const m of jsText.matchAll(IMPORT_SPECIFIER_RE)) {
        // Real module specifiers here are always paths; skipping anything else
        // avoids 404s from ordinary strings like "... from 'online'".
        if (!/^(?:\.{1,2}\/|\/)/.test(m[1])) continue;
        const u = sameOriginUrl(m[1], baseUrl);
        if (u) urls.push(u);
      }
      return urls;
    }

    async function warmModule(url) {
      const res = await warmUrl(url);
      if (!res) return;
      const text = await res.text();
      await Promise.all(importedUrls(text, url).map(warmModule));
    }

    async function warmDestination(route) {
      const pageUrl = sameOriginUrl(route, location.href);
      const res = await warmUrl(pageUrl);
      if (!res) return;
      const page = new DOMParser().parseFromString(await res.text(), 'text/html');
      const attr = (el) => el.getAttribute('href') || el.getAttribute('src');
      const jobs = [];

      page.querySelectorAll('link[rel~="stylesheet"], link[rel~="preload"], link[rel~="icon"], img[src], script[src]:not([type="module"])')
        .forEach((el) => jobs.push(warmUrl(sameOriginUrl(attr(el), pageUrl))));
      page.querySelectorAll('link[rel="modulepreload"], script[type="module"][src]')
        .forEach((el) => {
          const u = sameOriginUrl(attr(el), pageUrl);
          if (u) jobs.push(warmModule(u));
        });
      page.querySelectorAll('script[type="module"]:not([src])')
        .forEach((el) => importedUrls(el.textContent, pageUrl).forEach((u) => jobs.push(warmModule(u))));

      await Promise.all(jobs);
    }

    function warmNextPage(route) {
      if (route) warmDestination(route).catch(() => {});
    }

    const bootstrapAuth = getStoredAuthInfo();
    if (bootstrapAuth?.loggedIn) {
      showLoader(bootstrapAuth.name || '');
      // Already signed in: the route this session last went to is known
      // right now, before the profile lookup below confirms it.
      warmNextPage(bootstrapAuth.route);
    }

    async function getUserProfile(uid) {
      const profile = { name: null, subject: null, role: null, isSupervisor: false };
      if (!uid) return profile;

      try {
        const ref = doc(db, 'teachers', uid);
        const snap = await getDoc(ref);
        if (snap.exists()) {
          const d = snap.data();
          profile.name = d.name ?? null;
          profile.subject = d.subject ?? null;
          profile.role = d.role ?? null;
          profile.isSupervisor = d.isSupervisor ?? false;
        }
      } catch (e) {
        console.error("Profile lookup error:", e);
      }

      return profile;
    }

    function getFriendlyAuthError(error) {
      const code = error?.code || '';
      const invalidCodes = new Set([
        'auth/invalid-credential',
        'auth/wrong-password',
        'auth/user-not-found',
        'auth/invalid-email',
        'auth/missing-password'
      ]);

      if (invalidCodes.has(code)) return 'رقم المستخدم أو كلمة المرور غير صحيحة.';
      if (code === 'auth/too-many-requests') return 'تم تجاوز عدد المحاولات المسموح. حاول مرة أخرى بعد قليل.';
      if (code === 'app/unauthorized-profile') return 'هذا الحساب لا يملك صلاحية الوصول للمنصة.';
      if (code === 'auth/network-request-failed') return 'لا يوجد اتصال جيد بالإنترنت. يرجى المحاولة مرة أخرى.';
      return 'تعذر تسجيل الدخول حالياً. يرجى المحاولة مرة أخرى.';
    }

    function redirectToProfileRoute(profile) {
      const route = getRouteForProfile(profile);
      if (!route) {
        sessionStorage.removeItem('auth');
        hideLoader();
        showMsg(getFriendlyAuthError({ code: 'app/unauthorized-profile' }));
        signOut(auth).catch(() => {});
        return;
      }
      // Play a quick closing transition before the hard navigation, so the
      // animation resolves instead of being cut off mid-frame by the
      // browser unloading the page.
      loader.classList.add('leaving');
      setTimeout(() => {
        window.location.href = route;
      }, EXIT_DURATION_MS);
    }

    function startLoaderThenRedirect(profile) {
      if (redirectScheduled) return;
      redirectScheduled = true;

      const safeProfile = profile || {};
      showLoader(safeProfile.name);

      setTimeout(() => {
        redirectToProfileRoute(safeProfile);
      }, REDIRECT_DELAY_MS);
    }

    function scheduleRedirectWithElapsed(profile, startedAtMs) {
      if (redirectScheduled) return;
      redirectScheduled = true;

      const safeProfile = profile || {};
      const elapsedMs = Date.now() - (startedAtMs || Date.now());
      const remainingMs = Math.max(0, REDIRECT_DELAY_MS - elapsedMs);

      setTimeout(() => {
        redirectToProfileRoute(safeProfile);
      }, remainingMs);
    }


    // Login flow
    loginBtn.addEventListener('click', async () => {
      showMsg('');

      const err = validate();
      if (err) {
        showMsg(err);
        return;
      }

      const civilId = emailEl.value.trim();
      const password = passEl.value;

      // Convert civil id to the hidden email format for Firebase Auth
      const email = buildTeacherEmailFromCivilId(civilId);
      isLoginAttemptInProgress = true;

      try {
        loginBtn.innerHTML = '<i class="fas fa-spinner fa-spin"></i> جاري تسجيل الدخول';
        loginBtn.disabled = true;

        const cred = await signInWithEmailAndPassword(auth, email, password);

        const uid = cred.user.uid;
        const profile = await getUserProfile(uid);
        const route = getRouteForProfile(profile);
        if (!route) {
          await signOut(auth);
          throw { code: 'app/unauthorized-profile' };
        }
        warmNextPage(route);

        const authInfo = {
          loggedIn: true,
          uid,
          name: profile.name,
          role: profile.role,
          isSupervisor: profile.isSupervisor,
          route,
          ts: Date.now()
        };
        sessionStorage.setItem('auth', JSON.stringify(authInfo));

        if (remember) {
          localStorage.setItem('rememberLogin', JSON.stringify({ civilId }));
        } else {
          localStorage.removeItem('rememberLogin');
        }

        // The loader overlay takes over the screen immediately and already
        // greets the user by name — a form message here would only ever be
        // seen if the overlay failed to stay opaque, so there's no reason
        // to set one up in the first place.
        startLoaderThenRedirect(profile);
      } catch (e) {
        console.error("Login error:", e);
        passEl.value = '';
        showMsg(getFriendlyAuthError(e));
      } finally {
        loginBtn.innerHTML = 'دخول';
        isLoginAttemptInProgress = false;
        loginBtn.disabled = false;
      }
    });

    onAuthStateChanged(auth, async (user) => {
      if (isLoginAttemptInProgress || redirectScheduled) return;

      if (!user) {
        if (loader.classList.contains('show')) {
          hideLoader();
        }
        return;
      }

      const flowStartedAt = loaderShownAtMs || Date.now();
      const storedAuth = getStoredAuthInfo();
      if (!loader.classList.contains('show')) {
        showLoader(storedAuth?.name || '');
      }

      const profile = await getUserProfile(user.uid);
      const route = getRouteForProfile(profile);
      if (!route) {
        sessionStorage.removeItem('auth');
        hideLoader();
        showMsg(getFriendlyAuthError({ code: 'app/unauthorized-profile' }));
        await signOut(auth).catch(() => {});
        return;
      }
      // Usually a no-op (the bootstrap above already started on this
      // route); covers a first visit or a role that changed since.
      warmNextPage(route);

      const authInfo = {
        loggedIn: true,
        uid: user.uid,
        name: profile.name,
        role: profile.role,
        isSupervisor: profile.isSupervisor,
        route,
        ts: Date.now()
      };
      sessionStorage.setItem('auth', JSON.stringify(authInfo));
      setLoaderWelcomeName(profile.name || storedAuth?.name || '');

      scheduleRedirectWithElapsed(profile, flowStartedAt);
    });

    document.querySelectorAll('.form-input').forEach(input => {
      input.addEventListener('focus', () => {
        input.parentElement.classList.add('will-change');
      });

      input.addEventListener('blur', () => {
        input.parentElement.classList.remove('will-change');
      });
    });

    document.addEventListener('keydown', (e) => {
      if (e.key === 'Enter' && !loginBtn.disabled) {
        loginBtn.click();
      }
    });
  </script>
  <script src="./shared/prefetch-nav.js" defer></script>
  <script src="./name-glow.js" defer></script>
</body>
</html>
