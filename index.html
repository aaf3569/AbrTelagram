  <style>
    :root {
      --primary: #033C54;
      --primary-light: #065372;
      --primary-lighter: #E8F4FC;
      --secondary: #2e8bc0;
      --accent: #0a5f80;
      --bg: #f9fbfd;
      --card: #ffffff;
      --text: #0f172a;
      --text-light: #4a6572;
      --muted: #64748b;
      --border: #e1e8f0;
      --focus: rgba(3, 60, 84, 0.15);
      --success: #0f8a4b;
      --error: #b91c1c;
      --shadow-sm: 0 2px 8px rgba(3, 60, 84, 0.08);
      --shadow-md: 0 6px 16px rgba(3, 60, 84, 0.12);
      --shadow-lg: 0 15px 35px rgba(3, 60, 84, 0.18);
      --radius-sm: 8px;
      --radius-md: 12px;
      --radius-lg: 16px;
      --radius-xl: 24px;
      --transition: transform .12s ease, box-shadow .12s ease, background-color .12s ease, border-color .12s ease, color .12s ease, opacity .12s ease;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    html, body {
      height: 100%;
      font-family: "Tajawal", system-ui, -apple-system, "Segoe UI", Roboto, Arial, sans-serif;
      background: var(--bg);
      color: var(--text);
    }

    body {
      display: flex;
      flex-direction: column;
      min-height: 100vh;
      background: linear-gradient(135deg, #f3f9fd 0%, #e6f2fa 100%);
      overflow-x: hidden;
    }

    /* Header */
    .site-header {
      position: sticky;
      top: 0;
      z-index: 50;
      background: rgba(255, 255, 255, 0.92);
      backdrop-filter: blur(8px);
      -webkit-backdrop-filter: blur(8px);
      padding: 1rem 1.5rem;
      display: flex;
      align-items: center;
      justify-content: center;
      box-shadow: var(--shadow-sm);
      border-bottom: 1px solid rgba(3, 60, 84, 0.08);
    }

    .site-title {
      margin: 0;
      font-weight: 900;
      font-size: clamp(1.25rem, 4vw, 1.7rem);
      color: var(--primary);
      text-align: center;
      line-height: 1.4;
    }

    /* Main Content */
    .main-container {
      flex: 1;
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: center;
      padding: 2rem 1rem;
      width: 100%;
    }

    /* Login Card — the blue title band on top, then the two fields,
       تذكرني and the button on an even vertical rhythm. */
    .login-card {
      width: 100%;
      max-width: 420px;
      background: var(--card);
      border-radius: var(--radius-xl);
      box-shadow: 0 1px 2px rgba(3, 60, 84, 0.06), 0 18px 40px rgba(3, 60, 84, 0.12);
      border: 1px solid rgba(3, 60, 84, 0.06);
      overflow: hidden;
    }

    .card-header {
      background: linear-gradient(135deg, var(--primary) 0%, var(--accent) 100%);
      color: white;
      padding: 30px 24px;
      text-align: center;
    }

    .card-header h2 {
      margin: 0;
      font-size: 1.5rem;
      font-weight: 800;
      letter-spacing: 0.3px;
    }

    .card-body {
      padding: 36px 30px 34px;
    }

    /* Form Elements */
    .form-group + .form-group {
      margin-top: 30px;
    }

    .form-label {
      display: block;
      margin-bottom: 14px;
      font-weight: 700;
      color: var(--text);
      font-size: 1rem;
    }

    .input-container {
      position: relative;
      height: 66px;
      border-radius: 14px;
      border: 1.5px solid var(--border);
      background: #fff;
      transition: var(--transition);
      display: flex;
      align-items: center;
    }

    .input-container:hover {
      border-color: #cbd8e4;
    }

    .input-container:focus-within {
      border-color: var(--primary);
      background: #fff;
      box-shadow: 0 0 0 4px var(--focus);
    }

    .input-icon {
      width: 54px;
      height: 100%;
      display: flex;
      align-items: center;
      justify-content: center;
      color: var(--muted);
      font-size: 1rem;
      flex-shrink: 0;
      transition: color .15s ease;
    }

    .input-container:focus-within .input-icon {
      color: var(--primary);
    }

    .form-input {
      flex: 1;
      min-width: 0;
      height: 100%;
      padding: 0 4px 0 14px;
      border: none;
      background: transparent;
      color: var(--text);
      font-family: inherit;
      font-size: 1.05rem;
      font-weight: 500;
      outline: none;
      caret-color: var(--primary);
    }

    /* A field without a leading icon (كلمة المرور) still needs room at its start. */
    .input-container > .form-input:first-child {
      padding-inline-start: 18px;
    }

    .form-input::placeholder {
      color: #a3b1c2;
      font-weight: 500;
    }

    .password-toggle {
      width: 54px;
      height: 100%;
      display: flex;
      align-items: center;
      justify-content: center;
      color: #94a3b8;
      background: transparent;
      border: none;
      border-radius: 0 12px 12px 0;
      cursor: pointer;
      transition: var(--transition);
      flex-shrink: 0;
    }

    .password-toggle:hover {
      color: var(--primary);
    }

    .password-toggle:focus-visible {
      outline: 2px solid var(--primary);
      outline-offset: -4px;
    }

    .btn-login {
      width: 100%;
      height: 64px;
      border: none;
      border-radius: 14px;
      background: linear-gradient(to right, var(--primary), var(--accent));
      color: white;
      font-family: "Tajawal", system-ui, -apple-system, "Segoe UI", Roboto, Arial, sans-serif;
      font-weight: 800;
      font-size: 1.08rem;
      cursor: pointer;
      transition: var(--transition);
      box-shadow: 0 8px 20px rgba(3, 60, 84, 0.25);
      position: relative;
      overflow: hidden;
      margin-top: 32px;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 10px;
    }

    .btn-login::before {
      content: '';
      position: absolute;
      top: 0;
      left: -100%;
      width: 100%;
      height: 100%;
      background: linear-gradient(90deg, transparent, rgba(255, 255, 255, 0.2), transparent);
      transition: 0.5s;
    }

    .btn-login:hover {
      box-shadow: 0 10px 24px rgba(3, 60, 84, 0.32);
      transform: translateY(-1px);
    }

    .btn-login:hover::before {
      left: 100%;
    }

    .btn-login:active {
      transform: translateY(0);
    }

    .btn-login:disabled {
      cursor: progress;
      opacity: .85;
      transform: none;
    }

    .btn-login:focus-visible {
      outline: 3px solid rgba(3, 60, 84, 0.35);
      outline-offset: 3px;
    }

    .remember-me {
      display: inline-flex;
      align-items: center;
      gap: 10px;
      user-select: none;
      cursor: pointer;
      color: var(--text);
      font-weight: 500;
      font-size: 1.02rem;
      transition: var(--transition);
      padding: 6px 8px;
      margin: 30px -8px 0;
      border-radius: 10px;
    }

    .remember-me:hover {
      background: var(--primary-lighter);
    }

    .remember-me:focus-visible {
      outline: 2px solid var(--primary);
      outline-offset: 2px;
    }

    .checkmark {
      width: 22px;
      height: 22px;
      border-radius: 7px;
      border: 2px solid var(--primary);
      background: #fff;
      display: flex;
      align-items: center;
      justify-content: center;
      color: transparent;
      font-size: 13px;
      font-weight: 900;
      transition: var(--transition);
      flex-shrink: 0;
    }

    .remember-me:hover .checkmark {
      border-color: var(--primary);
    }

    .remember-me.active .checkmark {
      background: var(--primary);
      color: white;
      border-color: var(--primary);
    }

    /* Takes no space until there's something to say. */
    .message {
      display: none;
      font-size: 0.92rem;
      font-weight: 700;
      text-align: center;
      padding: 12px 14px;
      border-radius: 12px;
      margin-top: 18px;
      line-height: 1.6;
    }

    .message.show {
      display: block;
      animation: msgIn .25s ease;
    }

    @keyframes msgIn {
      from { opacity: 0; transform: translateY(-4px); }
      to { opacity: 1; transform: translateY(0); }
    }

    .message.error {
      color: var(--error);
      background: rgba(185, 28, 28, 0.07);
      border: 1px solid rgba(185, 28, 28, 0.18);
    }

    .message.success {
      color: var(--success);
      background: rgba(15, 138, 75, 0.07);
      border: 1px solid rgba(15, 138, 75, 0.18);
    }

    /* ===========================
       Loading Overlay — white→sky splash: the school emblem springs in,
       sparks burst, the greeting rises, the user's name pops in, and a
       navy "liquid" rises from the bottom as the loader. On the way out
       the liquid pulls up and off the top, dragging the next page's
       header up behind it into place, so that page loads in seamlessly.
       Every animation is keyed off .show, so it replays from the start
       each time the overlay opens (not once, invisibly, at page load).
       =========================== */
    .loader-overlay {
      --ld-navy-900: #032a3f;
      --ld-navy-800: #04344d;
      --ld-navy-700: #064562;
      --ld-teal: #0a5f80;
      --ld-ease: cubic-bezier(0.22, 1, 0.36, 1);
      position: fixed;
      inset: 0;
      z-index: 9999;
      overflow: hidden;
      background: linear-gradient(180deg, #ffffff 0%, #f3f8fc 55%, #e2eff8 100%);
      opacity: 0;
      visibility: hidden;
      transition: opacity 0.35s ease, visibility 0s linear 0.35s;
    }

    .loader-overlay.show {
      opacity: 1;
      visibility: visible;
      transition: opacity 0.35s ease;
    }

    /* Faint dot grid that fades toward the bottom */
    .loader-overlay::before {
      content: "";
      position: absolute;
      inset: 0;
      background-image: radial-gradient(#c9dfee 1.2px, transparent 1.3px);
      background-size: 22px 22px;
      -webkit-mask-image: linear-gradient(180deg, rgba(0,0,0,.9), transparent 70%);
      mask-image: linear-gradient(180deg, rgba(0,0,0,.9), transparent 70%);
      opacity: 0;
    }
    .loader-overlay.show::before { animation: loaderFadeIn 1s ease forwards; }

    .loader-center {
      position: absolute;
      inset-inline: 0;
      top: 42%;
      transform: translateY(-50%);
      display: flex;
      flex-direction: column;
      align-items: center;
      text-align: center;
      padding: 0 20px;
    }

    /* Emblem: a wide navy tile carrying the school's calligraphy logo */
    .loader-emblem {
      position: relative;
      width: clamp(196px, 58vw, 248px);
      aspect-ratio: 2.05 / 1;
      margin-bottom: 30px;
    }
    .loader-overlay.show .loader-emblem { animation: loaderFloat 3.2s 1.4s ease-in-out infinite; }

    .loader-tile {
      position: absolute;
      inset: 0;
      border-radius: 28px;
      background: linear-gradient(115deg, var(--ld-navy-800) 0%, var(--ld-teal) 100%);
      display: grid;
      place-items: center;
      overflow: hidden;
      box-shadow: 0 24px 44px -18px rgba(4, 52, 77, .7), inset 0 1px 0 rgba(255,255,255,.18);
      transform: scale(0) rotate(-12deg);
    }
    .loader-overlay.show .loader-tile { animation: loaderSpringIn .9s .15s cubic-bezier(.34, 1.56, .64, 1) forwards; }

    /* One soft highlight passes across the tile after it lands */
    .loader-tile::after {
      content: "";
      position: absolute;
      inset: -20% auto -20% 0;
      width: 40%;
      background: linear-gradient(100deg, transparent, rgba(255,255,255,.22), transparent);
      transform: translateX(-160%) skewX(-18deg);
    }
    .loader-overlay.show .loader-tile::after { animation: loaderShine 1.1s 1.05s ease-in-out forwards; }

    .loader-logo {
      position: relative;
      width: 84%;
      height: auto;
      opacity: 0;
      transform: scale(.9);
    }
    .loader-overlay.show .loader-logo { animation: loaderLogoIn .6s .55s var(--ld-ease) forwards; }

    .loader-ring {
      position: absolute;
      inset: -14px;
      border-radius: 38px;
      border: 2px solid rgba(14, 115, 153, .25);
      opacity: 0;
    }
    .loader-overlay.show .loader-ring { animation: loaderRingPulse 2.2s .7s ease-out infinite; }

    .loader-spark {
      position: absolute;
      top: 50%;
      left: 50%;
      width: 9px;
      height: 9px;
      margin: -4.5px;
      border-radius: 50%;
      background: #2a9fd0;
      opacity: 0;
    }
    .loader-spark:nth-of-type(odd) { background: var(--ld-teal); }
    .loader-spark.sm { width: 6px; height: 6px; margin: -3px; }
    .loader-overlay.show .loader-spark { animation: loaderSpark .85s .55s cubic-bezier(.2, .8, .3, 1) forwards; }

    .loader-mask { overflow: hidden; padding: 4px 8px 6px; }
    .loader-title {
      font-size: clamp(1.6rem, 8vw, 2.1rem);
      font-weight: 900;
      line-height: 1.3;
      color: var(--ld-navy-800);
      transform: translateY(110%);
    }
    .loader-overlay.show .loader-title { animation: loaderRise .8s .5s cubic-bezier(.2, .9, .25, 1) forwards; }

    /* The user's name, in a pill under the greeting */
    .loader-pill {
      display: inline-flex;
      align-items: center;
      gap: 8px;
      max-width: min(92vw, 460px);
      margin-top: 12px;
      padding: 8px 18px;
      border-radius: 999px;
      background: #fff;
      border: 1px solid #d6e6f1;
      box-shadow: 0 8px 20px -12px rgba(4, 52, 77, .35);
      color: var(--ld-teal);
      font-weight: 800;
      font-size: 1.02rem;
      line-height: 1.5;
      opacity: 0;
      transform: translateY(8px) scale(.94);
    }
    .loader-pill[hidden] { display: none; }
    .loader-pill i { font-size: 1.15rem; flex-shrink: 0; }
    .loader-overlay.show .loader-pill { animation: loaderPillIn .6s .75s var(--ld-ease) forwards; }

    /* The next page's background colour, faded in under the liquid on the
       way out (teachers' page; .to-admin swaps in the admin page's) */
    .loader-reveal {
      position: absolute;
      inset: 0;
      background: #f8fafc;
      opacity: 0;
    }

    /* Liquid: rises as the loader, bobs while waiting */
    .loader-liquid {
      position: absolute;
      inset-inline: 0;
      bottom: 0;
      height: 100%;
      transform: translateY(100%);
    }
    .loader-overlay.show .loader-liquid {
      animation:
        loaderFill 1.6s .2s cubic-bezier(.3, .7, .2, 1) forwards,
        loaderBob 2.6s 1.8s ease-in-out infinite alternate;
    }
    .loader-liquid-body {
      position: absolute;
      inset: 0;
      background: linear-gradient(180deg, var(--ld-navy-800) 0%, var(--ld-navy-700) 35%, var(--ld-teal) 100%);
    }
    .loader-wave {
      position: absolute;
      left: 0;
      bottom: calc(100% - 2px);
      width: 200%;
      height: 46px;
    }
    .loader-wave.front { fill: var(--ld-navy-800); }
    .loader-wave.back { fill: #2a9fd0; opacity: .35; height: 58px; }
    .loader-overlay.show .loader-wave.front { animation: loaderWaveX 5s linear infinite; }
    .loader-overlay.show .loader-wave.back { animation: loaderWaveX 8s linear infinite reverse; }

    /* The destination page's header, hanging off the liquid's bottom edge.
       It's off-screen while the liquid bobs; the exit sweep drags it up and
       parks it at the very top, exactly where the next page draws its own
       header. Default = teachers/user.html's header; .to-admin below
       copies admins/adminpage.html's instead. */
    .loader-header {
      position: absolute;
      top: 100%;
      left: 0;
      right: 0;
      background: rgba(255, 255, 255, 0.85);
      border-bottom: 1px solid rgba(2, 43, 66, 0.08);
      box-shadow: 0 6px 18px rgba(2, 43, 66, 0.12);
      padding: 16px 20px;
      line-height: 1.6;
    }
    .loader-header-inner {
      max-width: 1200px;
      margin: 0 auto;
      position: relative;
      display: flex;
      justify-content: center;
      align-items: center;
      min-height: 44px;
    }
    .loader-header-btn {
      position: absolute;
      right: 0;
      top: 50%;
      transform: translateY(-50%);
      width: 44px;
      height: 44px;
      border-radius: 12px;
      border: 1px solid rgba(2, 43, 66, 0.2);
      background: #fff;
      color: #022b42;
      font-size: 1.05rem;
      box-shadow: 0 4px 12px rgba(2, 43, 66, 0.08);
      display: inline-flex;
      align-items: center;
      justify-content: center;
    }
    .loader-header-logo { display: none; }
    .loader-header-title {
      font-weight: 900;
      font-size: clamp(1.2rem, 2.5vw, 1.5rem);
      color: #022b42;
      text-align: center;
      padding: 0 60px 0 16px;
      white-space: nowrap;
    }
    @media (max-width: 768px) {
      .loader-overlay:not(.to-admin) .loader-header { padding: 14px 16px; }
      .loader-overlay:not(.to-admin) .loader-header-title { font-size: clamp(0.7rem, calc(7vw - 8px), 1.2rem); }
    }

    /* admins/adminpage.html header */
    .loader-overlay.to-admin .loader-reveal { background: #f6f8fb; }
    .loader-overlay.to-admin .loader-header {
      display: flex;
      align-items: center;
      justify-content: center;
      background: rgba(255, 255, 255, 0.68);
      border-bottom-color: rgba(3, 60, 84, 0.08);
      box-shadow: 0 2px 10px rgba(3, 60, 84, 0.06);
      line-height: normal;
    }
    .loader-overlay.to-admin .loader-header-inner { display: contents; }
    .loader-overlay.to-admin .loader-header-btn {
      right: 14px;
      width: 42px;
      height: 42px;
      border-color: rgba(3, 60, 84, 0.2);
      color: #033C54;
      box-shadow: 0 8px 22px rgba(3, 60, 84, 0.14);
    }
    .loader-overlay.to-admin .loader-header-title {
      padding: 0;
      color: #033C54;
      font-size: clamp(1.1rem, 2.4vw, 1.5rem);
      text-shadow: 0 1px 0 rgba(255, 255, 255, .6);
    }
    @media (max-width: 480px) {
      .loader-overlay.to-admin .loader-header { padding-inline: 64px; }
      .loader-overlay.to-admin .loader-header-title {
        font-size: clamp(1rem, 5vw, 1.25rem);
        overflow: hidden;
        text-overflow: ellipsis;
        padding-block: .3em;
        margin-block: -.3em;
      }
    }
    @media (min-width: 1024px) {
      .loader-overlay.to-admin .loader-header { padding: 20px 40px; gap: 14px; }
      .loader-overlay.to-admin .loader-header-logo {
        display: block;
        width: 38px;
        height: 38px;
        object-fit: contain;
        filter: drop-shadow(0 4px 10px rgba(3, 60, 84, .25));
      }
      .loader-overlay.to-admin .loader-header-title { font-size: 1.35rem; }
    }

    /* ---------- Exit: content lifts away, the liquid pulls up and off,
       and the header it drags behind it lands at the top ---------- */
    .loader-overlay.show.leaving .loader-center { animation: loaderCenterOut .45s var(--ld-ease) forwards; }
    .loader-overlay.show.leaving .loader-reveal { animation: loaderFadeIn .25s .2s ease forwards; }
    .loader-overlay.show.leaving .loader-liquid { animation: loaderSweep 1.15s cubic-bezier(.7, 0, .25, 1) forwards; }

    @keyframes loaderFadeIn { to { opacity: 1; } }
    @keyframes loaderFloat { 50% { transform: translateY(-6px); } }
    @keyframes loaderSpringIn { to { transform: scale(1) rotate(0); } }
    @keyframes loaderLogoIn { to { opacity: 1; transform: none; } }
    @keyframes loaderShine { to { transform: translateX(360%) skewX(-18deg); } }
    @keyframes loaderRingPulse {
      0%   { transform: scale(.88); opacity: 0; }
      25%  { opacity: 1; }
      100% { transform: scale(1.22); opacity: 0; }
    }
    @keyframes loaderSpark {
      0%   { opacity: 0; transform: translate(0, 0) scale(.4); }
      30%  { opacity: 1; }
      100% { opacity: 0; transform: translate(var(--x), var(--y)) scale(1); }
    }
    @keyframes loaderRise { to { transform: none; } }
    @keyframes loaderPillIn { to { opacity: 1; transform: none; } }
    @keyframes loaderFill { from { transform: translateY(100%); } to { transform: translateY(80%); } }
    @keyframes loaderBob { from { transform: translateY(80%); } to { transform: translateY(77.5%); } }
    @keyframes loaderWaveX { from { transform: translateX(0); } to { transform: translateX(-50%); } }
    @keyframes loaderCenterOut { to { opacity: 0; transform: translateY(calc(-50% - 30px)) scale(.94); } }
    @keyframes loaderSweep {
      from { transform: translateY(79%); }
      to   { transform: translateY(-100%); }
    }

    /* Responsive adjustments */
    @media (max-width: 640px) {
      .card-header {
        padding: 28px 20px;
      }

      .card-body {
        padding: 32px 22px 30px;
      }
      .site-header {
        padding: 1rem;
      }

      .login-card {
        max-width: 100%;
      }
    }

    /* Performance optimizations */
    .will-change {
      will-change: transform, opacity;
    }

    /* Reduced motion for accessibility */
    @media (prefers-reduced-motion: reduce) {
      * {
        animation-duration: 0.01ms !important;
        animation-iteration-count: 1 !important;
        transition-duration: 0.01ms !important;
      }
    }
  </style>
</head>
<body>
  <!-- Header -->
  <header class="site-header">
    <h1 class="site-title">ثانوية أحمد البشر الرومي</h1>
  </header>

  <!-- Main Content -->
  <main class="main-container">
    <div class="login-card">
      <div class="card-header">
        <h2>تسجيل الدخول</h2>
      </div>

      <div class="card-body">
      <div class="form-group">
        <label for="loginEmail" class="form-label">رقم المستخدم</label>
        <div class="input-container">
          <div class="input-icon" aria-hidden="true">
            <i class="fas fa-id-card"></i>
          </div>
          <input
            type="text"
            id="loginEmail"
            class="form-input"
            placeholder="مثال: 123456"
            autocomplete="off"
            inputmode="numeric"
            pattern="[0-9]*"
          >
        </div>
      </div>

      <div class="form-group">
        <label for="loginPassword" class="form-label">كلمة المرور</label>
        <div class="input-container">
          <input type="password" id="loginPassword" class="form-input" placeholder="••••••••" autocomplete="current-password">
          <button type="button" class="password-toggle" id="togglePassword" aria-label="إظهار كلمة المرور">
            <i class="fas fa-eye"></i>
          </button>
        </div>
      </div>

      <div id="rememberToggle" class="remember-me" role="checkbox" aria-checked="false" tabindex="0">
        <div class="checkmark" aria-hidden="true">✓</div>
        <div>تذكرني</div>
      </div>

      <button id="loginBtn" class="btn-login">دخول</button>

      <div id="msg" class="message" role="alert"></div>
      </div>
    </div>
  </main>

  <!-- Loading Overlay -->
  <div id="loader" class="loader-overlay" aria-hidden="true">
    <div class="loader-center">
      <div class="loader-emblem">
        <span class="loader-ring"></span>
        <span class="loader-spark" style="--x:-138px;--y:-48px"></span>
        <span class="loader-spark" style="--x:142px;--y:-40px"></span>
        <span class="loader-spark" style="--x:-124px;--y:60px"></span>
        <span class="loader-spark" style="--x:130px;--y:56px"></span>
        <span class="loader-spark sm" style="--x:-6px;--y:-84px"></span>
        <span class="loader-spark sm" style="--x:34px;--y:86px"></span>
        <span class="loader-tile">
          <img class="loader-logo" src="./images/WhiteLogo.png" alt="">
        </span>
      </div>
      <div class="loader-mask"><h2 class="loader-title">مرحباً بك</h2></div>
      <p id="loaderName" class="loader-pill" hidden>
        <i class="fas fa-circle-user" aria-hidden="true"></i>
        <span id="loaderNameText"></span>
      </p>
    </div>

    <div class="loader-reveal"></div>

    <div class="loader-liquid">
      <svg class="loader-wave back" viewBox="0 0 2880 100" preserveAspectRatio="none"><path d="M0 50 Q 180 14 360 50 T 720 50 T 1080 50 T 1440 50 T 1800 50 T 2160 50 T 2520 50 T 2880 50 V100 H0 Z"/></svg>
      <svg class="loader-wave front" viewBox="0 0 2880 100" preserveAspectRatio="none"><path d="M0 50 Q 180 14 360 50 T 720 50 T 1080 50 T 1440 50 T 1800 50 T 2160 50 T 2520 50 T 2880 50 V100 H0 Z"/></svg>
      <div class="loader-liquid-body"></div>
      <div class="loader-header">
        <div class="loader-header-inner">
          <span class="loader-header-btn"><i class="fas fa-bars"></i></span>
          <img class="loader-header-logo" src="./images/schoollogo.png" alt="">
          <span class="loader-header-title">ثانوية أحمد البشر الرومي</span>
        </div>
      </div>
    </div>
  </div>

  <script type="module">
    import { firebaseConfig } from "./shared/firebase.js";
    // ===== Firebase SDKs (ES modules over CDN)
    import { initializeApp } from "./shared/firebase.js";
    import {
      getAuth,
      browserLocalPersistence,
      setPersistence,
      signInWithEmailAndPassword,
      onAuthStateChanged,
      signOut
    } from "./shared/firebase.js";
    import {
      getFirestore,
      doc,
      getDoc
    } from "./shared/firebase.js";

    // ===== Config
    

    // ===== Init
    const app  = initializeApp(firebaseConfig);
    const auth = getAuth(app);
    const db   = getFirestore(app);
    // Signed-in sessions always persist across browser restarts now (not
    // just when "تذكرني" is checked) — teachers stay logged in until they
    // explicitly log out, which is what actually ends the session
    // (signOut() clears it regardless of persistence mode). "تذكرني" below
    // is now purely about pre-filling رقم المستخدم on the next visit.
    setPersistence(auth, browserLocalPersistence).catch((e) => {
      console.error("setPersistence failed:", e);
    });

    // ===== UI refs
    const emailEl = document.getElementById('loginEmail'); // now holds civil id number
    const passEl  = document.getElementById('loginPassword');
    const loginBtn = document.getElementById('loginBtn');
    const msgEl = document.getElementById('msg');
    const togglePasswordBtn = document.getElementById('togglePassword');
    const eyeIcon = togglePasswordBtn.querySelector('i');
    const loader = document.getElementById('loader');
    const loaderName = document.getElementById('loaderName');
    const loaderNameText = document.getElementById('loaderNameText');
    function normalizeRole(value) {
      return (value || '').toString().trim().toLowerCase();
    }

    function isTruthyFlag(value) {
      return value === true || value === 'true' || value === 1 || value === '1';
    }

    function getRouteForProfile(profile) {
      const role = normalizeRole(profile?.role);
      if (role === 'admin') return './admins/adminpage.html';
      // Department heads use the same teachers hub as everyone else.
      if (role === 'head') return './teachers/user.html';
      // Supervisors land on the same teachers/user.html hub as everyone
      // else now — it recognizes isSupervisor itself and shows the extra
      // sidebar access, so there's no separate supervisor landing page.
      if (role === 'user') return './teachers/user.html';
      return null;
    }

    // Force numeric only for civil id input (works with paste too)
    function enforceDigitsOnly(inputEl) {
      inputEl.addEventListener('input', () => {
        const cleaned = inputEl.value.replace(/\D+/g, '');
        if (inputEl.value !== cleaned) inputEl.value = cleaned;
      });
    }
    enforceDigitsOnly(emailEl);

    // Build the real email used for Firebase auth
    function buildTeacherEmailFromCivilId(civilId) {
      const digits = (civilId || '').toString().replace(/\D+/g, '');
      return `t${digits}@gmail.com`;
    }

    // Remember me toggle
    const rememberToggle = document.getElementById('rememberToggle');
    let remember = false;

    function setRememberUI(state) {
      remember = state;
      rememberToggle.classList.toggle('active', state);
      rememberToggle.setAttribute('aria-checked', state ? 'true' : 'false');
    }

    rememberToggle.addEventListener('click', () => setRememberUI(!remember));
    rememberToggle.addEventListener('keydown', (e) => {
      if (e.key === 'Enter' || e.key === ' ') {
        e.preventDefault();
        setRememberUI(!remember);
      }
    });

    // Prefill from localStorage if previously remembered
    try {
      const saved = JSON.parse(localStorage.getItem('rememberLogin') || 'null');
      if (saved && saved.civilId) {
        emailEl.value = saved.civilId;
        setRememberUI(true);
        if (saved.password) {
          localStorage.setItem('rememberLogin', JSON.stringify({ civilId: saved.civilId }));
        }
      } else if (saved && saved.password) {
        localStorage.removeItem('rememberLogin');
      }
    } catch (e) {
      console.error("Error loading saved credentials:", e);
    }

    // Password visibility toggle
    let passwordVisible = false;
    function togglePasswordVisibility() {
      passwordVisible = !passwordVisible;
      passEl.type = passwordVisible ? 'text' : 'password';
      eyeIcon.className = passwordVisible ? 'fas fa-eye-slash' : 'fas fa-eye';
      togglePasswordBtn.setAttribute('aria-label', passwordVisible ? 'إخفاء كلمة المرور' : 'إظهار كلمة المرور');

      togglePasswordBtn.classList.add('will-change');
      setTimeout(() => {
        togglePasswordBtn.classList.remove('will-change');
      }, 300);
    }

    togglePasswordBtn.addEventListener('click', togglePasswordVisibility);

    // Helpers
    function showMsg(text, isSuccess = false) {
      if (text) {
        msgEl.textContent = text;
        msgEl.className = 'message ' + (isSuccess ? 'success' : 'error') + ' show';

        setTimeout(() => {
          msgEl.textContent = '';
          msgEl.className = 'message';
        }, 5000);
      } else {
        msgEl.textContent = '';
        msgEl.className = 'message';
      }
    }

    function validate() {
      const civilId = emailEl.value.trim();
      const pass = passEl.value;

      if (!civilId) return 'يرجى إدخال رقم المستخدم';
      if (!pass) return 'يرجى إدخال كلمة المرور';

      // Ensure digits only
      const digitsOnly = civilId.replace(/\D+/g, '');
      if (!digitsOnly) return 'يرجى إدخال رقم المستخدم بشكل صحيح';
      if (digitsOnly.length !== civilId.length) return 'يرجى إدخال أرقام فقط';

      return null;
    }

    // Loader overlay animation
    let loaderShownAtMs = null;
    const REDIRECT_DELAY_MS = 2300; // hold time before the closing transition begins
    const EXIT_DURATION_MS = 1300;  // liquid pulls up, the header lands, then the page navigates
    let isLoginAttemptInProgress = false;
    let redirectScheduled = false;

    // The name pill stays hidden until a name is known; if it arrives after
    // the overlay opened (profile lookup), un-hiding it plays its pop-in then.
    function setLoaderWelcomeName(name) {
      const safeName = (name || '').toString().trim();
      loaderNameText.textContent = safeName;
      loaderName.hidden = !safeName;
    }

    function showLoader(name) {
      setLoaderWelcomeName(name);
      loader.classList.remove('leaving');
      loader.classList.add('show');
      document.body.style.overflow = 'hidden';
      if (!loaderShownAtMs) loaderShownAtMs = Date.now();
    }

    function hideLoader() {
      loader.classList.remove('show');
      loader.classList.remove('leaving');
      loaderShownAtMs = null;
      document.body.style.overflow = '';
    }

    function getStoredAuthInfo() {
      try {
        const raw = sessionStorage.getItem('auth');
        return raw ? JSON.parse(raw) : null;
      } catch (e) {
        console.error("Stored auth parse error:", e);
        return null;
      }
    }

    // ---- Warm up the next page while the loader plays ----
    // Once the destination is known, the loader holds for REDIRECT_DELAY_MS
    // with the browser otherwise idle. That time now goes into fetching the
    // destination page and every same-origin file it pulls in — its CSS,
    // images, module scripts and everything those import — so they're
    // already in the HTTP cache when it loads. /shared/* and /images/* are
    // cacheable (see _headers), so the next page doesn't touch the network
    // for those at all; the rest come back as cheap revalidations.
    //
    // Fire-and-forget: nothing here is awaited by the redirect, so the
    // animation's timing is exactly what it was. Whatever hasn't finished
    // when the page navigates is simply dropped. Same-origin only — the
    // Firebase SDK and Font Awesome are already cached from this page, and
    // this page's CSP wouldn't allow fetching other origins anyway.
    const warmedUrls = new Set();
    const MAX_WARMED_FILES = 60; // a safety cap; a page uses ~15-25

    function sameOriginUrl(raw, base) {
      if (!raw) return null;
      try {
        const u = new URL(raw, base);
        return u.origin === location.origin ? u.href.split('#')[0] : null;
      } catch (e) {
        return null;
      }
    }

    function warmUrl(url) {
      if (!url || warmedUrls.has(url) || warmedUrls.size >= MAX_WARMED_FILES) return Promise.resolve(null);
      warmedUrls.add(url);
      return fetch(url, { credentials: 'same-origin' })
        .then((res) => (res.ok ? res : null))
        .catch(() => null);
    }

    // `import ... from "x"`, `export ... from "x"`, `import "x"`, `import("x")`.
    // A stray match inside a string or comment only costs one extra fetch.
    const IMPORT_SPECIFIER_RE = /(?:\bfrom\s*|\bimport\s*\(\s*|\bimport\s+)["']([^"']+)["']/g;
    function importedUrls(jsText, baseUrl) {
      const urls = [];
      for (const m of jsText.matchAll(IMPORT_SPECIFIER_RE)) {
        // Real module specifiers here are always paths; skipping anything else
        // avoids 404s from ordinary strings like "... from 'online'".
        if (!/^(?:\.{1,2}\/|\/)/.test(m[1])) continue;
        const u = sameOriginUrl(m[1], baseUrl);
        if (u) urls.push(u);
      }
      return urls;
    }

    async function warmModule(url) {
      const res = await warmUrl(url);
      if (!res) return;
      const text = await res.text();
      await Promise.all(importedUrls(text, url).map(warmModule));
    }

    async function warmDestination(route) {
      const pageUrl = sameOriginUrl(route, location.href);
      const res = await warmUrl(pageUrl);
      if (!res) return;
      const page = new DOMParser().parseFromString(await res.text(), 'text/html');
      const attr = (el) => el.getAttribute('href') || el.getAttribute('src');
      const jobs = [];

      page.querySelectorAll('link[rel~="stylesheet"], link[rel~="preload"], link[rel~="icon"], img[src], script[src]:not([type="module"])')
        .forEach((el) => jobs.push(warmUrl(sameOriginUrl(attr(el), pageUrl))));
      page.querySelectorAll('link[rel="modulepreload"], script[type="module"][src]')
        .forEach((el) => {
          const u = sameOriginUrl(attr(el), pageUrl);
          if (u) jobs.push(warmModule(u));
        });
      page.querySelectorAll('script[type="module"]:not([src])')
        .forEach((el) => importedUrls(el.textContent, pageUrl).forEach((u) => jobs.push(warmModule(u))));

      await Promise.all(jobs);
    }

    function warmNextPage(route) {
      if (route) warmDestination(route).catch(() => {});
    }

    const bootstrapAuth = getStoredAuthInfo();
    if (bootstrapAuth?.loggedIn) {
      showLoader(bootstrapAuth.name || '');
      // Already signed in: the route this session last went to is known
      // right now, before the profile lookup below confirms it.
      warmNextPage(bootstrapAuth.route);
    }

    async function getUserProfile(uid) {
      const profile = { name: null, subject: null, role: null, isSupervisor: false };
      if (!uid) return profile;

      try {
        const ref = doc(db, 'teachers', uid);
        const snap = await getDoc(ref);
        if (snap.exists()) {
          const d = snap.data();
          profile.name = d.name ?? null;
          profile.subject = d.subject ?? null;
          profile.role = d.role ?? null;
          profile.isSupervisor = d.isSupervisor ?? false;
        }
      } catch (e) {
        console.error("Profile lookup error:", e);
      }

      return profile;
    }

    function getFriendlyAuthError(error) {
      const code = error?.code || '';
      const invalidCodes = new Set([
        'auth/invalid-credential',
        'auth/wrong-password',
        'auth/user-not-found',
        'auth/invalid-email',
        'auth/missing-password'
      ]);

      if (invalidCodes.has(code)) return 'رقم المستخدم أو كلمة المرور غير صحيحة.';
      if (code === 'auth/too-many-requests') return 'تم تجاوز عدد المحاولات المسموح. حاول مرة أخرى بعد قليل.';
      if (code === 'app/unauthorized-profile') return 'هذا الحساب لا يملك صلاحية الوصول للمنصة.';
      if (code === 'auth/network-request-failed') return 'لا يوجد اتصال جيد بالإنترنت. يرجى المحاولة مرة أخرى.';
      return 'تعذر تسجيل الدخول حالياً. يرجى المحاولة مرة أخرى.';
    }

    function redirectToProfileRoute(profile) {
      const route = getRouteForProfile(profile);
      if (!route) {
        sessionStorage.removeItem('auth');
        hideLoader();
        showMsg(getFriendlyAuthError({ code: 'app/unauthorized-profile' }));
        signOut(auth).catch(() => {});
        return;
      }
      // Play the closing sweep before the hard navigation, so the animation
      // resolves (on a plain page-coloured screen) instead of being cut off
      // mid-frame by the browser unloading the page. The header it lands
      // copies whichever page comes next.
      loader.classList.toggle('to-admin', route.includes('/admins/'));
      loader.classList.add('leaving');
      setTimeout(() => {
        window.location.href = route;
      }, EXIT_DURATION_MS);
    }

    function startLoaderThenRedirect(profile) {
      if (redirectScheduled) return;
      redirectScheduled = true;

      const safeProfile = profile || {};
      showLoader(safeProfile.name);

      setTimeout(() => {
        redirectToProfileRoute(safeProfile);
      }, REDIRECT_DELAY_MS);
    }

    function scheduleRedirectWithElapsed(profile, startedAtMs) {
      if (redirectScheduled) return;
      redirectScheduled = true;

      const safeProfile = profile || {};
      const elapsedMs = Date.now() - (startedAtMs || Date.now());
      const remainingMs = Math.max(0, REDIRECT_DELAY_MS - elapsedMs);

      setTimeout(() => {
        redirectToProfileRoute(safeProfile);
      }, remainingMs);
    }


    // Login flow
    loginBtn.addEventListener('click', async () => {
      showMsg('');

      const err = validate();
      if (err) {
        showMsg(err);
        return;
      }

      const civilId = emailEl.value.trim();
      const password = passEl.value;

      // Convert civil id to the hidden email format for Firebase Auth
      const email = buildTeacherEmailFromCivilId(civilId);
      isLoginAttemptInProgress = true;

      try {
        loginBtn.innerHTML = '<i class="fas fa-spinner fa-spin"></i> جاري تسجيل الدخول';
        loginBtn.disabled = true;

        const cred = await signInWithEmailAndPassword(auth, email, password);

        const uid = cred.user.uid;
        const profile = await getUserProfile(uid);
        const route = getRouteForProfile(profile);
        if (!route) {
          await signOut(auth);
          throw { code: 'app/unauthorized-profile' };
        }
        warmNextPage(route);

        const authInfo = {
          loggedIn: true,
          uid,
          name: profile.name,
          role: profile.role,
          isSupervisor: profile.isSupervisor,
          route,
          ts: Date.now()
        };
        sessionStorage.setItem('auth', JSON.stringify(authInfo));

        if (remember) {
          localStorage.setItem('rememberLogin', JSON.stringify({ civilId }));
        } else {
          localStorage.removeItem('rememberLogin');
        }

        // The loader overlay takes over the screen immediately and already
        // greets the user by name — a form message here would only ever be
        // seen if the overlay failed to stay opaque, so there's no reason
        // to set one up in the first place.
        startLoaderThenRedirect(profile);
      } catch (e) {
        console.error("Login error:", e);
        passEl.value = '';
        showMsg(getFriendlyAuthError(e));
      } finally {
        loginBtn.innerHTML = 'دخول';
        isLoginAttemptInProgress = false;
        loginBtn.disabled = false;
      }
    });

    onAuthStateChanged(auth, async (user) => {
      if (isLoginAttemptInProgress || redirectScheduled) return;

      if (!user) {
        if (loader.classList.contains('show')) {
          hideLoader();
        }
        return;
      }

      const flowStartedAt = loaderShownAtMs || Date.now();
      const storedAuth = getStoredAuthInfo();
      if (!loader.classList.contains('show')) {
        showLoader(storedAuth?.name || '');
      }

      const profile = await getUserProfile(user.uid);
      const route = getRouteForProfile(profile);
      if (!route) {
        sessionStorage.removeItem('auth');
        hideLoader();
        showMsg(getFriendlyAuthError({ code: 'app/unauthorized-profile' }));
        await signOut(auth).catch(() => {});
        return;
      }
      // Usually a no-op (the bootstrap above already started on this
      // route); covers a first visit or a role that changed since.
      warmNextPage(route);

      const authInfo = {
        loggedIn: true,
        uid: user.uid,
        name: profile.name,
        role: profile.role,
        isSupervisor: profile.isSupervisor,
        route,
        ts: Date.now()
      };
      sessionStorage.setItem('auth', JSON.stringify(authInfo));
      setLoaderWelcomeName(profile.name || storedAuth?.name || '');

      scheduleRedirectWithElapsed(profile, flowStartedAt);
    });

    document.querySelectorAll('.form-input').forEach(input => {
      input.addEventListener('focus', () => {
        input.parentElement.classList.add('will-change');
      });

      input.addEventListener('blur', () => {
        input.parentElement.classList.remove('will-change');
      });
    });

    document.addEventListener('keydown', (e) => {
      if (e.key === 'Enter' && !loginBtn.disabled) {
        loginBtn.click();
      }
    });
  </script>
  <script src="./shared/prefetch-nav.js" defer></script>
  <script src="./name-glow.js" defer></script>
</body>
</html>
